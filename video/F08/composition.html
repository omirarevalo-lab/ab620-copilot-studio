  /* F08 · Exam map and glossary. "The trail map" in the 3840x2160 world.

  const D = (id, st, html) => `<div class="w"${id ? ` id="${id}"` : ''} style="${st}">${html || ''}</div>`;
  const H = (id, st, html) => D(id, st + ';opacity:0', html);
  const T = (x, y, fs, col, t, id, ex, cls) => `<div class="px${cls ? ' ' + cls : ''}"${id ? ` id="${id}"` : ''} style="left:${x}px;top:${y}px;font-size:${fs}px;color:${col};${ex || ''}">${t}</div>`;
  const pers = (c, w) => person(c).replace('width="90" height="200"', `width="${w}" height="${Math.round(w * 200 / 90)}"`);
  const CHW = (text, fs, icon) => Math.round(Math.max(...text.split('<br>').map((l) => l.length)) * fs * 0.58 + 76 + (icon ? fs * 1.3 : 0));
  const CHC = (id, cx, y, text, col, fs, icon, bg, ex, w0) => { const w = w0 || CHW(text, fs, icon);
    return H(id, `left:${Math.round(cx - w / 2)}px;top:${y}px;width:${w}px;border:6px solid ${col};border-radius:26px;background:${bg || '#fff'};color:${col};font-size:${fs}px;font-weight:800;line-height:1.12;padding:10px 20px;display:flex;align-items:center;justify-content:center;gap:14px;text-align:center;box-shadow:0 10px 30px rgba(16,24,40,.12);box-sizing:content-box;${ex || ''}`,

  const CHROW = (cx, y, items, col, bg, fs) => { const ws = items.map((it) => CHW(it[1], fs) + 12); const tot = ws.reduce((a, b) => a + b, 0) + 48 * (items.length - 1); let x = cx - tot / 2;
    return items.map((it, i) => { const c = x + ws[i] / 2; x += ws[i] + 48; return CHC(it[0], c, y, it[1], col, fs, null, bg); }).join(''); };
  const camAt = (x, y, s, t) => CAM(x, y, s, t, 0.01);
  const UIIN2 = (sel, t) => { ON('#uiBack', t - 0.2, 0.3); tl.fromTo(sel, { opacity: 0, scale: 0.28 }, { opacity: 1, scale: 1, duration: 0.7, ease: 'power3.out' }, t); };
  const UIOUT2 = (sel, t) => { tl.to(sel, { opacity: 0, scale: 0.28, duration: 0.5, ease: 'power3.in' }, t); OFF('#uiBack', t + 0.5, 0.4); };
  const SWX = (a, b, t) => { tl.to(a, { opacity: 0, duration: 0.25 }, t); tl.fromTo(b, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, immediateRender: false }, t + 0.1); };

    <path d="M72 140 Q72 112 112 112 Q152 112 152 140 L158 308 L66 308 Z" fill="#8a5cd6"/><path d="M148 150 L190 226" stroke="#8a5cd6" stroke-width="26" stroke-linecap="round"/><circle cx="192" cy="230" r="14" fill="#f2c9a6"/>
    <circle cx="112" cy="72" r="42" fill="#f2c9a6"/><path d="M66 72 Q66 26 114 26 Q158 28 158 72 Q150 48 112 46 Q84 46 66 72Z" fill="#2a1f2d"/><path d="M66 70 Q60 110 76 130 Q70 96 78 70Z" fill="#2a1f2d"/>
    <circle cx="130" cy="78" r="5" fill="#141821"/><circle cx="104" cy="78" r="5" fill="#141821"/><path d="M110 98 Q118 104 126 98" stroke="#141821" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`));

      T(30, 22, 44, NAVY, 'Skills measured') + [['Plan and configure…', BLUE], ['Integrate and extend…', TEAL], ['Test and manage…', AMB]].map((r, i) => D('', `left:30px;top:${96 + i * 66}px;width:20px;height:20px;border-radius:50%;background:${r[1]};margin-top:12px`) + T(64, 96 + i * 66, 38, '#141821', r[0])).join('') +

  ADD(say('bWhere', 410, 1318, 'where to start?', 'blue') + CHC('cLong', 1090, 1735, 'long list', RED, 44, null, REDs));

  /* ═════════ HILL SIGNS / PLAQUES / CHIPS ═════════ */
  const SIGN = (id, l, t, w, col, d, name) => H(id, `left:${l}px;top:${t}px;width:${w}px;height:175px;border:7px solid ${col};border-radius:24px;background:#fff;box-shadow:0 14px 40px rgba(16,24,40,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:66px;font-weight:800;line-height:1.1;color:#141821;box-sizing:border-box`, `<span style="color:${col}">${d}</span><span>${name}</span>`);
  const PLQ = (id, l, t, w, col, bg, txt) => H(id, `left:${l}px;top:${t}px;width:${w}px;height:100px;border:7px solid ${col};border-radius:50px;background:${bg};color:${col};font-size:64px;font-weight:800;text-align:center;line-height:86px;box-sizing:border-box`, txt);

  ADD(CHROW(1250, 1050, [['c11', 'planning'], ['c12', 'topics']], BLUE, BLUEs, 56) + CHC('c13', 1250, 1175, 'agent flows', BLUE, 56, null, BLUEs) +
