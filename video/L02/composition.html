<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>L02 · Identity and authentication · world style</title>
<script src="gsap.min.js"></script>
<!-- TAIL 2.5 -->
<link rel="stylesheet" href="style.css" />
<style>
  .bf { white-space: nowrap; position: absolute; left: 0; top: 0; width: 260px; height: 130px; box-sizing: border-box; border-radius: 22px; border: 5px solid #fff; display: flex; align-items: center; justify-content: center; gap: 10px; color: #fff; font-weight: 800; backface-visibility: hidden; box-shadow: 0 14px 34px rgba(16,24,40,.3); }
  .nd { border: 3px solid var(--line2); border-radius: 18px; padding: 14px 24px; background: #fff; }
  .nd small { display: block; font-size: 26px; font-weight: 700; color: var(--muted); }
  .vx { background: #e6ecfb; color: #2f5bd3; border-radius: 10px; padding: 2px 12px; font-weight: 800; }
  .vr { display: flex; align-items: center; justify-content: space-between; height: 84px; border-bottom: 2px solid var(--line); font-size: 32px; opacity: 0; }
  .vr span { color: var(--muted); font-weight: 700; }
  .rad { display: flex; align-items: center; gap: 22px; width: 1000px; height: 84px; box-sizing: border-box; padding: 0 28px; margin-bottom: 14px; border: 3px solid var(--line2); border-radius: 16px; font-size: 32px; font-weight: 700; background: #fff; }
  .rad i { width: 38px; height: 38px; border-radius: 50%; border: 4px solid #8a93a6; box-sizing: border-box; position: relative; flex: 0 0 auto; }
  .rad i b { position: absolute; left: 6px; top: 6px; width: 18px; height: 18px; border-radius: 50%; background: #2f5bd3; opacity: 0; }
  .bar2 { height: 20px; border-radius: 10px; background: #e2e5eb; margin: 16px 0; width: 90%; }
  .dr { position: absolute; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
<section class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="2">
<div id="stage"></div>
</section>
<audio id="narr" src="narration.mp3" data-start="0" data-duration="{{DURATION}}" data-track-index="1" data-volume="1"></audio>
</div>

<!-- @world -->
<script>
  /* L02 · Identity and authentication. World 3840x2160:
     Contoso building 80,300 (1700x1200) · doors A/B/C at x 180/740/1300, y 900 (380x580) · Teams room y 440-760
     maker 1800,1000 · portal storefront 2780,800 · admin 3330,250 · annex (scene 12) on the floor 1000,1320 · free wall area 1850-2750 x 100-900 */
  const PX = (id, x, y, t, c, fs) => pill(id, x, y, t, c).replace('style="', 'style="font-size:' + (fs || 34) + 'px;');
  const BLUE = '#2f5bd3', PUR = '#8a5cd6', GRN = '#1e7f4f', RED = '#c4392f', AMB = '#d98a00', NAVY = '#1f2a44', GREY = '#8a93a6';
  const sc = (svg, k) => svg.replace(/width="([\d.]+)" height="([\d.]+)"/, (m, w, h) => `width="${w * k}" height="${h * k}"`);
  const WALK = (sel, x0, y0, x1, y1, t, d, ease) => tl.fromTo(sel, { x: x0, y: y0 }, { x: x1, y: y1, duration: d, ease: ease || 'none', immediateRender: false }, t);
  const SETP = (sel, x, y, t) => tl.set(sel, { x: x, y: y }, t);
  const emp = (id, x, y, c, card, k, vis) => { k = k || 1; return `<div class="w ${vis ? "" : "wk"}" id="${id}" style="${at(x, y)};width:${90 * k}px;height:${200 * k}px;opacity:${vis ? 1 : 0}">${sc(person(c), k)}${card ? `<div class="w" style="left:${62 * k}px;top:${112 * k}px;width:${40 * k}px;height:${54 * k}px;border-radius:7px;background:${card};border:3px solid #fff;box-sizing:border-box"></div>` : ''}</div>`; };
  const stranger = (id, k) => { k = k || 1; return `<div class="w wk" id="${id}" style="left:0;top:0;opacity:0"><svg width="${90 * k}" height="${200 * k}" viewBox="0 0 90 200"><circle cx="45" cy="34" r="28" fill="#c9ced8"/><text x="45" y="48" font-size="40" font-weight="800" fill="#5d6472" text-anchor="middle">?</text><path d="M8 196 Q8 76 45 70 Q82 76 82 196 Z" fill="#8a93a6"/></svg></div>`; };
  const agentS = (id, x, y, k, extra, o) => `<div class="w" id="${id}_w" style="${at(x, y)};transform:scale(${k});transform-origin:0 0">${agent(id, 0, 0, o)}${extra || ''}</div>`;
  const door = (id, x, col) => `<div class="w" id="${id}" style="left:${x}px;top:900px;width:380px;height:580px">
    <svg class="w" style="left:0;top:0" width="380" height="580" viewBox="0 0 380 580"><rect width="380" height="580" rx="18" fill="${col}"/><rect x="18" y="18" width="344" height="562" fill="#27324f"/></svg>
    <div class="w" id="${id}_l" style="left:18px;top:18px;width:344px;height:562px;transform-origin:0 50%"><svg width="344" height="562" viewBox="0 0 344 562"><rect width="344" height="562" fill="#d4e3f8"/><rect x="30" y="30" width="284" height="300" fill="#eaf2fd" stroke="${col}" stroke-width="6"/><rect width="344" height="562" fill="none" stroke="${col}" stroke-width="10"/><circle cx="300" cy="400" r="16" fill="${col}"/></svg></div>
    <div class="w" id="${id}_f" style="left:0;top:0;width:380px;height:580px;border-radius:18px;background:${RED};opacity:0"></div></div>`;
  const bez = (p, t) => { const u = 1 - t; return [u * u * u * p[0] + 3 * u * u * t * p[2] + 3 * u * t * t * p[4] + t * t * t * p[6], u * u * u * p[1] + 3 * u * u * t * p[3] + 3 * u * t * t * p[5] + t * t * t * p[7]]; };
  const RIB = [1540, 1330, 1800, 800, 2600, 700, 3050, 1050];
  const RIDE = (sel, t, dur) => { const n = 14; const p0 = bez(RIB, 0); tl.set(sel, { x: p0[0], y: p0[1] }, t); for (let k = 1; k <= n; k++) { const p = bez(RIB, k / n); tl.to(sel, { x: p[0], y: p[1], duration: dur / n, ease: 'none' }, t + (k - 1) * dur / n); } };
  const pw = (id, x, y, text, cls, fs) => `<div class="w" id="${id}" style="left:0;top:0;opacity:0">${PX(id + '_p', x, y, text, cls, fs).replace('style="', 'style="opacity:1;')}</div>`;


  /* ───────── building, doors ───────── */
  ADD(`<svg class="w" style="left:80px;top:300px" width="1700" height="1200" viewBox="0 0 1700 1200">
    <rect x="0" y="60" width="1700" height="1140" rx="30" fill="#dde5f4" stroke="#9fb0d6" stroke-width="8"/><rect x="0" y="0" width="1700" height="120" rx="26" fill="#1f2a44"/>
    <text x="850" y="88" font-size="72" font-weight="800" fill="#fff" text-anchor="middle">Contoso</text>
    <rect x="40" y="140" width="1620" height="320" rx="22" fill="#f4f7ff" stroke="#9fb0d6" stroke-width="6"/><rect x="40" y="440" width="1620" height="20" fill="#c9d8f7"/>
    <rect x="400" y="200" width="260" height="56" rx="26" fill="#e1e8f7"/><rect x="400" y="280" width="190" height="56" rx="26" fill="#e1e8f7"/><rect x="1000" y="190" width="180" height="56" rx="26" fill="#e1e8f7"/></svg>`);
  ADD(door('dA', 180, GREY) + door('dB', 740, BLUE) + door('dC', 1300, PUR));
  /* ───────── cables / ribbon (behind everything) ───────── */
  ADD(`<svg class="w" id="cabs" style="left:0;top:0" width="3840" height="2160" viewBox="0 0 3840 2160">
    ${cable('rib', 'M' + RIB[0] + ' ' + RIB[1] + ' C ' + RIB[2] + ' ' + RIB[3] + ', ' + RIB[4] + ' ' + RIB[5] + ', ' + RIB[6] + ' ' + RIB[7], PUR, 22)}
    ${cable('wTe', 'M570 1640 C 570 1540, 930 1580, 930 1486', BLUE, 16)}${cable('wM3', 'M1070 1640 C 1070 1540, 930 1580, 930 1486', BLUE, 16)}
    ${cable('wBad', 'M1070 1640 C 1070 1560, 1490 1580, 1490 1486', RED, 16, '24 14')}
  </svg>`);
  /* badge reader (door B) */
  ADD(`<div class="w" id="rd" style="left:1140px;top:1050px;width:120px;height:200px;border-radius:22px;background:#1f2a44;border:5px solid #fff;box-sizing:border-box;box-shadow:var(--shadow);opacity:0">
    <div class="w" style="left:20px;top:16px;width:70px;height:70px;border-radius:50%;background:#2f5bd3;color:#fff;display:flex;align-items:center;justify-content:center">${IC('shield_checkmark', 'width:44px;height:44px')}</div>
    <div class="w" style="left:20px;top:100px;width:70px;height:12px;border-radius:6px;background:#3a4a78"></div><div class="w" id="rdLed" style="left:35px;top:132px;width:40px;height:40px;border-radius:50%;background:#8a93a6"></div></div>`);
  ADD(`<div class="w" id="gr" style="left:1170px;top:910px;width:100px;height:100px;border-radius:50%;background:#fff;border:6px solid #2f5bd3;color:#2f5bd3;display:flex;align-items:center;justify-content:center;opacity:0">${IC('settings', 'width:64px;height:64px')}</div>`);
  /* padlock + key ring (door C) */
  ADD(`<svg class="w" id="pl" style="left:1405px;top:1060px;opacity:0" width="170" height="220" viewBox="0 0 170 220"><g id="pl_s"><path d="M40 100 V70 a45 45 0 0 1 90 0 V100" fill="none" stroke="#8a5cd6" stroke-width="20"/></g><rect x="10" y="95" width="150" height="120" rx="22" fill="#8a5cd6" stroke="#fff" stroke-width="6"/><circle cx="85" cy="150" r="14" fill="#fff"/><rect x="79" y="155" width="12" height="36" rx="5" fill="#fff"/></svg>
    <div class="w" id="kr" style="left:1520px;top:1290px;width:300px;height:140px;opacity:0"><svg class="w" style="left:0;top:0" width="90" height="90" viewBox="0 0 90 90"><circle cx="45" cy="45" r="34" fill="none" stroke="#8a93a6" stroke-width="10"/></svg>${IC('key', 'position:absolute;left:92px;top:8px;width:70px;height:70px;color:#d98a00')}<div style="position:absolute;left:6px;top:92px;background:#fff;border:4px solid #8a5cd6;border-radius:12px;padding:2px 16px;font-size:36px;font-weight:800;color:#8a5cd6;white-space:nowrap">OAuth 2</div></div>`);

  /* ───────── Teams room: helpdesk agent with headset, employees ───────── */
  const headset = `<svg class="w" style="left:0;top:0" width="360" height="500" viewBox="0 0 360 500"><path d="M62 200 Q62 62 180 62 Q298 62 298 200" fill="none" stroke="#1f2a44" stroke-width="12"/><rect x="42" y="170" width="32" height="76" rx="14" fill="#1f2a44"/><rect x="286" y="170" width="32" height="76" rx="14" fill="#1f2a44"/><path d="M300 240 Q300 300 230 304" fill="none" stroke="#1f2a44" stroke-width="9"/><circle cx="224" cy="304" r="14" fill="#1f2a44"/></svg>`;
  ADD(chip('tmChip', 170, 462, 'chat', 'Teams', 'sm blue').replace('style="', 'style="width:300px;font-size:56px;'));
  ADD(agentS('hd', 760, 477, 0.55, headset, { folder: '', lock: true }));
  [[1250, '#8a5cd6'], [1370, '#1e7f4f'], [1490, '#7a4d00']].forEach(([x, c], k) => ADD(emp('rme' + k, x, 646, c, BLUE, 0.55, true)));
  ADD(say('rmB', 1275, 560, 'Hello', 'blue') + say('rmR', 610, 395, 'Hi, Sam!', 'green'));
  ADD(`<div class="w" id="siC" style="left:1500px;top:470px;width:200px;height:120px;border-radius:18px;background:#fff;border:5px solid #8a93a6;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;color:#5d6472;font-size:34px;font-weight:800;opacity:0">${IC('lock_closed', 'width:44px;height:44px')}Sign in<i id="siX" style="position:absolute;left:-14px;right:-14px;top:50px;height:12px;border-radius:6px;background:#c4392f;transform:rotate(-14deg);opacity:0"></i></div>`);
  ADD(PX('pHd', 870, 785, 'IT support · employees', 'blue', 48));

  /* ───────── customer portal ───────── */
  ADD(`<svg class="w" style="left:2780px;top:800px" width="1000" height="700" viewBox="0 0 1000 700">
    <rect x="0" y="0" width="1000" height="700" rx="30" fill="#fff" stroke="#8fa6dc" stroke-width="8"/><path d="M4 90 V34 a30 30 0 0 1 30 -30 H966 a30 30 0 0 1 30 30 V90 Z" fill="#1f2a44"/>
    <circle cx="44" cy="46" r="9" fill="#ffffff55"/><circle cx="76" cy="46" r="9" fill="#ffffff55"/><circle cx="108" cy="46" r="9" fill="#ffffff55"/>
    <text x="500" y="62" font-size="44" font-weight="800" fill="#fff" text-anchor="middle">Contoso portal</text>
    ${[560, 700, 840].map((x) => `<rect x="${x}" y="140" width="120" height="120" rx="16" fill="#e6ecfb"/><rect x="${x}" y="276" width="120" height="16" rx="6" fill="#e2e5eb"/>`).join('')}</svg>`);
  const parcel = `<svg class="w" style="left:250px;top:330px" width="110" height="110" viewBox="0 0 110 110"><rect x="5" y="15" width="100" height="85" rx="8" fill="#c58b4a" stroke="#8a5a1e" stroke-width="6"/><rect x="45" y="15" width="20" height="85" fill="#e8c48f"/></svg>`;
  ADD(agentS('oa', 2950, 1020, 0.72, parcel, { folder: '', lock: true }));
  ADD(PX('pOa', 3280, 620, 'Order tracking', 'blue', 80) + PX('pNoMs', 3280, 810, 'no Microsoft account', 'red', 62) + PX('noA2', 3200, 810, 'No authentication', 'red', 80) + PX('noA1', 870, 790, 'No authentication', 'red', 80));
  ADD(say('greet', 3085, 900, 'Hi, Ana!', 'green'));

  /* door labels */
  ADD(PX('lA', 370, 775, 'No<br>authentication', 'navy', 40) + PX('lB', 930, 775, 'Authenticate<br>with Microsoft', 'blue', 40) + PX('lC', 1490, 775, 'Authenticate<br>manually', 'purple', 52));
  ADD(PX('lockedP', 1490, 1010, 'locked out', 'amber', 48));

  /* maker, admin */
  ADD(maker('mk', 1800, 1000));
  ADD(admin('adm', 3330, 250) + PX('nAdm', 3560, 90, 'Microsoft Entra<br>admin center', 'navy', 50));
  gsap.set('#adm', { opacity: 0 });
  ADD(`<div class="w" id="adp" style="left:2800px;top:130px;width:500px;height:640px;background:#fff;border:7px solid #1f2a44;border-radius:30px;box-shadow:var(--shadow);opacity:0">
    <div style="position:absolute;left:28px;top:14px;font-size:44px;font-weight:800;color:#1f2a44">Agents</div>
    <div id="adR0" style="position:absolute;left:24px;top:86px;width:440px;height:76px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 18px;border-radius:16px;background:#e3f4ea;border:4px solid #1e7f4f;font-size:36px;font-weight:800;color:#14603b;opacity:0">${IC('bot', 'width:46px;height:46px')}IT support agent</div>
    <div id="adR1" style="position:absolute;left:24px;top:172px;width:440px;height:76px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 18px;border-radius:16px;background:#f3f5f9;border:4px solid #c9ced8;font-size:36px;font-weight:800;color:#5d6472;opacity:0">${IC('bot', 'width:46px;height:46px')}Order agent</div>
    ${[['adT0', 'history', 'Audit logs', 270], ['adT1', 'arrow_sync', 'Life cycle', 364], ['adT2', 'shield_checkmark', 'Conditional Access', 458]].map(([i, ic, t, y]) => `<div id="${i}" style="position:absolute;left:24px;top:${y}px;width:450px;height:80px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:0 14px;border-radius:16px;background:#fff;border:5px solid #8a93a6;font-size:36px;font-weight:800;color:#5d6472;opacity:0">${IC(ic, 'width:44px;height:44px')}${t}</div>`).join('')}
    <div id="adCp" style="position:absolute;left:24px;top:556px;width:450px;height:60px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;border-radius:999px;background:#fff3d6;border:4px solid #d98a00;font-size:34px;font-weight:800;color:#7a4d00;opacity:0">→ connector permissions</div></div>`);

  /* customers, strangers, employee walkers */
  const CUC = ['#8a5cd6', '#1e7f4f', '#7a4d00'];
  CUC.forEach((c, k) => ADD(emp('cu' + k, 0, 0, c, PUR, 1)));
  for (let k = 0; k < 8; k++) ADD(stranger('st' + k, 1));
  ADD(stranger('stS', 1));
  ADD(emp('e1', 0, 0, '#0f6f85', BLUE, 1));
  gsap.set('.wk', { x: -700, y: 1400 });

  /* scene 2: kiosk bot, folder, link */
  ADD(`<div class="w" id="ks" style="left:270px;top:1250px;opacity:0">${miniBot(200)}</div>
    <div class="w" id="rf" style="left:440px;top:1300px;width:96px;height:120px;border-radius:10px;background:#c4392f;border:4px solid #fff;box-sizing:border-box;opacity:0"></div>`);
  ADD(PX('okP', 370, 1470, `${IC('checkmark_circle', 'width:50px;height:50px;vertical-align:-10px')} public, general questions`, 'green', 44) + PX('intP', 370, 1020, 'internal data', 'red', 48) + PX('clM', 880, 930, 'classic mistake', 'red', 54));
  [0, 1, 2, 3].forEach((k) => ADD(`<div class="w" id="lk${k}" style="left:${k === 0 ? 800 : 800}px;top:1120px;width:130px;height:130px;border-radius:50%;background:#fff;border:7px solid ${AMB};color:${AMB};display:flex;align-items:center;justify-content:center;opacity:0">${IC('link', 'width:76px;height:76px')}</div>`));

  /* scene 3/4: pills, tiles, scenario */
  ADD(PX('autoP', 930, 1530, 'set up automatically', 'blue', 46) + PX('entraP', 930, 1530, 'Entra ID = who each person is', 'blue', 46));
  ADD(chip('tTe', 360, 1640, 'chat', 'Teams', 'blue').replace('style="', 'style="width:420px;') + chip('tM3', 860, 1640, 'mail', 'Microsoft 365', 'blue').replace('style="', 'style="width:420px;'));
  ADD(`<div class="lab" id="bnX" style="left:1440px;top:1370px;font-size:150px;color:#c4392f">✕</div>`);
  ADD(`<div class="w" id="scn" style="left:1900px;top:200px;width:820px;height:640px;background:#fff;border:7px solid #1f2a44;border-radius:30px;box-shadow:var(--shadow);overflow:hidden;opacity:0">
    <div style="position:absolute;left:0;right:0;top:0;height:84px;background:#1f2a44;color:#fff;font-size:44px;font-weight:800;padding:0 30px;display:flex;align-items:center;z-index:2">Exam scenario</div>
    <div id="scIn" style="position:absolute;left:30px;right:30px;top:110px;font-size:42px;font-weight:700;line-height:1.3;color:#141821">
      ${'<div class="bar2"></div>'.repeat(5)}<div>The IT support agent is for Contoso employees.</div>${'<div class="bar2"></div>'.repeat(5)}
      <div>It will be published in <span style="position:relative;z-index:0"><i id="mkr" style="position:absolute;left:-8px;right:-8px;top:6px;bottom:0;background:#ffd166;z-index:-1;transform-origin:0 50%"></i>Teams</span>.</div>${'<div class="bar2"></div>'.repeat(4)}<div>Which option?</div>${'<div class="bar2"></div>'.repeat(3)}</div></div>`);

  /* scene 6: identity provider, password */
  ADD(`<div class="w" id="idp" style="left:2300px;top:1470px;width:400px;height:250px;border-radius:30px;background:#1f2a44;border:6px solid #fff;box-sizing:border-box;box-shadow:var(--shadow);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:44px;font-weight:800;opacity:0">${IC('organization', 'width:84px;height:84px')}Identity provider</div>`);
  ADD(`<div class="w" id="pwd" style="left:2130px;top:1480px;width:150px;height:84px;border-radius:20px;background:#fff;border:5px solid #8a93a6;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:8px;color:#5d6472;font-size:38px;font-weight:800;opacity:0">${IC('lock_closed', 'width:40px;height:40px')}••••</div>`);
  ADD(PX('idpP', 1860, 980, 'generic<br>OAuth 2 provider', 'purple', 44) + PX('noPw', 2420, 1390, 'no password shared<br>with the agent', 'green', 46) + PX('noMs2', 2150, 1640, 'no Microsoft account', 'amber', 46));

  /* scene 8: identity tag, order cards, tool + key, ? marks */
  ADD(pw('idtg', 0, -80, 'Ana', 'purple', 54));
  const oc = (id, x, ic, t, cls) => chip(id, x, 640, ic, t, cls).replace('style="', 'style="width:420px;height:110px;font-size:50px;');
  ADD(oc('ordA', 2840, 'checkmark_circle', "Ana's order", 'green') + oc('ordB', 3300, 'dismiss_circle', "Ben's order", 'red'));
  ADD(`<div class="w" id="tool" style="left:3460px;top:1150px;width:240px;height:110px;border-radius:26px;background:#1f2a44;border:5px solid #fff;box-sizing:border-box;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:44px;font-weight:800;opacity:0">${IC('toolbox', 'width:56px;height:56px')}Tool</div>
    <div class="w" id="kyD" style="left:3200px;top:1180px;width:100px;height:100px;border-radius:50%;background:#fff;border:7px solid ${AMB};color:${AMB};display:flex;align-items:center;justify-content:center;opacity:0">${IC('key', 'width:60px;height:60px')}</div>`);
  ADD(PX('permP', 3470, 1320, 'user\'s own<br>permissions', 'amber', 52) + PX('noId', 1460, 1130, 'no identity', 'red', 60));
  ADD(`<div class="lab" id="q0" style="left:1400px;top:1250px;font-size:130px;color:#d98a00">?</div><div class="lab" id="q1" style="left:1550px;top:1250px;font-size:130px;color:#d98a00">?</div>`);

  /* scene 10-11: timeline, robot, badge, environment */
