<!doctype html>
<html lang="en">

<link rel="stylesheet" href="style.css" />
<style>
  .dp { position: absolute; width: 100px; height: 70px; box-sizing: border-box; border-radius: 30px; background: #e6ecfb; border: 6px solid #2f5bd3; color: #2f5bd3; font-size: 40px; font-weight: 800; line-height: 50px; text-align: center; opacity: 0; }
  .dp.red { border-color: #c4392f; background: #fde8e6; color: #c4392f; } .dp.gr { border-color: #1e7f4f; background: #e3f4ea; color: #1e7f4f; } .dp.inv { border-style: dashed; }
  .sb.jag { box-sizing: border-box; width: 380px; height: 170px; display: flex; align-items: center; justify-content: center; border: none; background: #c4392f; color: #fff; padding: 0; box-shadow: none; letter-spacing: 4px; clip-path: polygon(0 12%, 8% 0, 18% 14%, 30% 0, 42% 14%, 55% 0, 68% 14%, 80% 0, 92% 12%, 100% 0, 96% 40%, 100% 62%, 94% 80%, 100% 100%, 88% 88%, 76% 100%, 62% 86%, 50% 100%, 38% 86%, 24% 100%, 12% 86%, 0 100%, 6% 60%, 0 38%); }
  .sb.jag:after { display: none; }
  .sb.inv { border-style: dashed; color: #7a4d00; } .sb.gry { border-color: #8a93a6; color: #5d6472; background: #eef1f7; } .sb.gry:after { border-top-color: #8a93a6; }
  .bnr { position: absolute; left: 90px; top: 60px; width: 1740px; height: 150px; display: flex; align-items: center; gap: 24px; padding: 0 40px; box-sizing: border-box; background: #c4392f; color: #fff; border-radius: 24px; font-size: 42px; font-weight: 800; box-shadow: 0 20px 60px rgba(16,24,40,.3); opacity: 0; }
  .bnr .ic { width: 80px; height: 80px; flex: 0 0 auto; }
  .cfc { position: absolute; left: 1260px; top: 190px; font-family: Consolas, 'Courier New', monospace; font-size: 54px; font-weight: 800; color: #c4392f; background: #fff; border: 6px solid #c4392f; border-radius: 20px; padding: 10px 36px; box-shadow: 0 20px 60px rgba(16,24,40,.3); opacity: 0; }
  .myth { position: absolute; left: 40px; top: 20px; width: 880px; height: 130px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #fff; border: 8px solid #c4392f; border-radius: 30px; font-size: 62px; font-weight: 800; color: #141821; box-shadow: 0 30px 80px rgba(16,24,40,.25); opacity: 0; }
  .strk { position: absolute; left: 24px; right: 24px; top: 50%; height: 9px; margin-top: -4px; background: #c4392f; border-radius: 5px; transform-origin: 0 50%; transform: scaleX(0); }
  .gtog { display: flex; align-items: center; justify-content: space-between; width: 800px; height: 100px; box-sizing: border-box; padding: 0 28px; background: #fff; border: 6px solid #2f5bd3; border-radius: 26px; font-size: 38px; font-weight: 800; box-shadow: var(--shadow); }
  .tgl2 { width: 110px; height: 58px; border-radius: 29px; background: #1e7f4f; position: relative; flex: 0 0 auto; }
  .tgl2 i { position: absolute; left: 58px; top: 6px; width: 46px; height: 46px; border-radius: 50%; background: #fff; }
  .card { width: 620px; height: 340px; box-sizing: border-box; background: #fff; border: 8px solid #1f2a44; border-radius: 34px; box-shadow: var(--shadow); padding: 30px 34px; font-size: 50px; font-weight: 800; line-height: 1.15; color: #141821; }
  .card .ic { width: 96px; height: 96px; color: var(--accent); display: block; margin-bottom: 14px; }
  .mm { position: absolute; height: 110px; display: flex; align-items: center; gap: 22px; font-size: 56px; font-weight: 800; background: #fff; border: 6px solid #c4392f; border-radius: 26px; padding: 0 34px; color: #141821; white-space: nowrap; box-shadow: var(--shadow); opacity: 0; }
  .mm .ic { width: 70px; height: 70px; color: #c4392f; }
  .mon { position: absolute; width: 640px; height: 520px; background: #1f2a44; border-radius: 30px; border: 12px solid #3a4a78; box-sizing: border-box; padding: 20px 24px; opacity: 0; }
  .mon h5 { margin: 0 0 16px; color: #fff; font-size: 44px; font-weight: 800; }
  .mon .ln { height: 56px; border-radius: 10px; background: #2d3a5c; margin-bottom: 14px; color: #fff; font-size: 38px; font-weight: 800; line-height: 56px; padding-left: 18px; font-family: Consolas, 'Courier New', monospace; }
  .mon .ln span { opacity: 0; }
  .sbar { position: absolute; left: 2480px; top: 150px; width: 1330px; height: 110px; box-sizing: border-box; display: flex; align-items: center; gap: 20px; padding: 0 30px; background: #fff; border: 6px solid #2f5bd3; border-radius: 26px; font-size: 56px; font-weight: 800; font-family: Consolas, 'Courier New', monospace; color: #141821; box-shadow: var(--shadow); opacity: 0; }
  .sbar .ic { width: 64px; height: 64px; color: #2f5bd3; } .sbar i { font-style: normal; opacity: 0; }
  .ghost { position: absolute; width: 380px; height: 140px; box-sizing: border-box; border: 6px dashed #8a93a6; border-radius: 30px; opacity: 0; }
  .pnl { position: absolute; left: 0; width: 1228px; height: 190px; box-sizing: border-box; background: #fff; border: 4px solid var(--line2); border-radius: 22px; opacity: 0; }
  .pnl .pt { position: absolute; left: 30px; top: 62px; width: 540px; display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 800; }
  .pnl .pt .ic { width: 52px; height: 52px; color: var(--accent); flex: 0 0 auto; }
  .pnl .tw { position: absolute; left: 600px; top: 56px; width: 440px; }
  .trk { position: relative; height: 16px; background: var(--line2); border-radius: 8px; margin-top: 20px; }
  .trk .st { position: absolute; top: -8px; width: 14px; height: 32px; border-radius: 7px; background: #8a93a6; margin-left: -7px; }
  .trk .kn, .trk2 .kn { position: absolute; left: -22px; top: -16px; width: 48px; height: 48px; border-radius: 50%; background: var(--accent); border: 6px solid #fff; box-sizing: border-box; box-shadow: 0 6px 16px rgba(16,24,40,.35); z-index: 2; }
  .pnl .te { display: flex; justify-content: space-between; font-size: 26px; font-weight: 700; color: var(--muted); margin-top: 18px; }
  .pnl .vp { position: absolute; right: 26px; top: 60px; min-width: 110px; text-align: center; font-size: 34px; font-weight: 800; background: #e6ecfb; color: var(--accent); border-radius: 999px; padding: 6px 22px; opacity: 0; }
  .rtb { position: absolute; left: 0; top: 636px; width: 1228px; height: 76px; box-sizing: border-box; display: flex; align-items: center; gap: 24px; padding: 0 30px; background: #e3f4ea; border: 4px solid var(--green); border-radius: 22px; font-size: 34px; font-weight: 800; color: #14603b; opacity: 0; }
  .rtb .wins { margin-left: auto; background: var(--green); color: #fff; border-radius: 999px; padding: 6px 26px; }
  .trk2 { position: absolute; left: 100px; top: 230px; width: 1000px; height: 140px; }
  .trk2 .rail { position: absolute; left: 0; top: 30px; width: 1000px; height: 16px; background: var(--line2); border-radius: 8px; }
  .trk2 .st { position: absolute; top: 22px; width: 14px; height: 32px; border-radius: 7px; background: #8a93a6; margin-left: -7px; }
  .trk2 .kn { top: 14px; }
  .trk2 .sl { position: absolute; top: 66px; width: 180px; margin-left: -90px; text-align: center; font-size: 30px; font-weight: 700; color: var(--muted); }
  .sk { height: 22px; border-radius: 11px; background: var(--line); margin: 30px 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">

<!-- @world -->
<script>
  /* L04 · Responsible AI and moderation. World 3840x2160: agent 1720,1010 · counter 1580,1440 · gates 2310 (out 960 / in 1230) · employees 2650/3050/3450 y1560 · tap: pipe y1135, nozzle 1110,1340, filter+dial 1425,1010, valve 1000,1480, Sources 420,1470, Tools 420,1790 · maker 2700,1014 · one-dial wiring (scene 6) and cards (scene 10) on the upper wall · monitors 2480,300 */
  const BLUE = '#2f5bd3', GRN = '#1e7f4f', RED = '#c4392f', AMB = '#d98a00', NAVY = '#1f2a44';
  const PX = (id, x, y, t, c, fs) => pill(id, x, y, t, c).replace('style="', 'style="font-size:' + (fs || 46) + 'px;');
  const SBX = (id, x, y, h, cls, fs) => say(id, x, y, h, cls).replace('style="', 'style="font-size:' + (fs || 44) + 'px;');
  const BW = (id, x, y, h, cls, fs) => `<div class="w" id="${id}w" style="left:0;top:0">${SBX(id, x, y, h, cls, fs)}</div>`;
  const MX = 2700, MY = 1014;

  /* ───────── the tap (behind the agent) ───────── */
  const fmLines = []; for (let x = 1350; x <= 1500; x += 15) fmLines.push(`<line x1="${x}" y1="1100" x2="${x}" y2="1260" stroke="#2f5bd3" stroke-width="3"/>`);
  ADD(`<div class="w" id="tapG" style="left:0;top:0;width:3840px;height:2160px;opacity:0">
    <svg class="w" style="left:0;top:0" width="3840" height="2160" viewBox="0 0 3840 2160">
      <path d="M720 1600 H860 V1640 H1000" fill="none" stroke="#8a93a6" stroke-width="40" stroke-linejoin="round"/><path d="M720 1890 H860 V1640" fill="none" stroke="#8a93a6" stroke-width="40" stroke-linejoin="round"/>
      <path d="M720 1600 H860 V1640 H1000" fill="none" stroke="#c9ced8" stroke-width="12" stroke-linejoin="round"/><path d="M720 1890 H860 V1640" fill="none" stroke="#c9ced8" stroke-width="12" stroke-linejoin="round"/>
      <rect x="1065" y="1135" width="725" height="90" rx="30" fill="#8a93a6"/><rect x="1065" y="1135" width="90" height="190" rx="30" fill="#8a93a6"/><rect x="1085" y="1300" width="50" height="42" rx="10" fill="#5d6472"/>
      <rect x="1098" y="1066" width="24" height="76" fill="#5d6472"/><rect x="1040" y="1040" width="140" height="32" rx="16" fill="#c4392f"/>
      <rect id="fGlow" x="1305" y="1060" width="240" height="240" rx="44" fill="#ffd166" opacity="0"/>
      <rect x="1330" y="1085" width="190" height="190" rx="26" fill="#eaf0ff" stroke="#2f5bd3" stroke-width="8"/>
      <g id="cm" stroke="#2f5bd3" stroke-width="7"><line x1="1375" y1="1100" x2="1375" y2="1260"/><line x1="1425" y1="1100" x2="1425" y2="1260"/><line x1="1475" y1="1100" x2="1475" y2="1260"/></g><g id="fm" opacity="0">${fmLines.join('')}</g>
      <rect x="1410" y="1070" width="30" height="20" fill="#1f2a44"/><circle cx="1425" cy="1010" r="62" fill="#fff" stroke="#1f2a44" stroke-width="8"/>
      <g id="nd"><path d="M1425 1010 L1425 962" stroke="#c4392f" stroke-width="11" stroke-linecap="round"/><circle cx="1425" cy="1010" r="9" fill="#1f2a44"/></g>
      <rect id="vGlow" x="975" y="1455" width="270" height="290" rx="50" fill="#ffd166" opacity="0"/>
      <rect x="1000" y="1480" width="220" height="240" rx="30" fill="#e6ecfb" stroke="#2f5bd3" stroke-width="8"/>
      <text x="1110" y="1690" font-size="1" font-weight="800" fill="none" text-anchor="middle"></text>
      <rect id="vg" x="1020" y="1535" width="180" height="36" rx="14" fill="#c4392f" opacity="0"/>
      <rect x="1080" y="1720" width="60" height="112" fill="#8a93a6"/><rect x="900" y="1830" width="420" height="30" rx="14" fill="#5d6472"/>
    </svg>
    <div class="w" style="left:420px;top:1470px;width:300px;height:260px;box-sizing:border-box;border-radius:30px;background:#e3f4ea;border:8px solid #1e7f4f;color:#1e7f4f;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:64px;font-weight:800">${IC('document_text', 'width:100px;height:100px')}Sources</div>
    <div class="w" style="left:420px;top:1790px;width:300px;height:200px;box-sizing:border-box;border-radius:30px;background:#1f2a44;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:64px;font-weight:800">${IC('wrench', 'width:80px;height:80px')}Tools</div>
  </div>`);
  gsap.set('#nd', { svgOrigin: '1425 1010', rotation: -60 }); gsap.set('#vg', { svgOrigin: '1020 1553' });

  /* HR agent, counter, gates, employees */
  ADD(agent('bot', 1720, 1010, { folder: 'HR' }));
  ADD(`<div class="w" style="left:1580px;top:1440px;width:640px;height:90px;border-radius:20px;background:#1f2a44"></div><div class="w" style="left:1580px;top:1430px;width:640px;height:22px;border-radius:12px;background:#3a4a78"></div>`);
  const gateG = (id, x, y) => `<svg class="w" id="${id}" style="left:${x}px;top:${y}px" width="240" height="270" viewBox="0 0 240 270"><rect x="10" y="60" width="26" height="210" rx="8" fill="#8a93a6"/><rect x="204" y="60" width="26" height="210" rx="8" fill="#8a93a6"/><rect x="10" y="36" width="220" height="44" rx="16" fill="#1f2a44"/><circle id="${id}_l" cx="120" cy="58" r="24" fill="#8a93a6" stroke="#fff" stroke-width="5"/></svg>`;
  ADD(`<div class="w" id="gatesG" style="left:0;top:0;opacity:0">${gateG('outG', 2310, 960)}${gateG('inG', 2310, 1230)}</div>`);
  ADD(PX('lbIn', 2430, 1520, 'In · user message', 'navy', 46) + PX('lbOut', 2430, 880, 'Out · agent answer', 'navy', 46));
  ADD(`<div class="w" id="gxA" style="left:2580px;top:1250px;opacity:0">${IC('dismiss_circle', 'width:100px;height:100px;color:#c4392f;background:#fff;border-radius:50%')}</div>`);
  ADD(`<div class="w" id="gxB" style="left:2580px;top:1250px;opacity:0">${IC('dismiss_circle', 'width:100px;height:100px;color:#c4392f;background:#fff;border-radius:50%')}</div>`);
  ['#8a5cd6', '#1e7f4f', '#7a4d00'].forEach((c, k) => ADD(crowd('e' + k, 2650 + k * 400, 1560, c).replace('style="', 'style="opacity:0;')));
  ADD(BW('q0', 2695, 1330, '#!*&amp;%', 'jag', 76) + BW('q1', 3095, 1330, 'A policy<br>question', '', 56) + BW('q2', 3495, 1330, "Ana's leave<br>balance?", '', 56));
  ADD(SBX('a1', 3095, 1100, 'Invented<br>answer', 'inv', 56) + SBX('a2', 3495, 1100, 'Leave: ##', '', 60));
  ADD(PX('n0', 2695, 1180, '1 · Harm', 'red', 54) + PX('n1', 3095, 960, '2 · Made up', 'amber', 54) + PX('n2', 3495, 960, '3 · Policy', 'purple', 54));

  /* tap labels */
  ADD(PX('rai', 1000, 860, 'Responsible AI = controls', 'navy', 68) + PX('lbMod', 1560, 790, 'Moderation · filters harm', 'blue', 66) + PX('lbVal', 1700, 1830, 'Grounding · requires sources', 'green', 64));
  ADD(PX('lbLow', 1225, 960, 'Lowest', 'amber', 64) + PX('lbHigh', 1665, 960, 'Highest', 'blue', 64));
  ADD(PX('lbFewer', 1620, 1830, 'fewer answers', 'blue', 66) + PX('lbRisk', 1620, 1830, 'more answers · more risk', 'red', 64) + PX('lbWater', 1620, 1830, 'finer filter → less water', 'blue', 64));

  /* drops (answers as speech-bubble drops) */
  let dn = 0;
  const mkDrop = (cls, l, t) => { const id = 'dp' + (dn++); ADD(`<div class="dp ${cls || ''}" id="${id}" style="left:${l}px;top:${t}px">···</div>`); return '#' + id; };
  const FALL = (t, cls, stop) => {
    const d = mkDrop(cls, 1060, 1345);
    tl.fromTo(d, { opacity: 0, scale: 0.5, y: 0 }, { opacity: 1, scale: 1, duration: 0.25 }, t);
    if (stop) { tl.to(d, { y: 122, duration: 0.5, ease: 'power1.in' }, t + 0.2); tl.to(d, { scale: 1.5, opacity: 0, duration: 0.3 }, t + 0.8); }
    else { tl.to(d, { y: 417, duration: 0.9, ease: 'power1.in' }, t + 0.2); tl.to(d, { opacity: 0, duration: 0.3 }, t + 1.3); }
    return d;
  };
  const PIPE = (t, tools) => {
    const y0 = tools ? 1856 : 1566, d = mkDrop('gr', 712, y0), t2 = t + 0.65 + (tools ? 0.5 : 0.15);
    tl.fromTo(d, { opacity: 0, scale: 0.5, x: 0, y: 0 }, { opacity: 1, scale: 1, duration: 0.25 }, t);
    tl.to(d, { x: 110, duration: 0.4, ease: 'none' }, t + 0.25);
    tl.to(d, { y: 1606 - y0, duration: tools ? 0.5 : 0.15, ease: 'none' }, t + 0.65);
    tl.to(d, { x: 350, duration: 0.6, ease: 'none' }, t2);
    tl.to(d, { y: 1762 - y0, duration: 0.6, ease: 'power1.in' }, t2 + 0.6);
    tl.to(d, { opacity: 0, duration: 0.3 }, t2 + 1.3);
  };

  /* maker */
  ADD(maker('mk', MX, MY).replace('style="', 'style="opacity:0;'));

  /* scene 6: one dial wired to tasks */
  ADD(`<svg class="w" id="odS" style="left:0;top:0" width="3840" height="1200" viewBox="0 0 3840 1200">${[460, 640, 820].map((y, k) => cable('cw' + k, `M1080 650 C1350 650,1450 ${y},1700 ${y}`, BLUE, 14)).join('')}</svg>`);
  ADD(`<svg class="w" id="odD" style="left:940px;top:490px;opacity:0" width="320" height="320" viewBox="0 0 320 320"><circle cx="160" cy="160" r="130" fill="#fff" stroke="#1f2a44" stroke-width="14"/><g id="odn"><path d="M160 160 L160 64" stroke="#c4392f" stroke-width="16" stroke-linecap="round"/><circle cx="160" cy="160" r="14" fill="#1f2a44"/></g></svg>`);
  gsap.set('#odn', { svgOrigin: '160 160', rotation: 40 });
  ['Creative writing', 'Other task', 'Other task'].forEach((t, k) => ADD(chip('tk' + k, 1700, 400 + k * 180, 'tasks_app', t, 'blue').replace('style="', 'style="width:640px;font-size:50px;')));
  ADD(PX('odp', 1100, 400, 'Moderation level', 'navy', 52) + PX('odw', 1900, 975, 'one dial · every task', 'amber', 60));

  /* scene 7: silent filter + control room */
  ADD(`<svg class="w" id="sv7" style="left:0;top:0" width="3840" height="1200" viewBox="0 0 3840 1200">${cable('cn', 'M1480 585 H1830', '#8a93a6', 14, '18 14')}</svg>`);
  ADD(chip('gn', 700, 520, 'sparkle', 'Generative answers node', 'blue').replace('style="', 'style="width:780px;font-size:52px;'));
  ADD(BW('qn', 330, 470, 'Question', 'blue', 50));
  ADD(`<div class="w" id="fl7" style="left:1530px;top:530px;width:110px;height:110px;border-radius:50%;background:#fff;border:7px solid #d98a00;box-sizing:border-box;color:#d98a00;display:flex;align-items:center;justify-content:center;opacity:0">${IC('filter', 'width:64px;height:64px')}</div>`);
  ADD(`<div class="ghost" id="gb" style="left:1830px;top:515px"></div>` + PX('lbNone', 1700, 740, 'No answer · no sign', 'red', 58));
  const mrow = (id, n) => Array.from({ length: n }, (_, k) => `<div class="ln"${k === 2 ? ` id="${id}"` : ''}>${k === 2 ? '<span>ContentFiltered</span>' : ''}</div>`).join('');
  ADD(`<div class="mon" id="mon1" style="left:2480px;top:300px"><h5>Transcripts</h5>${mrow('hit1', 5)}</div><div class="mon" id="mon2" style="left:3170px;top:300px"><h5>Application Insights</h5>${mrow('hit2', 5)}</div>`);
  const TXT = 'ContentFiltered';
  ADD(`<div class="sbar" id="sbar">${IC('search')}${TXT.split('').map((c, k) => `<i id="sc${k}">${c}</i>`).join('')}</div>`);
  ADD(PX('lbBug', 3145, 900, 'the filter, not a bug', 'red', 60));

  /* scene 9: toggle, fallback */
  ADD(`<div class="w gtog" id="gtog" style="left:250px;top:1320px;opacity:0"><span>Allow ungrounded responses</span><div class="tgl2" id="gt"><i id="gtk"></i></div></div>`);
  ADD(SBX('fb', 1560, 1690, "Sorry, I can't answer<br>that from my sources", 'gry', 42) + SBX('fb2', 1560, 1690, "Sorry, I can't answer<br>that from my sources", 'gry', 42));
  ADD(PX('lbFb', 1560, 1600, 'Fallback', 'navy', 48) + PX('lbNoMake', 660, 1225, 'no making things up', 'green', 54));

  /* scene 10: cards */
  const CARD = (id, x, ic, t) => `<div class="w card" id="${id}" style="left:${x}px;top:380px;opacity:0">${IC(ic)}${t}</div>`;
  ADD(CARD('c0', 900, 'link', 'Allow ungrounded responses') + CARD('c1', 1600, 'temperature', 'Temperature') + CARD('c2', 2300, 'shield_checkmark', 'Content moderation'));
  ADD(PX('s0a', 1210, 770, 'not harm', 'red', 56) + PX('s0b', 1210, 870, 'requires sources', 'green', 56) + PX('s1', 1910, 770, 'not harm', 'red', 56) + PX('s2', 2610, 770, 'harm', 'green', 56));
  ADD(`<div class="mm" id="mm0" style="left:900px;top:990px">Moderation → invented answers${IC('dismiss_circle')}<i class="strk" id="mm0x"></i></div><div class="mm" id="mm1" style="left:900px;top:1140px">Ungrounded off → offensive content${IC('dismiss_circle')}<i class="strk" id="mm1x"></i></div>`);

  /* scene 12 / 16: shields, aura, requests */
