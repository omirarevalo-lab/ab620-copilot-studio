     skills library 40,300 · big scroll 740,250 · Development 2800,1150 · Production 3440,1150 · lockers 3000/3420,980 */

    <div id="scBody" class="w" style="left:20px;top:20px;width:600px;height:640px;background:#fffaf0;border:5px solid #d9b86c;box-sizing:border-box;overflow:hidden;box-shadow:0 16px 40px rgba(16,24,40,.2)">

    <div class="w" id="shelf" style="left:1560px;top:810px;width:1120px;height:22px;border-radius:10px;background:#8fa6dc;opacity:0"></div>`);

  const TP = [[1657, 350], [1891, 350], [2125, 350], [2359, 350], [1779, 545], [2013, 545], [2247, 545]];
  ADD(TYPES.map(([l, ic, c], k) => blk('t' + k, TP[k][0], TP[k][1], 224, 170, ic, c, l, 38)).join(''));
  ADD(blk('gA', 1650, 420, 300, 170, 'chat', BLUE, 'Greeting', 42) + blk('gB', 1980, 420, 300, 170, 'chat', BLUE, 'Escalate to<br>a human', 40) + blk('gC', 2310, 420, 300, 170, 'wrench', AMB, 'Create ticket', 40));

  ADD(`<svg class="w" id="lock" style="left:2540px;top:258px;opacity:0" width="120" height="150" viewBox="0 0 120 150"><path d="M30 66 V44 a30 30 0 0 1 60 0 V66" fill="none" stroke="#1f2a44" stroke-width="14"/><rect id="lkB" x="8" y="62" width="104" height="80" rx="16" fill="#1f2a44" stroke="#fff" stroke-width="5"/><circle cx="60" cy="96" r="11" fill="#fff"/><rect x="55" y="100" width="10" height="24" rx="4" fill="#fff"/></svg>`);
