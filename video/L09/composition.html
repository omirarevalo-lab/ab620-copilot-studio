<!-- TAIL 2.5 -->
<link rel="stylesheet" href="style.css" />
<style>

  .uw .nav div { font-size: 32px; } .uw .bar { font-size: 32px; } .uw .bar .hc { font-size: 32px; } .uw .row b { font-size: 36px; } .uw .btn { font-size: 32px; } .uw .crumb { font-size: 32px; } .uw .fld { font-size: 34px; } .uw .fld small { font-size: 32px; } .uw .dd { font-size: 34px; }
  .uw .nc { position: absolute; box-sizing: border-box; border: 3px solid var(--line2); border-radius: 18px; padding: 12px 24px; background: #fff; }

</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">

<!-- @world -->
<script>
  /* L09 · Formatted responses. World 3840x2160, camera scale 1 except scene 2 (1.7 on the reply wall).
     Two sets side by side, designed in SCREEN coordinates (1920x1080) and placed with A(x,y) / Bq(x,y): world y = y + 700, B adds x + 1920.
     Set A "help desk counter": ticket board x120-540 · Marta/manager slot x540-740 · reply wall x760-1480 y150-600 · Nexo x1510-1798 · counter y740+.
     Set B (reused by scene): desk with two sheets (1) · tool room (6) · Valeria's desk for the UI (9) · "Generative answers" sign (10). Floor line at screen y 800. */
  const NAVY = '#1f2a44', BLUE = '#2f5bd3', GRN = '#1e7f4f', RED = '#c4392f', AMB = '#d98a00', VIO = '#7b5cd6', GO = '#b8860b', GOD = '#7f5c06', TLC = '#0f7b8a', CRM = '#f4ead2', CORAL = '#e07a5f', PILL = '#cfe0ff', INK = '#141821';
  const YO = 700;
  const A = (x, y) => `left:${x}px;top:${y + YO}px`, Bq = (x, y) => `left:${x + 1920}px;top:${y + YO}px`;
  const human = (id, x, y, top, hair, extra) => `<svg class="w" id="${id}" style="left:${x}px;top:${y}px" width="200" height="380" viewBox="0 0 200 380"><g><path d="M16 380 Q16 170 100 158 Q184 170 184 380 Z" fill="${top}"/><circle cx="100" cy="92" r="54" fill="#f2c9a6"/><path d="M44 90 Q44 30 100 30 Q156 30 156 90 Q130 62 100 64 Q70 62 44 90 Z" fill="${hair}"/><circle cx="80" cy="98" r="6" fill="#141821"/><circle cx="120" cy="98" r="6" fill="#141821"/><path d="M84 122 Q100 134 116 122" stroke="#141821" stroke-width="5" fill="none" stroke-linecap="round"/></g>${extra || ''}</svg>`;
  const PEN = (st) => `<svg class="w" id="pn7" style="${st}" width="90" height="90" viewBox="0 0 70 70"><path d="M10 60 L14 44 L44 14 a6 6 0 0 1 8 0 l4 4 a6 6 0 0 1 0 8 L26 56 Z" fill="currentColor"/></svg>`;
  const bub = (id, x, y, w, t, cls, st) => `<div class="bub h ${cls || ''}" id="${id}" style="${A(x, y)};width:${w}px;${st || ''}">${t}</div>`;
  const tgp = (id, x, y, w, t, bg, col, bd) => `<div class="tg" id="${id}" style="${A(x, y)};width:${w}px;background:${bg};color:${col};border:3px solid ${bd || bg};text-align:center">${t}</div>`;
  const LBH = (id, t, c) => `<div class="bl ${c || ''}" id="${id}">${t}</div>`;

  /* ═══════ SET A ═══════ */
  ADD(`<div class="w" id="tb" style="${A(120, 200)};width:420px;height:600px;box-sizing:border-box;background:#e1c59a;border:10px solid #8d6230;border-radius:20px"><div style="position:absolute;left:0;right:0;top:6px;text-align:center;font-size:38px;font-weight:800;color:#5b3d17">Tickets</div></div>`);
  [['4821', 262], ['4822', 386], ['4823', 510], ['4824', 634]].forEach(([n, y], i) => {
    ADD(`<div class="w" id="tk${i}" style="${A(140, y)};width:380px;height:112px;box-sizing:border-box;background:#fff;border-radius:14px;padding:6px 18px;box-shadow:var(--shadow);font-size:38px;font-weight:800;color:${INK}">${n}</div>`);
  });
  ADD(`<div class="tg" id="sl3" style="${A(160, 634 + 58)};width:340px;border:3px dashed #8a93a6;color:#5d6472;background:#f3f5f9;text-align:center">Request type</div>`);
  ADD(tgp('tt3a', 160, 634 + 58, 340, 'printer is weird??', '#fff3d6', AMB, AMB));
  ADD(tgp('tt3b', 160, 634 + 58, 340, 'hardware', '#e3f4ea', GRN, GRN));
  [['tt0', 262, 'hardware'], ['tt1', 386, 'software'], ['tt2', 510, 'access']].forEach(([id, y, t]) => ADD(tgp(id, 160, y + 58, 340, t, '#e3f4ea', GRN, GRN)));
  ADD(`<div class="w" id="wall" style="${A(760, 150)};width:720px;height:450px;box-sizing:border-box;background:#fff;border:10px solid ${NAVY};border-radius:28px;overflow:hidden"><div style="height:56px;background:${NAVY};color:#fff;font-size:32px;font-weight:700;padding:0 22px;display:flex;align-items:center;gap:12px">${IC('chat', 'width:36px;height:36px')}Help desk chat</div></div>`);
  ADD(agent('nex', 1510, 400 + YO, { folder: '' }).replace('width="360" height="500"', 'width="288" height="400"'));
  ADD(`<div class="w" id="ctr" style="${A(740, 740)};width:1060px;height:340px"><div style="height:26px;background:#aeb6c6;border-radius:10px 10px 0 0"></div><div style="height:314px;background:#c9ced8"></div></div>`);
  const tbxSvg = (id, x, y, w, h, label) => `<svg class="w" id="${id}" style="${x};${y}" width="${w}" height="${h}" viewBox="0 0 240 150"><rect x="10" y="44" width="220" height="96" rx="10" fill="${NAVY}"/><rect x="10" y="44" width="220" height="14" fill="#2d3a5c"/>${label ? `<text x="120" y="104" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">Ticket lookup</text>` : '<rect x="96" y="76" width="48" height="36" rx="8" fill="#ffd166"/>'}<g id="${id}_lid"><rect x="4" y="14" width="232" height="36" rx="8" fill="#2d3a5c"/><rect x="90" y="2" width="60" height="16" rx="8" fill="none" stroke="#2d3a5c" stroke-width="8"/></g></svg>`;
  ADD(tbxSvg('tbx', `left:780px`, `top:${606 + YO}px`, 240, 140, false));
  ADD(`<div class="w" id="tbxp" style="${A(1050, 650)};padding:6px 24px;background:#fff;border:4px solid ${NAVY};border-radius:14px;font-size:34px;font-weight:800;color:${NAVY};white-space:nowrap">Ticket lookup</div>`);
  ADD(human('mar', 540, 420 + YO, CORAL, '#3a2a22'));
  ADD(human('mgr', 540, 420 + YO, NAVY, '#2b2b2b', '<rect x="118" y="230" width="46" height="34" rx="6" fill="#fff"/><rect x="124" y="238" width="34" height="8" fill="#ffd166"/>').replace('<svg class="w"', '<svg class="w h"'));
  /* scene 0 + 4 + 7 + 10 wall items */
  ADD(bub('uB1', 1010, 240, 440, 'Status of ticket 4821?', 'me'));
  ADD(bub('rp1', 790, 330, 600, 'Ticket 4821 is in progress.'));
  ADD(bub('rp2', 790, 330, 660, 'Someone is probably working on it.', '', `border-color:${AMB}`));
  ADD(bub('u0', 1010, 240, 440, 'printer is weird??', 'me'));
  ADD(bub('q4', 790, 240, 440, 'What type of request?'));
  [['qp0', 790, 190, 'hardware'], ['qp1', 1000, 190, 'software'], ['qp2', 1210, 150, 'access']].forEach(([id, x, w, t]) => ADD(`<div class="bub h" id="${id}" style="${A(x, 340)};width:${w}px;text-align:center;background:${PILL};border-color:${BLUE};color:#1f3a8a;border-radius:999px">${t}</div>`));
  ADD(bub('u4', 1060, 450, 380, 'printer is weird??', 'me'));
  ADD(tgp('f4tag', 790, 228, 590, 'Question node · multiple choice', NAVY, '#fff'));
  ADD(`<div class="w h" id="f4card" style="${A(780, 292)};width:680px;height:280px;box-sizing:border-box;background:#fff;border:5px solid ${NAVY};border-radius:20px">${['hardware', 'software', 'access'].map((t, k) => `<div class="w" style="left:24px;top:${14 + k * 62}px;height:56px;display:flex;align-items:center;gap:16px;font-size:36px;font-weight:800;color:${INK}"><span style="width:40px;height:40px;box-sizing:border-box;border:5px solid ${NAVY};border-radius:8px;display:inline-block"></span>${t}</div>`).join('')}
    <div class="w" style="left:24px;top:204px;width:628px;height:60px;box-sizing:border-box;border:3px dashed #c9ced8;border-radius:14px;background:#eceff5;color:#9aa3b5;font-size:32px;font-weight:700;display:flex;align-items:center;padding-left:20px">Type your own answer</div></div>`);
  ADD(`<svg class="w h" id="f4tick" style="left:807px;top:${1019}px" width="44" height="44" viewBox="0 0 44 44"><path d="M7 23 L18 34 L38 8" stroke="${GRN}" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
  /* scene 2 items (wall close-up) */
  ADD(tgp('n2a', 780, 230, 270, 'Message node', NAVY, '#fff'));
  ADD(tgp('n2b', 1070, 230, 280, 'Question node', NAVY, '#fff'));
  ADD(`<div class="bub h" id="v2b" style="${A(822, 306)};width:360px;border-color:${VIO};background:#efe9ff;z-index:1"><span style="visibility:hidden">Hi</span></div><div class="bub h" id="v2a" style="${A(806, 318)};width:360px;border-color:${VIO};background:#efe9ff;z-index:1"><span style="visibility:hidden">Hi</span></div>`);
  ADD(`<div class="bub h" id="m2" style="${A(790, 330)};width:420px;z-index:2"><span id="m2a">Hi Marta!</span></div>`);
  ADD(`<div class="bub h" id="m2b" style="${A(790, 330)};width:560px;z-index:2">Hi <span style="background:${GO};color:#fff;border-radius:10px;padding:0 10px">User name</span>, <b style="color:${BLUE}">your ticket</b></div>`);
  [['t2a', 790, 'image', 'Image'], ['t2b', 1010, 'video', 'Video'], ['t2c', 1230, 'card_ui', 'Card']].forEach(([id, x, ic, t]) => ADD(`<div class="w h" id="${id}" style="${A(x, 430)};width:200px;height:140px;box-sizing:border-box;border:5px solid ${id === 't2c' ? TLC : '#8a93a6'};border-radius:20px;background:${id === 't2c' ? '#e0f3f5' : '#f3f5f9'};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:32px;font-weight:800;color:${id === 't2c' ? TLC : '#5d6472'}">${IC(ic, 'width:56px;height:56px')}${t}</div>`));
  [['r2a', 790, 440, 'Check a ticket', 270], ['r2b', 1085, 440, 'New ticket', 210], ['r2c', 790, 512, 'Talk to a person', 300]].forEach(([id, x, y, t, w]) => ADD(`<div class="bub h" id="${id}" style="${A(x, y)};width:${w}px;text-align:center;background:${PILL};border-color:${BLUE};color:#1f3a8a;border-radius:999px">${t}</div>`));
  [['d2a', 790, 'text_t'], ['d2b', 910, 'braces'], ['d2c', 1030, 'image'], ['d2d', 1150, 'cursor_click'], ['d2e', 1270, 'copy']].forEach(([id, x, ic]) => ADD(`<div class="w h" id="${id}" style="${A(x, 455)};width:100px;height:100px;box-sizing:border-box;border:5px solid ${GRN};border-radius:50%;background:#e3f4ea;display:flex;align-items:center;justify-content:center;color:${GRN}">${IC(ic, 'width:56px;height:56px')}<span style="position:absolute;right:-12px;bottom:-10px">${IC('checkmark_circle', 'width:40px;height:40px;color:' + GRN + ';background:#fff;border-radius:50%')}</span></div>`));
  /* scene 7 */
  ADD(`<div class="w h" id="gc" style="${A(560, 236)};width:940px;height:320px;box-sizing:border-box;background:#fff6dc;border:10px solid ${GO};border-radius:36px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px"><div style="font-size:36px;font-weight:800;color:${GOD}">Send specific response</div><div style="font-size:48px;font-weight:800;color:${INK};white-space:nowrap">Ticket <span class="sl7" style="background:#ffe08a;border:3px dashed ${GO};border-radius:12px;padding:0 8px">{number}</span>, status <span class="sl7" style="background:#ffe08a;border:3px dashed ${GO};border-radius:12px;padding:0 8px">{status}</span></div></div>`);
  ADD(`<div class="tg" id="fx7" style="${A(1290, 258)};width:190px;background:${NAVY};color:#fff;text-align:center;z-index:5">Power Fx</div>`);
  ADD(PEN(`${A(420, 600)};color:#6b4f2a;opacity:0`));
  ADD(bub('wb7', 790, 330, 600, 'Ticket 4821, status In progress', '', `border-color:${GRN}`));
  [0, 1, 2].forEach((k) => ADD(`<div class="w h" id="ck7${k}" style="${A(790 + k * 64, 424)};width:56px;height:56px">${IC('checkmark_circle', 'width:56px;height:56px;color:' + GRN)}</div>`));
  /* scene 10 recap board */
  const rrow = (id, y, h, inner) => `<div class="w" id="${id}" style="left:24px;top:${y}px;width:660px;height:${h}px;opacity:.32;font-size:34px;font-weight:800;color:${INK}">${inner}</div>`;
  const rc = (t, bg) => `<span style="display:inline-block;background:${bg};color:#fff;border-radius:14px;padding:2px 16px;margin-right:10px;white-space:nowrap">${t}</span>`;
  ADD(`<div class="w h" id="rb" style="${A(760, 150)};width:720px;height:450px;box-sizing:border-box;background:#fff;border:10px solid ${NAVY};border-radius:28px;overflow:hidden;z-index:6"><div style="position:absolute;left:24px;top:12px;font-size:44px;font-weight:800;color:${NAVY};white-space:nowrap">Remember: three shapes</div>
    ${rrow('rl0', 84, 100, rc('Message variations', VIO) + '<div style="margin-top:6px">wording at random</div>')}
    ${rrow('rl1', 196, 110, rc('Quick replies', BLUE) + 'suggest<div style="margin-top:6px">' + rc('multiple choice', NAVY) + 'forces</div>')}
    ${rrow('rl2', 318, 110, 'After a tool:<div style="margin-top:6px">' + rc('Send specific response', GO) + '</div>')}</div>`);

  /* ═══════ SET B ═══════ */
  ADD(`<div class="w" id="desk" style="${Bq(120, 740)};width:1680px;height:60px;background:#c9ced8;border-radius:10px"></div><div class="w" style="${Bq(120, 800)};width:1680px;height:330px;background:#c9ced8"></div>`);
  ADD(`<div class="w" id="sL" style="${Bq(120, 200)};width:780px;height:520px;box-sizing:border-box;background:${CRM};border:6px solid #d9c9a6;border-radius:12px;box-shadow:var(--shadow)"><div style="padding:18px 32px;font-size:44px;font-weight:800;color:#5b4a2a;font-family:'Segoe Script','Bradley Hand',cursive">Handwritten note</div></div>`);
  ADD(`<svg class="w" id="sLp" style="${Bq(150, 290)};overflow:visible" width="720" height="420" viewBox="0 0 720 420" fill="none" stroke="#3a3a5a" stroke-width="6" stroke-linecap="round">${[0, 1, 2, 3, 4].map((k) => `<path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" class="pen" d="M10 ${50 + k * 80} q22 -34 44 0 t44 0 t44 0 t44 0 t44 0 t44 0 t44 0 ${k % 2 ? '' : 't44 0 t44 0'}"/>`).join('')}</svg>`);
  ADD(`<div class="w" id="sR" style="${Bq(1020, 200)};width:780px;height:520px;box-sizing:border-box;background:#fff;border:8px solid ${NAVY};border-radius:20px;box-shadow:var(--shadow)"><div style="padding:16px 32px;font-size:44px;font-weight:800;color:${NAVY}">Form with checkboxes</div>${['hardware', 'software', 'access'].map((t, k) => `<div class="w" style="left:40px;top:${130 + k * 110}px;height:70px;display:flex;align-items:center;gap:24px;font-size:46px;font-weight:700;color:${INK}"><span style="width:60px;height:60px;box-sizing:border-box;border:6px solid ${NAVY};border-radius:12px;display:inline-block"></span>${t}</div>`).join('')}</div>`);
  [0, 1, 2].forEach((k) => ADD(`<svg class="w h" id="tkc${k}" style="${Bq(1020 + 8 + 40 + 2, 200 + 8 + 130 + k * 110 + 5)}" width="56" height="56" viewBox="0 0 56 56"><path d="M10 30 L23 43 L47 12" stroke="${GRN}" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`));
  ADD(`<div class="w h" id="hd" style="${Bq(905, 600)};width:110px;height:110px;border-radius:50%;background:${BLUE};display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow)">${IC('cursor_click', 'width:64px;height:64px')}</div>`);
  [['sc0', 445, 'text_t', 'exact text', GO], ['sc1', 815, 'cursor_click', 'buttons', BLUE], ['sc2', 1185, 'card_ui', 'a card', TLC]].forEach(([id, x, ic, t, c]) => ADD(`<div class="chip sm h" id="${id}" style="${Bq(x, 834)};border-color:${c};color:${c}">${IC(ic)}<span>${t}</span></div>`));
  /* tool room (6) */
  ADD(tbxSvg('tb6', 'left:2095px', `top:${490 + YO}px`, 400, 250, true).replace('<svg class="w"', '<svg class="w h"'));
  ADD(agent('nx6', 1920 + 580, 330 + YO, { folder: '' }).replace('width="360" height="500"', 'width="288" height="400"').replace('<svg class="w"', '<svg class="w h"'));
  ADD(`<div class="w h" id="rc6" style="${Bq(150, 350)};width:380px;height:90px;box-sizing:border-box;background:#fff;border:5px solid ${GRN};border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;white-space:nowrap">4821 · In progress</div>`);
