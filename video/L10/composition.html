<!-- @world -->
<script>
  /* L10 · Generative answers node. World 3840x2160. The Contoso records archive: four rolling racks,
     reply screen band, request window (Marta), Valeria, Nexo the librarian. Set B (x+1920): close-ups,
     source switch panel, answer desk, Teams window + moderation dial, Valeria's desk, next-lesson sign. */
  const NAVY = '#1f2a44', NAVYC = '#1f2a44', NAVY2 = '#1f2a44';
  const BLUE = '#2f5bd3', HRB = '#2f6fdb', ORG = '#e08a1e', BRN = '#8d5a3b', VIO = '#7b5cd6', GRN = '#1e7f4f', RED = '#c4392f', AMB = '#d98a00', TLC = '#0f7b8a', CRM = '#f4ead2', CORAL = '#e07a5f', INK = '#141821', GRY = '#5b6578';
  const YO = 700;
  const A = (x, y) => `left:${x}px;top:${y + YO}px`, Bq = (x, y) => `left:${x + 1920}px;top:${y + YO}px`;
  const human = (id, x, y, top, hair, extra, wh) => { const [w, h] = wh || [200, 380]; return `<svg class="w ${extra === 'h' ? 'h' : ''}" id="${id}" style="left:${x}px;top:${y}px" width="${w}" height="${h}" viewBox="0 0 200 380"><g><path d="M16 380 Q16 170 100 158 Q184 170 184 380 Z" fill="${top}"/><circle cx="100" cy="92" r="54" fill="#f2c9a6"/><path d="M44 90 Q44 30 100 30 Q156 30 156 90 Q130 62 100 64 Q70 62 44 90 Z" fill="${hair}"/><circle cx="80" cy="98" r="6" fill="#141821"/><circle cx="120" cy="98" r="6" fill="#141821"/><path d="M84 122 Q100 134 116 122" stroke="#141821" stroke-width="5" fill="none" stroke-linecap="round"/></g></svg>`; };
  const PEN = (st, id) => `<svg class="w" id="${id}" style="${st}" width="76" height="76" viewBox="0 0 70 70"><path d="M10 60 L14 44 L44 14 a6 6 0 0 1 8 0 l4 4 a6 6 0 0 1 0 8 L26 56 Z" fill="currentColor"/></svg>`;
  const bub = (id, x, y, w, t, cls, st) => `<div class="bub h ${cls || ''}" id="${id}" style="${A(x, y)};width:${w}px;${st || ''}">${t}</div>`;
  const bubB = (id, x, y, w, t, cls, st) => `<div class="bub h ${cls || ''}" id="${id}" style="${Bq(x, y)};width:${w}px;${st || ''}">${t}</div>`;
  const tagB = (id, x, y, w, t, bg, col, bd, h) => `<div class="tg" id="${id}" style="${Bq(x, y)};width:${w}px;${h ? 'height:' + h + 'px;' : ''}background:${bg};color:${col};border:3px solid ${bd || bg};text-align:center;display:flex;align-items:center;justify-content:center">${t}</div>`;
  const tagA = (id, x, y, w, t, bg, col, bd, h) => `<div class="tg" id="${id}" style="${A(x, y)};width:${w}px;${h ? 'height:' + h + 'px;' : ''}background:${bg};color:${col};border:3px solid ${bd || bg};text-align:center;display:flex;align-items:center;justify-content:center">${t}</div>`;
  const citt = (id, x, y, t, col, pos, st) => `<div class="citt" id="${id}" style="${pos(x, y)};color:${col};${st || ''}">${IC('document_text', 'width:34px;height:34px')}${t}</div>`;
  const LBH = (id, t, c) => `<div class="bl ${c || ''}" id="${id}">${t}</div>`;

  /* ═══════ SET A · the records archive ═══════ */
  ADD(`<div class="w" id="railA" style="${A(548, 1012)};width:1364px;height:52px;background:#c3cad6;border-radius:10px"></div>`);
  const RACK = (id, pos, col, name) => `<div class="w" id="${id}" style="${pos};width:310px;height:560px;box-sizing:border-box;background:#eceff5;border:7px solid #77808f;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)">
    <div class="w" id="${id}_h" style="left:0;top:0;width:100%;height:64px;background:${col};color:#fff;font-size:34px;font-weight:800;display:flex;align-items:center;padding-left:20px;box-sizing:border-box">${name}</div>
    ${[0, 1, 2, 3].map((k) => `<div class="w" style="left:14px;top:${78 + k * 114}px;width:256px;height:96px;display:flex;gap:12px">
      <div class="w" style="width:84px;height:100%;background:#fff;border:2px solid ${col};border-top:14px solid ${col};border-radius:6px;box-shadow:0 2px 8px rgba(16,24,40,.14)"></div>
      <div class="w" ${k === 2 && id === 'rk1' ? 'id="rfd1" ' : ''}style="width:84px;height:100%;background:#fff;border:2px solid ${col};border-top:14px solid ${col};border-radius:6px;box-shadow:0 2px 8px rgba(16,24,40,.14)"></div>
      <div class="w" style="flex:1;height:100%;background:#fff;border:2px solid ${col};border-top:14px solid ${col};border-radius:6px;box-shadow:0 2px 8px rgba(16,24,40,.14)"></div></div>`).join('')}
    <div class="w" id="${id}_sh" style="left:0;top:64px;width:100%;height:489px;background:${GRY};transform-origin:center top;transform:scaleY(0)"></div>
    <div class="w" id="${id}_g" style="left:-9px;top:-9px;width:318px;height:568px;box-sizing:border-box;border:6px solid ${col};border-radius:20px;box-shadow:0 0 46px 14px ${col};opacity:0"></div></div>`;
  ADD(RACK('rk0', A(580, 470), HRB, 'HR policies'));
  ADD(RACK('rk1', A(914, 470), ORG, 'Marketing'));
  ADD(RACK('rk2', A(1248, 470), BRN, 'Finance'));
  ADD(RACK('rk3', A(1582, 470), VIO, 'IT'));
  ADD(human('mar', 130, 500 + YO, CORAL, '#3a2a22'));
  ADD(`<div class="w" id="ctA" style="${A(70, 900)};width:500px;height:180px;background:#c9ced8;border-radius:12px 12px 0 0"></div>`);
  ADD(`<div class="w" id="lap" style="${A(160, 780)};width:260px;height:150px;box-sizing:border-box;background:#1f2a44;border-radius:12px;box-shadow:var(--shadow)"><div style="position:absolute;left:12px;top:12px;right:12px;bottom:16px;background:#f3f5f9;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#5d6472">HR agent</div></div>`);
  ADD(human('val', 360, 520 + YO, VIO, '#30242c', 'h'));

  /* reply screen band above the racks */
  ADD(`<div class="w" id="scr" data-lint="ignore" style="${A(600, 110)};width:1130px;height:270px;box-sizing:border-box;background:#fdfdff;border:10px solid #1f2a44;border-radius:26px;overflow:hidden;box-shadow:var(--shadow)"><div style="height:48px;background:#1f2a44;color:#fff;font-size:32px;font-weight:700;padding:0 20px;display:flex;align-items:center;gap:12px;box-sizing:border-box">${IC('chat', 'width:34px;height:34px')}HR agent</div></div>`);
  ADD(bub('uB1', 1080, 140, 610, 'How much parental leave do I get?', 'me'));
  ADD(bub('aB0', 640, 208, 740, 'Our brand promise: time for family...', '', `border-color:${AMB}`));
  ADD(citt('citA', 660, 292, 'Marketing', ORG, A));
  ADD(`<svg class="w h" id="brr0" style="${A(660, 398)}" width="80" height="64" viewBox="0 0 80 64"><path d="M8 6 L56 6 L56 34 L70 34 L40 60 L12 34 L26 34 L26 6 Z" fill="${HRB}"/></svg>`);
  /* scene 0 s3: teal card ghost + fill beside the racks (left of Marta, off the IT rack) */
  ADD(`<div class="w h" id="tin3" style="${A(210, 290)};width:250px;height:210px;box-sizing:border-box;border:6px dashed ${TLC};border-radius:22px;background:rgba(15,123,138,.06)"></div>`);
  ADD(`<div class="w h" id="tin3c" style="${A(210, 290)};width:250px;height:210px;box-sizing:border-box;background:${TLC};border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;justify-content:center">
    <div style="width:100%;height:74px;background:${CRM};border:3px solid #d9c9a6;border-radius:12px;display:flex;align-items:center;padding:10px 14px;box-sizing:border-box;font-size:32px;font-weight:700;color:#3a3a5a;line-height:1.2">Time for family</div>
    <div style="width:100%;height:52px;background:#fff;border:3px solid ${HRB};border-radius:999px;display:flex;align-items:center;gap:6px;padding:0 10px;box-sizing:border-box;font-size:22px;font-weight:800;color:${HRB};white-space:nowrap">${IC('document_text', 'width:22px;height:22px')}HR policies</div></div>`);
  /* scene 10: recap board above the racks */
  ADD(`<div class="w h" id="rb10" style="${A(640, 225)};width:1090px;height:245px;box-sizing:border-box;background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:12px 28px">
    <div style="font-size:38px;font-weight:800;color:${NAVY2};line-height:1.15">Remember: three rules</div>
    ${['Selected sources replace the agent\u2019s: no fallback', 'Clear Send a message: you add the citations', 'Moderation: Lowest to Highest, default High'].map((t, k) => `<div class="w" id="rb10_${k}" style="position:relative;left:0;top:0;width:1032px;box-sizing:border-box;margin-top:8px;padding:3px 18px;border-radius:12px;background:#f3f5f9;border:3px solid ${NAVY2};font-size:30px;font-weight:700;color:${INK};opacity:0.45">${t}</div>`).join('')}</div>`);
  /* scene 2: flow strip + source chips (own row) + Topics door/fallback + variable box (set B, rack row abs y 1220-1780) */
  ADD(`<div class="w h" id="flw" style="${Bq(401, 120)};width:1338px;height:130px;display:flex;align-items:center;gap:16px">
    ${[['Question', 240, NAVYC, '#fff'], ['Generative answers', 420, HRB, '#fff'], ['Sources', 240, NAVYC, '#fff'], ['Answer', 240, NAVYC, '#fff']].map(([t, w, bg, c], k) => `<div style="width:${w}px;height:130px;background:${bg};color:${c};border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:36px;font-weight:800;line-height:1.1;box-shadow:var(--shadow);white-space:nowrap;${k === 1 ? 'outline:6px solid #ffd166;outline-offset:6px' : ''}">${t}${k === 3 ? '<span style="font-size:32px;font-weight:700;opacity:.85">next node</span>' : ''}</div>${k < 3 ? `<div style="width:0;height:0;border-left:34px solid #77808f;border-top:22px solid transparent;border-bottom:22px solid transparent"></div>` : ''}`).join('')}</div>`);
  ADD(`<div class="w h" id="fr2" style="${Bq(1540, 265)};width:300px;height:240px;box-sizing:border-box;border:5px dashed ${NAVY2};border-radius:26px"></div>`);
  ADD(`<div class="w h" id="door2" style="${Bq(1570, 285)};width:250px;height:200px;box-sizing:border-box;background:#2d3a5c;border-radius:18px;border:8px solid #1f2a44"></div>`);
  ADD(`<div class="w h" id="door2p" style="${Bq(1585, 298)};width:220px;height:50px;background:#fff;border:3px solid ${NAVY2};border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:${NAVY2}">Topics</div>`);
  ADD(`<div class="w h" id="door2s" style="${Bq(1575, 358)};width:240px;height:84px;background:#fde8e6;border:4px solid ${RED};border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:34px;font-weight:800;color:${RED};line-height:1.1">no topic matches</div>`);
  ADD(`<svg class="w h" id="chute2" style="${Bq(1410, 330)};overflow:visible" width="160" height="160" viewBox="0 0 160 160"><path d="M150 140 C 110 140, 50 110, 6 22" fill="none" stroke="#77808f" stroke-width="26" stroke-linecap="round"/></svg>`);
  ADD(tagB('tag2', 990, 300, 420, 'Generative answers', NAVY2, '#fff'));
  ADD(bubB('ch2b', 1350, 420, 240, 'a question', '', `border-color:#77808f;font-size:34px`));
  ADD(`<div class="w h" id="vb2" style="${Bq(380, 300)};width:380px;height:100px;box-sizing:border-box;background:#fff;border:5px solid ${NAVY2};border-radius:20px;display:flex;align-items:center;gap:14px;padding:0 18px;box-shadow:var(--shadow)">
    <div style="display:flex;align-items:center;gap:10px;font-size:34px;font-weight:800;color:${NAVY2};white-space:nowrap">${IC('copy', 'width:40px;height:40px;color:' + NAVY2)}variable</div>
    <div class="w h" id="avb" style="position:relative;left:0;top:0;width:130px;height:52px;background:${CRM};border:3px solid #d9c9a6;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#3a3a5a">answer</div></div>`);
  /* scene 3: beam + agent's-sources ring (ring added before the rack row so it sits behind) */
  ADD(`<div class="w h" id="bam3" style="${Bq(150, 530)};width:260px;height:510px;background:rgba(217,138,0,.30);border-radius:22px"></div>`);
  ADD(`<div class="w h" id="rg3" style="${Bq(100, 505)};width:1720px;height:575px;box-sizing:border-box;border:5px dashed ${BLUE};border-radius:40px"></div>`);
  ADD(tagB('rg3l', 820, 390, 340, "agent's sources", NAVY2, '#fff'));
  ADD(bubB('qg3', 800, 320, 560, 'What is the gym discount?', 'me', 'font-size:34px')); /* scene 3 s4: question the shuttered Finance shelf cannot answer */

  /* ═══════ SET B · close-ups, panel, answer desk, Teams window, dial, desks ═══════ */
  /* scene-2/3 rack row (same RACK builder): rkB0 rkB1 rkB2 rkB3 */
  ADD(RACK('rkB0', Bq(150, 520), HRB, 'HR policies'));
  ADD(RACK('rkB1', Bq(590, 520), ORG, 'Marketing'));
  ADD(RACK('rkB2', Bq(1030, 520), BRN, 'Finance'));
  ADD(RACK('rkB3', Bq(1470, 520), VIO, 'IT'));
  [['icDV', 'database', 'Dataverse documents', 410, 430], ['icSP', 'building', 'SharePoint site', 890, 360], ['icPW', 'globe', 'Public website', 1300, 390]].forEach(([id, ic, t, x, w]) => ADD(`<div class="w h" id="${id}" style="${Bq(x, 310)};width:${w}px;height:86px;display:flex;align-items:center;gap:14px;padding:0 22px;box-sizing:border-box;background:#fff;border:4px solid ${NAVY2};border-radius:999px;font-size:34px;font-weight:800;color:${INK};white-space:nowrap;box-shadow:var(--shadow)">${IC(ic, 'width:44px;height:44px;color:' + NAVY2)}${t}</div>`));
  /* scene 1: librarian close: Nexo in front of the racks (below the name tags), cream paper on the wall, topic frame = node + HR rack only */
  ADD(`<div class="w h" id="tf1" style="${Bq(90, 310)};width:470px;height:800px;box-sizing:border-box;border:5px dashed ${HRB};border-radius:30px"></div>`);
  ADD(`<div class="w h" id="tf1L" style="${Bq(130, 330)};width:360px;height:58px;background:${NAVY2};color:#fff;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800">HR policies topic</div>`);
  const AGT = (id, x, y, w, h) => agent(id, x, y, { folder: '' }).replace('width="360" height="500"', `width="${w}" height="${h}"`);
  ADD(AGT('nx0', 1250, YO + 580, 288, 400)); /* Nexo in the archive (set A, scene 0) */
  ADD(AGT('nx1', 2050, YO + 630, 330, 458).replace('<svg class="w"', '<svg class="w h"'));  ADD(`<svg class="w h" id="lb1" style="${Bq(375, 710)}" width="84" height="80" viewBox="0 0 84 80"><circle cx="42" cy="66" r="12" fill="#5b6578"/><rect x="36" y="30" width="12" height="36" rx="5" fill="#77808f"/><path d="M10 34 Q26 6 60 10 L74 40 L10 34 Z" fill="#ffd166"/></svg>`);
  ADD(bubB('bfly', 1250, 300, 610, 'How much parental leave do I get?', 'me', 'font-size:34px'));
  ADD(`<svg class="w h" id="sl1" style="${Bq(205, 300)}" width="200" height="230" viewBox="0 0 200 230"><polygon points="100,0 200,230 0,230" fill="rgba(255,209,102,.26)"/></svg>`);
  ADD(`<div class="w h" id="hd1" style="${Bq(257, 310)};width:96px;height:96px;border-radius:50%;background:#fff;border:6px solid ${HRB};display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)">${IC('cursor_click', 'width:54px;height:54px;color:' + HRB)}</div>`);
  const FOL = (id, x, col) => `<div class="w h" id="${id}" style="${Bq(x, 600)};width:130px;height:80px;box-sizing:border-box;background:${col};border:3px solid #fff;border-radius:8px;box-shadow:var(--shadow)"><div style="position:absolute;left:8px;top:-10px;width:52px;height:18px;background:${col};border:3px solid #fff;border-bottom:none;border-radius:6px 6px 0 0"></div><div style="position:absolute;left:14px;top:26px;width:100px;height:8px;background:rgba(255,255,255,.85);border-radius:4px"></div><div style="position:absolute;left:14px;top:46px;width:72px;height:8px;background:rgba(255,255,255,.85);border-radius:4px"></div></div>`;

  ON('#uMenuP', S(9, 3) + 1.0, 0.25);
  CUR(PU.mp0[0], PU.mp0[1], S(9, 3) + 1.3, 0.6); CLICK(PU.mp0[0], PU.mp0[1], S(9, 3) + 2.0);
  OFF('#uMenuP', S(9, 3) + 2.1, 0.2); ON('#uPan', S(9, 3) + 2.2, 0.35); OFF('#uDot', S(9, 3) + 2.1, 0.15);

  OFF('#uPan', S(9, 5) + 0.1, 0.3); ON('#uCh', S(9, 5) + 0.45, 0.35); OFF('#uEnd', S(9, 5) + 0.2, 0.25);
