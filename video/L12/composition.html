<script>
  /* L12 · Adaptive Cards. The Contoso check-in hall, world 3840x2160.

  const hmn = (id, x, y, top, hair, extra) => `<svg class="w ${extra || ''}" id="${id}" style="left:${x}px;top:${y}px" width="200" height="380" viewBox="0 0 200 380"><path d="M16 380 Q16 170 100 158 Q184 170 184 380 Z" fill="${top}"/><circle cx="100" cy="92" r="54" fill="#f2c9a6"/><path d="M44 90 Q44 30 100 30 Q156 30 156 90 Q130 62 100 64 Q70 62 44 90 Z" fill="${hair}"/><circle cx="80" cy="98" r="6" fill="#141821"/><circle cx="120" cy="98" r="6" fill="#141821"/><path d="M84 122 Q100 134 116 122" stroke="#141821" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`;

  };
  const VT = (id, x, y, t, grey) => `<div class="w h" id="${id}" style="left:${x}px;top:${y}px;height:64px;padding:0 24px;box-sizing:border-box;display:flex;align-items:center;border-radius:999px;background:${grey ? '#c9ced8' : AMB};color:${grey ? '#5b6578' : '#3b2a00'};font-size:44px;font-weight:800;white-space:nowrap;box-shadow:var(--shadow)">${t}</div>`;

  ADD(bub('n1', 740, 444, 220, 'Title?', '', false));

  ADD(bub('n2', 740, 600, 300, 'Urgency?', '', false));
  ADD(bub('dots', 1646, 600, 130, '...', 'me', false));
  ADD(bub('m2', 1576, 600, 200, 'High', 'me', false));

  ADD(bub('conf', 740, 444, 1040, 'I registered your ticket with High urgency', 'crm', false));
  ADD(`<div class="w" id="inbar" style="left:724px;top:676px;width:1052px;height:62px;box-sizing:border-box;background:#fff;border-radius:16px;display:flex;align-items:center;padding-left:24px;font-size:40px;font-weight:700;color:#8a93a6">Type a message</div>`);

  ADD(hmn('mgr', 1340, 870, '#8a93a6', '#d9dde6', 'h'));
  ADD(`<div class="w h" id="mgrC" style="left:1306px;top:1060px;width:90px;height:120px;box-sizing:border-box;background:#b0926a;border-radius:10px;padding:10px 8px"><div style="width:100%;height:100%;background:#fff;border-radius:6px"></div></div>`);
  ADD(`<div class="w h" id="stub" style="left:800px;top:870px;width:440px;height:150px;box-sizing:border-box;background:#fff;border:5px solid #8a93a6;border-radius:16px;box-shadow:var(--shadow)"><div style="position:absolute;left:20px;top:30px;width:190px;height:88px;box-sizing:border-box;border:5px dashed #8a93a6;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:#5b6578">Title</div><div style="position:absolute;left:226px;top:30px;width:196px;height:88px;box-sizing:border-box;border:5px dashed #8a93a6;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:#5b6578">Urgency</div></div>`);
  /* clipboard with a tick list (scene 1) */
  ADD(`<div class="w h" id="clb" style="left:1290px;top:780px;width:340px;height:380px;box-sizing:border-box;background:#b0926a;border-radius:18px;box-shadow:var(--shadow)"><div style="position:absolute;left:100px;top:-14px;width:140px;height:36px;background:${NAVY};border-radius:10px"></div><div style="position:absolute;left:18px;top:30px;width:304px;height:332px;box-sizing:border-box;background:#fff;border-radius:10px;padding:16px 18px"><div style="font-size:44px;font-weight:800;color:${TLC};margin-bottom:12px">Ticket</div><div style="display:flex;align-items:center;gap:14px;font-size:44px;font-weight:700;height:84px">${IC('checkmark_circle', 'width:52px;height:52px;color:' + TLC)}Title</div><div style="display:flex;align-items:center;gap:14px;font-size:44px;font-weight:700;height:84px">${IC('checkmark_circle', 'width:52px;height:52px;color:' + TLC)}Urgency</div></div></div>`);

  ADD(`<svg class="w h" id="arr1" style="left:0;top:0;overflow:visible;pointer-events:none" width="3840" height="2160" viewBox="0 0 3840 2160"><defs><marker id="ah" markerWidth="4" markerHeight="4" refX="3" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="${TLC}"/></marker></defs><path id="arr1p" d="M380 1050 C560 760 1000 740 1250 940" fill="none" stroke="${TLC}" stroke-width="16" stroke-linecap="round" marker-end="url(#ah)"/></svg>`);

  ADD(`<div class="w h" id="tap1" style="left:915px;top:1085px;width:90px;height:90px;box-sizing:border-box;border-radius:50%;border:8px solid ${NAVY}"></div>`);
  /* corridor "Custom prompts" (scene 11, far left side) */
  ADD(`<div class="w h" id="corr" style="left:-380px;top:760px;width:400px;height:720px;box-sizing:border-box;background:linear-gradient(90deg,#3a4a78,#1f2a44);border:14px solid ${NAVY};border-bottom:none;border-radius:26px 26px 0 0"></div>`);
  ADD(`<div class="w h" id="signN" style="left:-500px;top:560px;width:640px;height:150px;box-sizing:border-box;background:${NAVY};border-radius:24px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:20px;color:#fff;font-size:58px;font-weight:800">${IC('sparkle', 'width:64px;height:64px;color:#ffd166')}Custom prompts</div>`);
  { const wd = document.getElementById('world'), g = document.createElement('div'); g.id = 'hallG'; g.style.cssText = 'position:absolute;left:0;top:0;width:0;height:0'; const kids = Array.from(wd.children).slice(__h0); wd.insertBefore(g, kids[0]); kids.forEach((k) => g.appendChild(k)); }
  const __d0 = document.getElementById('world').children.length;
  /* Valeria's lab desk (front-left, from L01) + Valeria at the desk (scene 10) */
  ADD(`<div class="w" id="vdesk" style="left:100px;top:1640px;width:520px;height:160px"><div style="height:26px;background:#aeb6c6;border-radius:10px 10px 0 0"></div><div style="height:134px;background:#c9ced8"></div></div>`);

  { const wd = document.getElementById('world'), g = document.createElement('div'); g.id = 'deskG'; g.style.cssText = 'position:absolute;left:0;top:0;width:0;height:0;opacity:0'; const kids = Array.from(wd.children).slice(__d0); wd.insertBefore(g, kids[0]); kids.forEach((k) => g.appendChild(k)); }
  /* variable rail (front-centre) */
  ADD(`<div class="w" id="rail" style="left:700px;top:1540px;width:2200px;height:120px;box-sizing:border-box;background:#77808f;border-radius:14px;box-shadow:var(--shadow)"><div style="position:absolute;left:0;right:0;top:12px;height:14px;background:#5f6875;border-radius:8px"></div><div style="position:absolute;left:0;right:0;bottom:12px;height:14px;background:#5f6875;border-radius:8px"></div></div>`);
  ADD(`<div class="w h" id="railL" style="left:720px;top:1560px;height:80px;display:flex;align-items:center;font-size:44px;font-weight:800;color:#fff;white-space:nowrap">Variables</div>`);

  /* Nexo (blue robot, check-in agent) with a chest badge */

  ADD(`<div class="w" id="nxBd" style="left:1754px;top:1064px;width:74px;height:74px;box-sizing:border-box;border-radius:50%;background:#fff;border:6px solid ${TLC};display:flex;align-items:center;justify-content:center;color:${TLC}">${IC('card_ui', 'width:42px;height:42px')}</div>`);
  ADD(`<div class="w h" id="nxBg" style="left:1738px;top:1048px;width:106px;height:106px;box-sizing:border-box;border-radius:50%;border:8px solid #ffd166;box-shadow:0 0 40px 12px rgba(255,209,102,.6)"></div>`);

  /* ── scene 2: topic strip + node tag + two sheets ── */

  ADD(`<div class="w h" id="strL" style="left:735px;top:868px;width:110px;height:8px;background:#c9ced8;border-radius:4px"></div>`);

  ADD(`<div class="w h" id="clip2" style="left:1090px;top:912px;width:60px;height:90px;box-sizing:border-box;background:${NAVY};border-radius:10px"></div>`);
  ADD(SHEET('sh2', 860, 980));
  ADD(VT('vt0', 1440, 1086, 'title'));

  ADD(`<div class="w h" id="tap2" style="left:1775px;top:1135px;width:90px;height:90px;box-sizing:border-box;border-radius:50%;border:8px solid ${NAVY}"></div>`);
  ADD(`<div class="w h" id="rGlow" style="left:700px;top:1530px;width:2200px;height:140px;box-sizing:border-box;border:8px solid #ffd166;border-radius:20px;box-shadow:0 0 40px 10px rgba(255,209,102,.5)"></div>`);
