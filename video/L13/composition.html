<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>L13 · Custom prompts · world style</title>
<script src="gsap.min.js"></script>
<!-- TAIL 2.5 -->
<link rel="stylesheet" href="style.css" />
<style>
  .h { opacity: 0; }
  .bl { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; top: 950px; white-space: nowrap; font-size: 42px; font-weight: 800; padding: 10px 32px; border-radius: 999px; background: #fff; border: 4px solid #2f5bd3; color: #2f5bd3; box-shadow: var(--shadow); opacity: 0; }
  .bl.red { border-color: #c4392f; color: #c4392f; } .bl.green { border-color: #1e7f4f; color: #1e7f4f; } .bl.vi { border-color: #7b5cd6; color: #7b5cd6; } .bl.go { border-color: #b8860b; color: #8a6508; } .bl.tl { border-color: #0f7b8a; color: #0f7b8a; } .bl.nv { border-color: #1f2a44; color: #1f2a44; } .bl.gr { border-color: #6b7280; color: #5b6578; }
  .pl { position: absolute; left: 120px; top: 60px; font-size: 40px; font-weight: 800; padding: 10px 28px; border-radius: 999px; background: #fff; border: 4px solid #2f5bd3; color: #2f5bd3; box-shadow: var(--shadow); white-space: nowrap; opacity: 0; }
  .nl { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; top: 940px; font-size: 40px; font-weight: 800; padding: 10px 30px; border-radius: 999px; background: #fff; border: 4px solid #1f2a44; color: #1f2a44; box-shadow: var(--shadow); white-space: nowrap; opacity: 0; }
  .exam .xq { font-size: 38px; }
  .exam .xwhy { top: 545px; font-size: 36px; }
  .exam .xp { top: 670px; height: 290px; }
  .xp .rm { height: 290px; width: 820px; }
  .xp .pz { position: absolute; box-sizing: border-box; white-space: nowrap; font-weight: 800; font-size: 32px; border-radius: 16px; padding: 2px 16px; background: #2d3a5c; color: #fff; border: 4px solid #3a4a78; }
  #stage #uiS { top: 80px; height: 820px; } #stage #uiS .nav div { font-size: 34px; } #stage #uiS .bar { font-size: 32px; } #stage #uiS .btn { font-size: 34px; } #stage #uiS .crumb { font-size: 32px; } #stage #uiS .fld { font-size: 34px; } #stage #uiS .fld small { font-size: 32px; } #exams .exam .xo em.trap { font-size: 32px; }
  .uw .nc { position: absolute; box-sizing: border-box; border: 3px solid var(--line2); border-radius: 18px; padding: 10px 24px; background: #fff; }
  .uw .nc small { display: block; font-size: 32px; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
  .uw .mn { position: absolute; background: #fff; border: 3px solid var(--line2); border-radius: 16px; box-shadow: 0 16px 40px rgba(16,24,40,.25); opacity: 0; font-size: 34px; font-weight: 700; }
  .uw .mn div { padding: 10px 24px; }
  .uw .vc { display: inline-block; font-size: 32px; font-weight: 800; padding: 2px 16px; border-radius: 999px; background: #0f7b8a; color: #fff; }
  .uw .ab { position: absolute; box-sizing: border-box; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
<section class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="2">
<div id="stage"></div>
</section>
<audio id="narr" src="narration.mp3" data-start="0" data-duration="{{DURATION}}" data-track-index="1" data-volume="1"></audio>
</div>

<!-- @world -->
<script>
  /* L13 · Custom prompts. The Contoso recipe studio, world 3840x2160.
     recipe wall x380-1500 y270-600 · inbox counter x380-960 y1290 · Marta x470 · laptop x700 y1180 · bench x1000-2200 top y1330 · card x1020-1460 y1060-1330
     · Nexo x1500 y870 · arch x1900-2200 y800-1330 · tasting counter x2290-2960 y1330 · manager x2690 · plates y1240 · dial panel x3050-3750 y300-920
     · agent-settings panel x3830-4250 · Valeria x880 y980 · Valeria's desk x100-620 y1640 (UI scene) · scene 2 lanes y1540-1790 · scene 3 doors y440-1040
     · scene 5 editor x1000-2400 y400-1300 · scene 8 answer rows x2230-2900 y560-780 · scene 11 Tools screen x520-1000 y650-880, people on the floor y1260-1640 · side door x-240 y760. */
  const NAVY = '#1f2a44', BLUE = '#2f5bd3', GRN = '#1e7f4f', RED = '#c4392f', AMB = '#e0a21e', VIO = '#7b5cd6', TLC = '#0f7b8a', CRM = '#f4ead2', TRY = '#cadca8', CORAL = '#e07a5f', INK = '#141821', GRY = '#6b7280';
  const hmn = (id, x, y, top, hair, extra) => `<svg class="w ${extra || ''}" id="${id}" style="left:${x}px;top:${y}px" width="200" height="380" viewBox="0 0 200 380"><path d="M16 380 Q16 170 100 158 Q184 170 184 380 Z" fill="${top}"/><circle cx="100" cy="92" r="54" fill="#f2c9a6"/><path d="M44 90 Q44 30 100 30 Q156 30 156 90 Q130 62 100 64 Q70 62 44 90 Z" fill="${hair}"/><circle cx="80" cy="98" r="6" fill="#141821"/><circle cx="120" cy="98" r="6" fill="#141821"/><path d="M84 122 Q100 134 116 122" stroke="#141821" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`;
  const PILL = (id, x, y, t, col, bg, st, vis) => `<div class="w ${vis ? '' : 'h'}" id="${id}" style="left:${x}px;top:${y}px;height:64px;padding:0 24px;box-sizing:border-box;display:flex;align-items:center;gap:10px;border-radius:999px;background:${bg || '#fff'};border:4px solid ${col};color:${col};font-size:44px;font-weight:800;white-space:nowrap;box-shadow:var(--shadow);${st || ''}">${t}</div>`;
  const DISH = (w) => `<svg width="${w}" height="${Math.round(w * 0.78)}" viewBox="0 0 64 50" style="display:block"><path d="M6 42 H58" stroke="#8a6a3a" stroke-width="5" stroke-linecap="round"/><path d="M12 40 Q12 16 32 16 Q52 16 52 40 Z" fill="#fff" stroke="#8a6a3a" stroke-width="4"/><circle cx="32" cy="11" r="4" fill="#8a6a3a"/></svg>`;
  const BARS = (n) => [330, 270, 300].slice(0, n).map((w) => `<div style="height:18px;width:${w}px;background:#d9c9a3;border-radius:9px;margin-bottom:14px"></div>`).join('');
  /* cream recipe card 440x270: dish icon, name tag, instruction area */
  const CARD = (id, x, y, o) => {
    o = o || {};
    return `<div class="w ${o.h ? 'h' : ''}" id="${id}" style="left:${x}px;top:${y}px;width:480px;height:270px;box-sizing:border-box;background:${CRM};border:6px solid #b0926a;border-radius:24px;box-shadow:var(--shadow)">
      <div style="position:absolute;left:20px;top:12px">${DISH(66)}</div>
      <div class="h" id="${id}_n1" style="position:absolute;left:100px;top:14px;height:56px;line-height:56px;font-size:44px;font-weight:800;color:${INK};white-space:nowrap">Custom prompt</div>
      <div class="h" id="${id}_n2" style="position:absolute;left:100px;top:14px;height:56px;line-height:56px;font-size:44px;font-weight:800;color:${INK};white-space:nowrap">Classify ticket</div>
      <div id="${id}_ins" style="position:absolute;left:20px;top:86px;width:428px;height:150px;box-sizing:border-box;border-radius:14px;background:#fffaf0;border:4px solid #d9c9a3;padding:20px">${BARS(3)}</div>
      <div class="h" id="${id}_gl" style="position:absolute;left:12px;top:78px;width:444px;height:166px;box-sizing:border-box;border:8px solid #ffd166;border-radius:20px;box-shadow:0 0 40px 10px rgba(255,209,102,.6)"></div></div>`;
  };
  const MC = (id, x, y) => `<div class="w h" id="${id}" style="left:${x}px;top:${y}px;width:190px;height:125px;box-sizing:border-box;background:${CRM};border:5px solid #b0926a;border-radius:18px;box-shadow:var(--shadow)"><div style="position:absolute;left:12px;top:8px">${DISH(44)}</div><div style="position:absolute;left:14px;top:62px;width:150px;height:42px;border-radius:10px;background:#fffaf0;border:3px solid #d9c9a3;padding:7px 10px;box-sizing:border-box"><div style="height:9px;width:110px;background:#d9c9a3;border-radius:5px;margin-bottom:7px"></div><div style="height:9px;width:80px;background:#d9c9a3;border-radius:5px"></div></div></div>`;
  const SLIP = (id, x, y, t, w, vis) => `<div class="w ${vis ? '' : 'h'}" id="${id}" style="left:${x}px;top:${y}px;width:${w || 230}px;height:100px;box-sizing:border-box;background:#fff;border:4px solid #c9ced8;border-left:16px solid ${CORAL};border-radius:12px;box-shadow:var(--shadow);padding:6px 14px">${t ? `<div style="font-size:40px;font-weight:800;color:${INK};white-space:nowrap;line-height:50px">${t}</div><div style="margin-top:6px;height:14px;width:70%;background:#dfe3ec;border-radius:7px"></div>` : `<div style="margin-top:12px;height:14px;width:75%;background:#dfe3ec;border-radius:7px"></div><div style="margin-top:12px;height:14px;width:50%;background:#dfe3ec;border-radius:7px"></div>`}</div>`;
  const PLATE = (id, x, y, t, o) => { o = o || {}; const g = o.grey; return `<div class="w h" id="${id}" style="left:${x}px;top:${y}px;width:${o.w || 250}px;height:90px;box-sizing:border-box;background:${g ? '#c9ced8' : TLC};border:6px solid ${g ? '#9aa5b6' : '#0b5f6b'};border-radius:999px;color:${g ? '#5b6578' : '#fff'};font-size:${o.fs || 48}px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;box-shadow:var(--shadow)">${o.icon ? IC(o.icon, 'width:52px;height:52px') : ''}${t || ''}</div>`; };
  const TRAY = (id, x, y, slipId, slipTxt) => `<div class="w h" id="${id}" style="left:${x}px;top:${y}px;width:560px;height:110px;box-sizing:border-box;background:${TRY};border:6px solid #9fb87a;border-radius:20px;box-shadow:var(--shadow);display:flex;align-items:center;padding-left:24px;font-size:44px;font-weight:800;color:#4a5e2c">input</div>`;
  const ICB = (id, x, y, n, col, bg, sz, st) => `<div class="w h" id="${id}" style="left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;box-sizing:border-box;border-radius:50%;background:${bg};border:6px solid ${col};display:flex;align-items:center;justify-content:center;color:${col};box-shadow:var(--shadow);${st || ''}">${IC(n, 'width:' + Math.round(sz * 0.55) + 'px;height:' + Math.round(sz * 0.55) + 'px')}</div>`;
  const GRP = (id, fn) => { const wd = document.getElementById('world'), n0 = wd.children.length; fn(); const g = document.createElement('div'); g.id = id; g.style.cssText = 'position:absolute;left:0;top:0;width:0;height:0'; const kids = Array.from(wd.children).slice(n0); wd.insertBefore(g, kids[0]); kids.forEach((k) => g.appendChild(k)); };

  /* backdrop patches so close-up framings never reveal a world edge */
  ADD(`<div class="w" style="left:-1300px;top:-420px;width:6400px;height:1920px;background:linear-gradient(#f4f6fa,#eef1f7)"></div><div class="w" style="left:-1300px;top:1500px;width:6400px;height:1100px;background:#e3e7ef"></div><div class="w" style="left:-1300px;top:1500px;width:6400px;height:6px;background:#d3d9e4"></div>`);
  /* recipe card wall (back wall, left) */
  GRP('gWall', () => {
    let h = '';
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 8; c++) h += `<div class="w" style="left:${400 + c * 138}px;top:${270 + r * 110}px;width:112px;height:72px;box-sizing:border-box;background:#f6efdc;border:3px solid #d9c9a3;border-radius:8px;padding:12px 14px"><div style="height:8px;width:70px;background:#e2d6b5;border-radius:4px;margin-bottom:8px"></div><div style="height:8px;width:48px;background:#e2d6b5;border-radius:4px"></div></div>`;
      h += `<div class="w" style="left:380px;top:${270 + r * 110 + 82}px;width:1130px;height:10px;background:#c9b896;border-radius:5px"></div>`;
    }
    ADD(h);
  });
  /* inbox: Marta's window, counter and laptop */
  GRP('gIn', () => {
    ADD(`<div class="w" id="ictr" style="left:380px;top:1290px;width:580px;height:210px"><div style="position:absolute;left:0;top:0;width:580px;height:26px;background:#cfd6e2;border-radius:12px 12px 0 0;box-shadow:var(--shadow)"></div><div style="position:absolute;left:0;top:26px;width:580px;height:184px;background:#9aa5b6"></div></div>`);
    ADD(hmn('mar', 470, 910, CORAL, '#3a2a22'));
    ADD(`<div class="w" id="lapM" style="left:700px;top:1180px;width:240px;height:110px;box-sizing:border-box;background:${NAVY};border-radius:12px;box-shadow:var(--shadow)"><div style="position:absolute;left:10px;top:10px;right:10px;bottom:14px;background:#f3f5f9;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#5d6472">${IC('ticket_diagonal', 'width:64px;height:64px')}</div></div>`);
  });
  /* prep bench */
  ADD(`<div class="w" id="bench" style="left:1000px;top:1330px;width:1200px;height:170px"><div style="position:absolute;left:0;top:0;width:1200px;height:30px;background:#c9a96e;border-radius:12px 12px 0 0;box-shadow:var(--shadow)"></div><div style="position:absolute;left:0;top:30px;width:1200px;height:140px;background:#9a7d57"></div></div>`);
  /* glowing "model" arch */
  ADD(`<div class="w" id="arch" style="left:1900px;top:800px;width:300px;height:530px"><div id="arch_gl" style="position:absolute;left:30px;top:80px;width:240px;height:450px;background:radial-gradient(ellipse at center,rgba(255,209,102,.55),rgba(255,209,102,.12));box-shadow:0 0 70px 14px rgba(255,209,102,.45)"></div><div style="position:absolute;left:0;top:80px;width:36px;height:450px;background:${NAVY};border-radius:10px 0 0 0"></div><div style="position:absolute;right:0;top:80px;width:36px;height:450px;background:${NAVY};border-radius:0 10px 0 0"></div><div style="position:absolute;left:0;top:0;width:300px;height:92px;box-sizing:border-box;background:${NAVY};border-radius:46px 46px 10px 10px;color:#fff;font-size:50px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px">${IC('sparkle', 'width:48px;height:48px;color:#ffd166')}model</div></div>`);
  /* Nexo (blue robot) with chest badge */
  ADD(agent('nx', 1500, 870, { folder: '' }).replace('width="360" height="500"', 'width="330" height="458"'));
  ADD(`<div class="w h" id="nxBd" style="left:1594px;top:1144px;width:74px;height:74px;box-sizing:border-box;border-radius:50%;background:${CRM};border:6px solid #b0926a;display:flex;align-items:center;justify-content:center">${DISH(38)}</div>`);
  ADD(`<div class="w h" id="nxBg" style="left:1578px;top:1128px;width:106px;height:106px;box-sizing:border-box;border-radius:50%;border:8px solid #ffd166;box-shadow:0 0 40px 12px rgba(255,209,102,.6)"></div>`);
  /* tasting counter + manager (grey vest, frowning) + two result plates */
  ADD(`<div class="w" id="tctr" style="left:2290px;top:1330px;width:670px;height:170px"><div style="position:absolute;left:0;top:0;width:670px;height:28px;background:#cfd6e2;border-radius:12px 12px 0 0;box-shadow:var(--shadow)"></div><div style="position:absolute;left:0;top:28px;width:670px;height:142px;background:#9aa5b6"></div></div>`);
  ADD(hmn('mgr', 2690, 950, '#8a93a6', '#d9dde6').replace('M84 122 Q100 134 116 122', 'M84 134 Q100 112 116 134'));
  ADD(PLATE('pl0', 2320, 1240, 'hardware'));
  ADD(PLATE('pl1', 2610, 1240, 'software'));
  /* Valeria + her cream card (scene 0) */
  ADD(hmn('val', 880, 980, VIO, '#30242c', 'h'));
  ADD(CARD('cd', 1020, 1060, { h: true }));
  ADD(SLIP('sA', 700, 1010, 'Ticket 1', 230, true));
  ADD(SLIP('sB', 700, 1120, 'Ticket 2', 230, true));

  /* ── scene 1: input slip, result plate, saved tick ── */
  GRP('g1', () => {
    ADD(SLIP('sl3', 1085, 1150, 'ticket text', 310));
    ADD(PLATE('res', 2320, 1240, '', { icon: 'clipboard_task_list_ltr' }));
    ADD(ICB('sv', 1480, 1010, 'checkmark_circle', TLC, '#fff', 84));
  });

  /* ── scene 2: lanes (prompt / conversation), book, child agent crate ── */
  GRP('g2', () => {
    const LANE = (id, x, tag) => `<div class="w h" id="${id}" style="left:${x}px;top:1540px;width:660px;height:250px;box-sizing:border-box;background:#fff;border:6px solid #c9ced8;border-radius:26px;box-shadow:var(--shadow)"></div>${PILL(id + 't', x + 24, 1556, tag, NAVY)}`;
    ADD(LANE('ln1', 960, 'prompt'));
    ADD(LANE('ln2', 1700, 'conversation'));
    ADD(PILL('stp', 1320, 1556, 'one turn', NAVY, '#eef1f7', 'transform:rotate(-4deg)'));
    ADD(SLIP('s2s', 990, 1660, '', 200, true).replace('class="w "', 'class="w h"'));
    ADD(PLATE('s2p', 1380, 1672, '', { w: 190, icon: 'checkmark_circle' }));
    ADD(`<svg class="w h" id="s2a" style="left:1215px;top:1675px" width="120" height="60" viewBox="0 0 120 60"><path d="M6 30 H90 M70 10 L100 30 L70 50" fill="none" stroke="#5b6578" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
    for (let k = 0; k < 4; k++) {
      ADD(`<div class="w h" id="bb${k}" style="left:${1730 + k * 150}px;top:1670px;width:120px;height:90px;box-sizing:border-box;border-radius:28px;background:${k % 2 ? CORAL : BLUE};display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow)">${IC('chat', 'width:54px;height:54px')}</div>`);
      if (k) ADD(`<div class="w h" id="bk${k}" style="left:${1730 + k * 150 - 30}px;top:1706px;width:30px;height:12px;background:#9aa5b6;border-radius:6px"></div>`);
    }
    ADD(`<div class="w h" id="bk" style="left:1130px;top:930px;width:110px;height:110px;box-sizing:border-box;border-radius:50%;background:#fff;border:6px solid ${BLUE};display:flex;align-items:center;justify-content:center;color:${BLUE};box-shadow:var(--shadow)">${IC('book_open', 'width:64px;height:64px')}</div>`);
    ADD(`<div class="w h" id="crt" style="left:1520px;top:1030px;width:380px;height:300px;box-sizing:border-box;background:#8a6a3a;border:8px solid #5f4725;border-radius:14px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:#fff;white-space:nowrap"><div style="position:absolute;left:0;right:0;top:92px;height:16px;background:#5f4725"></div><div style="position:absolute;left:0;right:0;bottom:92px;height:16px;background:#5f4725"></div><span style="position:relative;background:#f4ead2;color:#141821;border-radius:12px;padding:2px 16px">child agent</span></div>`);
  });

  /* ── scene 3: three doors ── */
  GRP('g3', () => {
    const DOOR = (k, x, name, sub, inner) => `<div class="w h" id="dr${k}" style="left:${x}px;top:440px;width:600px;height:600px"><div style="position:absolute;left:0;top:0;width:600px;height:140px;box-sizing:border-box;background:#fff;border:6px solid ${NAVY};border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:${NAVY};font-weight:800;white-space:nowrap"><div style="font-size:52px;line-height:58px">${name}</div><div style="font-size:46px;line-height:52px;color:#5b6578">${sub}</div></div><div style="position:absolute;left:0;top:160px;width:600px;height:440px;box-sizing:border-box;background:#f8f9fb;border:14px solid ${NAVY};border-bottom:none;border-radius:34px 34px 0 0">${inner}</div><div class="h" id="dg${k}" style="position:absolute;left:-14px;top:146px;width:628px;height:468px;box-sizing:border-box;border:10px solid #ffd166;border-radius:44px 44px 0 0;box-shadow:0 0 40px 12px rgba(255,209,102,.6)"></div></div>`;
    ADD(DOOR(1, 880, 'Agent tool', 'Tools', `<div style="position:absolute;left:0;right:0;top:70px;text-align:center;color:${NAVY}">${IC('toolbox', 'width:120px;height:120px')}</div>`));
    ADD(DOOR(2, 1540, 'Topic node', 'Add a tool, New prompt', `<div style="position:absolute;left:130px;top:30px;width:300px;height:66px;box-sizing:border-box;border-radius:999px;background:#eef1f7;border:4px solid #5b6578;color:#5b6578;font-size:46px;font-weight:800;display:flex;align-items:center;justify-content:center">Trigger</div><div style="position:absolute;left:276px;top:96px;width:8px;height:40px;background:#c9ced8"></div><div style="position:absolute;left:96px;top:136px;width:368px;height:200px;box-sizing:border-box;border:6px dashed ${TLC};border-radius:22px;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;color:${TLC};font-size:46px;font-weight:800">New prompt</div>`));
    ADD(DOOR(3, 2200, 'Agent flow', 'Run a prompt', `<div style="position:absolute;left:50px;right:50px;top:180px;height:10px;background:#c9ced8;border-radius:5px"></div>${[0, 1, 2, 3].map((q) => `<div style="position:absolute;left:${34 + q * 142}px;top:152px;width:66px;height:66px;box-sizing:border-box;border-radius:50%;background:#fff;border:8px solid ${q === 2 ? TLC : '#9aa5b6'}"></div>`).join('')}<div style="position:absolute;left:0;right:0;top:268px;text-align:center;color:${NAVY}">${IC('flow', 'width:84px;height:84px')}</div>`));
    ADD(MC('mc1', 1145, 1133)); ADD(MC('mc2', 1145, 1133)); ADD(MC('mc3', 1145, 1133));
    ADD(PILL('d1t', 1094, 815, 'Tools', TLC));
  });

  EXAMX('exB', 7, { pf: 'pb', pause: 7, reveal: 8, trap: 1, right: 0, opt: [S(7, 4), S(7, 5), S(7, 6)], end: S(8, 0) - 0.1 });

  /* ── 8 The Contoso case ── */
  OFF(['#g6', '#pl0', '#pl1', '#gIn'], S(7, 1), 0.01);
  tl.set('#cd', { x: 0, y: 0, scale: 1, opacity: 0 }, S(7, 1));
  ON('#g8', S(8, 0) - 0.12, 0.01);
  ON(['#val', '#nx', '#nxBd'], S(8, 0) - 0.12, 0.2);
  tl.set('#cd_n1', { opacity: 0 }, S(7, 1));
  ON('#cd', S(8, 0) - 0.05, 0.3);
  tl.fromTo('#cd_n2', { opacity: 0 }, { opacity: 1, duration: 0.4 }, W(8, 0, 'Classify ticket', -0.3));
  PULSE('#cd', W(8, 0, 'Classify ticket', -0.2), 1.05);
  LB('c8a', S(8, 0) + 0.2, S(8, 1) - 0.1);
  POP('#tr8', W(8, 1, 'input', -0.2));
  tl.fromTo('#s8a', { opacity: 0, y: -300 }, { opacity: 1, y: 0, duration: 0.6, ease: 'bounce.out' }, W(8, 1, 'ticket text', -0.5));
  ON('#cd_gl', W(8, 2, 'one category', -0.4), 0.3); OFF('#cd_gl', S(8, 3) - 0.1, 0.3);
  ['ap0', 'ap1', 'ap2'].forEach((p, k) => tl.fromTo('#' + p, { opacity: 0, x: -(1000 + k * 225), y: -150, scale: 0.3 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.7, ease: 'back.out(1.3)' }, W(8, 2, 'hardware', 0.0) + k * 0.35));
  POP('#aur', W(8, 2, 'urgency', 0.0));
  LB('c8b', W(8, 2, 'one category', 0.0), S(8, 3) - 0.1);
  tl.to(['#ap0', '#ap1', '#ap2', '#aur'], { opacity: 0, duration: 0.3 }, S(8, 3) - 0.05);
  OFF('#s8a', W(8, 3, 'too little', -0.3), 0.2);
  tl.fromTo('#s8b', { opacity: 0, y: -300 }, { opacity: 1, y: 0, duration: 0.5, ease: 'bounce.out' }, W(8, 3, 'too little', -0.1));
  ON('#cd_gl', W(8, 3, 'answers', -0.3), 0.3); OFF('#cd_gl', S(8, 4) - 0.1, 0.3);
  tl.fromTo('#nf8', { opacity: 0, y: -80 }, { opacity: 1, y: 0, duration: 0.5, ease: 'back.out(1.6)' }, W(8, 3, 'not found', -0.4));
  LB('c8c', W(8, 3, 'answers', -0.3), S(8, 4) - 0.1);
  OFF(['#nf8', '#s8b', '#ap0', '#ap1', '#ap2', '#aur'], S(8, 4) - 0.05, 0.25);
  for (let k = 0; k < 5; k++) {
    const t0 = W(8, 4, 'five similar', -0.2) + k * 0.3;
    tl.set('#fs' + k, { opacity: 1, x: 0, y: 0 }, t0);
    tl.to('#fs' + k, { x: 270 + k * 108, y: -50, opacity: 0, duration: 0.5, ease: 'power1.in' }, t0);
    POP('#fp' + k, t0 + 0.4);
  }
  LB('c8d', W(8, 4, 'temperature zero', -0.2), E(8, 4) + 0.3);

  /* ── 9 Add it as a tool (UI) ── */
  CAM(350, 1560, 1.15, E(8, 4) - 0.2, 1.2);
  ON('#deskG', E(8, 4) - 0.2, 0.4);
  OFF('#g8', E(8, 4) - 0.2, 0.4); OFF('#cd', E(8, 4) - 0.2, 0.3); OFF(['#val', '#nx', '#nxBd'], E(8, 4) - 0.2, 0.3);
  UIIN('#uiS', S(9, 0) + 0.4);
  ON('#cur', S(9, 0) + 1.3, 0.2);
  CUR(PU.nav[0], PU.nav[1], S(9, 1) - 0.2, 0.7); CLICK(PU.nav[0], PU.nav[1], W(9, 1, 'Tools tab', 0.0));
  CUR(PU.add[0], PU.add[1], S(9, 2) - 0.1, 0.6); CLICK(PU.add[0], PU.add[1], W(9, 2, 'Add a tool', 0.25));
  ON('#uMenu', W(9, 2, 'Add a tool', 0.4), 0.15);
  CUR(PU.mi[0], PU.mi[1], W(9, 2, 'then', 0.0), 0.4); CLICK(PU.mi[0], PU.mi[1], W(9, 2, 'New tool', 0.1));
  OFF('#uMenu', W(9, 2, 'New tool', 0.25), 0.15); OFF('#uPg', W(9, 2, 'New tool', 0.25), 0.15); ON('#uPick', W(9, 2, 'New tool', 0.4), 0.2);
  CUR(PU.pr[0], PU.pr[1], W(9, 2, 'choose', 0.0), 0.4); CLICK(PU.pr[0], PU.pr[1], W(9, 2, 'Prompt', 0.0));
  tl.to('#uPr', { borderColor: '#2f5bd3', backgroundColor: '#e6ecfb', duration: 0.2 }, W(9, 2, 'Prompt', 0.0));
  LB('c9a', W(9, 2, 'New tool', 0.2), S(9, 3) - 0.1);
  CUR(1500, 760, S(9, 3) - 0.15, 0.5); OFF('#uPick', S(9, 3) - 0.05, 0.2); OFF('#uPg', S(9, 3) - 0.05, 0.2); ON('#uEd', S(9, 3) - 0.05, 0.25); ON('#uF0', S(9, 3) - 0.05, 0.25);
  ON('#uF1', W(9, 3, 'input', -0.3), 0.3); ON('#uF2', W(9, 3, 'model', -0.3), 0.3); ON('#uF3', W(9, 3, 'temperature', -0.3), 0.3);
  ON('#uF4', S(9, 4) - 0.05, 0.25); ON('#uTest', S(9, 4) - 0.05, 0.25);
  tl.to('#uTyp', { width: 420, duration: 0.9, ease: 'steps(17)' }, W(9, 4, 'sample data', 0.0));
  CUR(PU.test[0], PU.test[1], W(9, 4, 'select', -0.3), 0.5); CLICK(PU.test[0], PU.test[1], W(9, 4, 'Test', 0.1));
  ON('#uRes', W(9, 4, 'Test', 0.3), 0.3);
  LB('c9b', W(9, 4, 'sample data', 0.0), S(9, 5) - 0.1);
  ON('#uSave', S(9, 5) - 0.1, 0.2);
  CUR(PU.save[0], PU.save[1], S(9, 5) - 0.3, 0.5); CLICK(PU.save[0], PU.save[1], W(9, 5, 'Save', 0.0));
  ON('#uAddc', W(9, 5, 'Save', 0.3), 0.2);
  CUR(PU.addc[0], PU.addc[1], W(9, 5, 'Save', 0.35), 0.45); CLICK(PU.addc[0], PU.addc[1], W(9, 5, 'Add and configure', 0.0));
  OFF('#uEd', W(9, 5, 'Add and configure', 0.3), 0.2); tl.set('#uNone', { opacity: 0 }, S(9, 3)); ON('#uPg', W(9, 5, 'Add and configure', 0.3), 0.2); ON('#uRow', W(9, 5, 'Add and configure', 0.35), 0.25);
  LB('c9c', W(9, 5, 'Add and configure', 0.3), E(9, 5) - 0.1);
  OFF('#cur', E(9, 5) - 0.4, 0.15);
  tl.to('#uiS', { opacity: 0, scale: 0.28, duration: 0.7, ease: 'power3.in' }, E(9, 5) - 0.3);
  OFF('#uiBack', E(9, 5) + 0.3, 0.4);

  /* ── 10 EXAM C: where a prompt cannot go ── */
  EXWORLD(10, [1300, 1150, 0.8], S(11, 0) - 0.12);
  OFF('#deskG', S(10, 1), 0.01);
  EXAMX('exC', 10, { pf: 'pc', pause: 7, reveal: 8, trap: 0, right: 1, opt: [S(10, 4), S(10, 5), S(10, 6)], end: S(11, 0) - 0.1 });

  /* ── 11 Three rules to remember ── */
  tl.set(['#g11', '#gIn'], { opacity: 1 }, S(10, 1));
  tl.set('#cd', { opacity: 0 }, S(10, 1));
  tl.set('#nx', { opacity: 1, x: 450, y: 310 }, S(10, 1)); tl.set('#nxBd', { opacity: 1, x: 450, y: 310 }, S(10, 1));
  tl.set('#tls', { opacity: 0 }, 0);
  TAG('#plD', S(11, 0) + 0.2);
  ON(['#val11', '#mgr11'], S(11, 0) - 0.05, 0.3);
  BOB('#val11', S(11, 0) + 0.3, S(11, 6), 14); BOB('#mgr11', S(11, 0) + 0.6, S(11, 6), 10);
  tl.to('#nx,#nxBd', { x: 520, duration: 2.0, yoyo: true, repeat: Math.ceil((B.duration + 2.6 - S(11, 0)) / 2.0), ease: 'sine.inOut' }, S(11, 0) + 0.1);
  POP('#tls', W(11, 1, 'saved', -0.4));
  tl.fromTo('#s11', { opacity: 0, y: 0 }, { opacity: 1, y: -355, duration: 0.7, ease: 'power2.out' }, W(11, 1, 'now similar', -0.2));
  tl.to('#s11', { y: -365, scale: 0.5, opacity: 0, duration: 0.5 }, W(11, 1, 'now similar', 0.6));
  tl.fromTo('#pl11', { opacity: 0, y: -90 }, { opacity: 1, y: 0, duration: 0.5, ease: 'back.out(1.6)' }, W(11, 1, 'same category', -0.8));
  LB('c11a', W(11, 1, 'saved', -0.2), S(11, 2) - 0.1);
  ON('#rec', S(11, 2) + 0.15, 0.35);
  tl.to('#rl0', { opacity: 1, duration: 0.35 }, S(11, 3) + 0.15);
  tl.to('#rl1', { opacity: 1, duration: 0.35 }, S(11, 4) + 0.15);
  tl.to('#rl2', { opacity: 1, duration: 0.35 }, S(11, 5) + 0.15);
  OFF('#rec', S(11, 6) - 0.3, 0.25); OFF(['#pl11', '#tls', '#s11', '#val11', '#mgr11', '#nx', '#nxBd'], S(11, 6) - 0.3, 0.3);
  OFF('#plD', S(11, 6) - 0.3, 0.25);
  CAM(-70, 960, 0.9, S(11, 6) - 0.2, 1.5);
  ON(['#corr', '#signN'], S(11, 6) - 0.6, 0.3);
  TAG('#nlNext', S(11, 6) + 0.4);
  BOB('#signN', S(11, 6) + 1.0, B.duration + 2.6, 14);
  tl.to('#world', { scale: 0.86, duration: Math.max(1, B.duration + 2.6 - (S(11, 6) + 1.7)), ease: 'none' }, S(11, 6) + 1.7);

  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = tl;
</script>
