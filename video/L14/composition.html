<script>
  /* L14 · Send HTTP request. The Contoso mail room and courier dock, world 3840x2160.
     cubbies x520-2200 y240-860 · Marta counter x420-960 top y1290 (Marta x470, laptop x700 y1180) · sorting table x1000-2300 top y1330 (belt y1392-1442, side track y1452-1482)
     · stamp rack x1010-1250 y850-1310 · Valeria x1260 y950 · envelope x1470-2310 y820-1320 · out tube x2290-2430 y490-1300 then x2290-3040 y490-620 · window x3040-3600 y250-800
     · in tube x3040-3240 y640-770 then x3100-3240 y640-1300 · desk R x2400-4900 top y1330 · manager x2450 · bin x2700-2960 · pigeonholes x2450-3000 y640-880
     · error panel x1340-1980 y380-840 · door x2040-2280 y560-1330 · lamp x2090 y410 · press x1680-1940 y1060-1330 · clock x920-1120 y300-500
     · reply desk: tray x3700-4240 y1180-1330, panel x3700-4500 y300-640, rack x3700-4280 y880-1030 · Valeria desk (UI) x100-620 y1640 · side door x-240 y760. */
  const NAVY = '#1f2a44', BLUE = '#2f5bd3', GRN = '#1e7f4f', RED = '#c4392f', AMB = '#e0a21e', TLC = '#0f7b8a', CRM = '#f4ead2', TRY = '#cadca8', CORAL = '#e07a5f', INK = '#141821', GRY = '#6b7280';
  const KRF = '#d9b382', KRD = '#b58f5c', GOLD = '#e3b23c', PUR = '#6b4fa0', ORG = '#e8913a', GRE = '#8a8f98', BRS = '#c9a03c', BRD = '#8a6a1f';
  const hmn = (id, x, y, top, hair, extra) => `<svg class="w ${extra || ''}" id="${id}" style="left:${x}px;top:${y}px" width="200" height="380" viewBox="0 0 200 380"><path d="M16 380 Q16 170 100 158 Q184 170 184 380 Z" fill="${top}"/><circle cx="100" cy="92" r="54" fill="#f2c9a6"/><path d="M44 90 Q44 30 100 30 Q156 30 156 90 Q130 62 100 64 Q70 62 44 90 Z" fill="${hair}"/><circle cx="80" cy="98" r="6" fill="#141821"/><circle cx="120" cy="98" r="6" fill="#141821"/><path d="M84 122 Q100 134 116 122" stroke="#141821" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`;
  const GRP = (id, fn) => { const wd = document.getElementById('world'), n0 = wd.children.length; fn(); const g = document.createElement('div'); g.id = id; g.style.cssText = 'position:absolute;left:0;top:0;width:0;height:0'; const kids = Array.from(wd.children).slice(n0); wd.insertBefore(g, kids[0]); kids.forEach((k) => g.appendChild(k)); };
  const CTR = (t, w, h, fs, col, bg, bd, st, id, h0) => `<div class="w ${h0 ? 'h' : ''}" ${id ? `id="${id}"` : ''} style="width:${w}px;height:${h}px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-size:${fs}px;font-weight:800;color:${col};background:${bg};border:${bd};${st || ''}">${t}</div>`;
  const PILL = (id, x, y, t, col, bg, st, vis) => `<div class="w ${vis ? '' : 'h'}" id="${id}" style="left:${x}px;top:${y}px;height:72px;padding:0 26px;box-sizing:border-box;display:flex;align-items:center;gap:10px;border-radius:999px;background:${bg || '#fff'};border:5px solid ${col};color:${col};font-size:54px;font-weight:800;white-space:nowrap;box-shadow:var(--shadow);${st || ''}">${t}</div>`;

  /* kraft envelope 840x500: flap lines, Authorization tag, mouth (body), address label, method stamp */
  const ENV = (id, x, y, o) => {
    o = o || {};
    return `<div class="w ${o.h === false ? '' : 'h'}" id="${id}" style="left:${x}px;top:${y}px;width:840px;height:500px">
      <div id="${id}_fo" style="position:absolute;left:0;top:-160px;width:840px;height:160px;opacity:${o.open ? 1 : 0}"><svg width="840" height="160" viewBox="0 0 840 160"><path d="M4 160 L420 6 L836 160 Z" fill="#cda673" stroke="${KRD}" stroke-width="6" stroke-linejoin="round"/></svg></div>
      <div style="position:absolute;left:0;top:0;width:840px;height:500px;box-sizing:border-box;background:${KRF};border:6px solid ${KRD};border-radius:18px;box-shadow:var(--shadow)"></div>
      <svg id="${id}_fl" style="position:absolute;left:0;top:0;opacity:${o.open ? 0 : 1}" width="840" height="500" viewBox="0 0 840 500"><path d="M6 6 L420 250 L834 6" fill="none" stroke="${KRD}" stroke-width="6" stroke-linejoin="round"/></svg>
      <div id="${id}_au" style="position:absolute;left:48px;top:16px;width:440px;height:84px;box-sizing:border-box;border-radius:14px;background:${GOLD};border:5px solid #b88a14;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;color:#3b2a00;white-space:nowrap;opacity:${o.auth ? 1 : 0}">Authorization</div>
      <div id="${id}_mo" style="position:absolute;left:48px;top:124px;width:520px;height:100px;box-sizing:border-box;border-radius:14px;background:#c79c66;border:4px solid ${KRD};opacity:${o.open ? 1 : 0}">
        <div id="${id}_sl" style="position:absolute;left:12px;top:8px;width:490px;height:78px;box-sizing:border-box;border:5px dashed ${CRM};border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:${CRM};opacity:0">body</div>
        <div id="${id}_nc" style="position:absolute;left:100px;top:8px;width:320px;height:78px;box-sizing:border-box;border-radius:12px;background:${CRM};border:4px solid #b0926a;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:${INK};white-space:nowrap;opacity:${o.nc ? 1 : 0}">No Content</div>
        <div id="${id}_js" style="position:absolute;left:12px;top:8px;width:490px;height:78px;box-sizing:border-box;border-radius:12px;background:${CRM};border:4px solid #b0926a;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:${INK};white-space:nowrap;opacity:${o.js ? 1 : 0}">{ … }</div></div>
      <div id="${id}_lb" style="position:absolute;left:48px;top:248px;width:560px;height:196px;box-sizing:border-box;background:#fff;border:4px solid #d8dde6;border-radius:14px">
        <div id="${id}_ba" style="position:absolute;left:28px;top:44px;opacity:${o.url ? 0 : 1}"><div style="height:22px;width:420px;background:#dfe3ec;border-radius:11px;margin-bottom:22px"></div><div style="height:22px;width:300px;background:#dfe3ec;border-radius:11px"></div></div>
        <div id="${id}_t0" style="position:absolute;left:0;right:0;top:52px;text-align:center;font-size:56px;font-weight:800;color:${NAVY};white-space:nowrap;opacity:0">Send HTTP request</div>
        <div id="${id}_u" style="position:absolute;left:28px;top:12px;opacity:${o.url ? 1 : 0}"><div style="font-size:52px;font-weight:800;color:${NAVY};line-height:80px">URL</div><div style="font-size:52px;font-weight:700;color:#5b6578;line-height:80px;white-space:nowrap">…/tickets</div></div></div>
      <div id="${id}_st" style="position:absolute;left:640px;top:248px;width:160px;height:160px;box-sizing:border-box;border-radius:50%;background:${NAVY};border:8px solid #3a4a78;color:#fff;font-size:${(o.m || 'GET').length > 3 ? 44 : 54}px;font-weight:800;display:flex;align-items:center;justify-content:center;opacity:${o.m ? 1 : 0}">${o.m || 'GET'}</div></div>`;
  };
  /* small round navy method stamp */
  const STP = (id, x, y, t, d, fs) => `<div class="w h" id="${id}" style="left:${x}px;top:${y}px;width:${d}px;height:${d}px;box-sizing:border-box;border-radius:50%;background:${NAVY};border:6px solid #3a4a78;color:#fff;font-size:${fs}px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)">${t}</div>`;
  /* teal reply envelope 360x230 */
  const REP = (id, x, y, bg, bd) => `<div class="w h" id="${id}" style="left:${x}px;top:${y}px;width:360px;height:230px"><div style="position:absolute;inset:0;box-sizing:border-box;background:${bg};border:6px solid ${bd};border-radius:16px;box-shadow:var(--shadow)"></div><svg style="position:absolute;left:0;top:0" width="360" height="230" viewBox="0 0 360 230"><path d="M6 6 L180 120 L354 6" fill="none" stroke="${bd}" stroke-width="6" stroke-linejoin="round"/></svg></div>`;
  const BUB = (id, x, y, t) => `<div class="w h" id="${id}" style="left:${x}px;top:${y}px;height:110px;padding:0 34px;box-sizing:border-box;display:flex;align-items:center;white-space:nowrap;background:#fff;border:6px solid ${AMB};border-radius:30px;font-size:52px;font-weight:800;color:${INK};box-shadow:var(--shadow)">${t}<div style="position:absolute;left:70px;bottom:-34px;width:0;height:0;border:20px solid transparent;border-top:30px solid ${AMB};border-bottom:0"></div></div>`;
  const RNG = (id, x, y, w, t) => `<div class="w h" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:110px;box-sizing:border-box;border-radius:18px;background:#fff;border:6px solid #9aa5b6;box-shadow:var(--shadow)"><div id="${id}_l" style="position:absolute;left:24px;top:0;height:98px;display:flex;align-items:center;font-size:44px;font-weight:800;color:${NAVY};white-space:nowrap">${t[0]}</div><div id="${id}_l2" style="position:absolute;left:24px;top:0;height:98px;display:flex;align-items:center;font-size:44px;font-weight:800;color:${NAVY};white-space:nowrap;opacity:0">${t[1]}</div><div id="${id}_v" style="position:absolute;right:8px;top:12px;width:92px;height:74px;border-radius:14px;background:${CRM};border:4px solid #b0926a;display:flex;align-items:center;justify-content:center;color:${INK};opacity:0">${t[2]}</div></div>`;

  /* backdrop patches so close-up framings never reveal a world edge */
  ADD(`<div class="w" style="left:-1300px;top:-420px;width:6700px;height:1920px;background:linear-gradient(#f4f6fa,#eef1f7)"></div><div class="w" style="left:-1300px;top:1500px;width:6700px;height:1100px;background:#e3e7ef"></div><div class="w" style="left:-1300px;top:1500px;width:6700px;height:6px;background:#d3d9e4"></div>`);
  /* mail cubbies on the back wall */
  GRP('gCub', () => {
    let h = '';
    for (let r = 0; r < 4; r++) for (let c = 0; c < 8; c++) {
      const x = 520 + c * 210, y = 240 + r * 150;
      h += `<div class="w" style="left:${x}px;top:${y}px;width:190px;height:130px;box-sizing:border-box;background:#e2d6b5;border:6px solid #c9b48a;border-radius:10px"><div style="position:absolute;left:14px;top:${40 + ((r + c) % 3) * 6}px;width:${(r + c) % 2 ? 120 : 96}px;height:${(r + c) % 2 ? 70 : 56}px;background:${KRF};border:4px solid ${KRD};border-radius:6px;transform:rotate(${((r * 3 + c) % 5) - 2}deg)"></div></div>`;
    }
    ADD(h);
  });
  /* far window "tickets API" + brass tubes */
  ADD(`<div class="w" id="win" style="left:3040px;top:250px;width:560px;height:550px;box-sizing:border-box;background:#cfe3f1;border:16px solid ${NAVY};border-radius:20px;box-shadow:var(--shadow);overflow:hidden">
    <div id="bgl" style="position:absolute;left:150px;top:30px;width:340px;height:500px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,224,150,.95),rgba(255,224,150,0) 70%);opacity:.5"></div>
    <div style="position:absolute;left:330px;top:210px;width:90px;height:320px;background:#5b6b8a"></div><div style="position:absolute;left:300px;top:300px;width:160px;height:230px;background:#46557a"></div><div style="position:absolute;left:430px;top:160px;width:90px;height:370px;background:#3a4a78"></div>
    ${[0, 1, 2, 3].map((k) => `<div style="position:absolute;left:446px;top:${190 + k * 70}px;width:24px;height:30px;background:#ffe9a8"></div><div style="position:absolute;left:480px;top:${190 + k * 70}px;width:24px;height:30px;background:#ffe9a8"></div>`).join('')}</div>`);
  ADD(PILL('winT', 3085, 285, 'tickets API', NAVY, '#fff', 'font-size:60px', true));
  const TUBE = (l, t, w, h) => `<div class="w" style="left:${l}px;top:${t}px;width:${w}px;height:${h}px;box-sizing:border-box;background:linear-gradient(90deg,${BRS},#e8c668 40%,${BRS});border:6px solid ${BRD};border-radius:14px"></div>`;
  ADD(TUBE(2290, 490, 140, 810) + TUBE(2290, 490, 750, 130) + TUBE(3040, 640, 200, 130) + TUBE(3100, 640, 140, 660));
  ADD(PILL('tbO', 2455, 519, 'out', NAVY, '#fff', 'width:130px;justify-content:center;padding:0;font-size:60px', true));
  ADD(PILL('tbI', 3105, 900, 'in', NAVY, '#fff', 'width:130px;justify-content:center;padding:0;font-size:60px', true));
  /* floor crates */
  ADD(`<div class="w" style="left:560px;top:1560px;width:240px;height:150px;box-sizing:border-box;background:${KRF};border:6px solid ${KRD};border-radius:10px"><div style="position:absolute;left:100px;top:0;width:40px;height:100%;background:#cda673"></div></div><div class="w" style="left:830px;top:1620px;width:190px;height:120px;box-sizing:border-box;background:#cda673;border:6px solid ${KRD};border-radius:10px"></div><div class="w" style="left:3400px;top:1570px;width:260px;height:150px;box-sizing:border-box;background:${KRF};border:6px solid ${KRD};border-radius:10px"><div style="position:absolute;left:110px;top:0;width:40px;height:100%;background:#cda673"></div></div>`);

  /* error wall (scenes 5-6): switch panel, system door, On Error lamp, clock */
  GRP('g56w', () => {
    ADD(`<div class="w" id="sdr" style="left:2040px;top:560px;width:240px;height:770px;box-sizing:border-box;background:linear-gradient(90deg,#3a4a78,${NAVY});border:14px solid ${NAVY};border-bottom:none;border-radius:26px 26px 0 0"><div style="position:absolute;left:30px;top:40px;right:30px;height:300px;box-sizing:border-box;border:6px solid #4a5a8a;border-radius:16px"></div><div style="position:absolute;right:26px;top:400px;width:34px;height:34px;border-radius:50%;background:#ffd166"></div></div>`);
    ADD(`<div class="w" id="lmp" style="left:2090px;top:410px;width:140px;height:140px"><div id="lmpG" style="position:absolute;left:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(232,145,58,.75),rgba(232,145,58,0) 70%);opacity:0"></div><div style="position:absolute;inset:0;border-radius:50%;background:#cfc3ac;border:8px solid #a39573"></div><div id="lmpO" style="position:absolute;inset:0;border-radius:50%;background:${ORG};border:8px solid #b8620f;opacity:0"></div></div>`);
    ADD(PILL('lmpT', 2010, 332, 'On Error', ORG, '#fff', 'width:300px;justify-content:center;padding:0'));
    ADD(`<div class="w h" id="spN" style="left:1340px;top:380px;width:640px;height:460px;box-sizing:border-box;background:${NAVY};border-radius:26px;box-shadow:var(--shadow)">
      <div style="position:absolute;left:36px;top:22px;font-size:52px;font-weight:800;color:#fff;white-space:nowrap">Error handling</div>
      <div id="spSel" style="position:absolute;left:24px;top:108px;width:592px;height:160px;box-sizing:border-box;border-radius:18px;background:#fff;border:6px solid #ffd166"></div>
      <div id="spR1" style="position:absolute;left:52px;top:120px;font-size:52px;font-weight:800;color:${NAVY};white-space:nowrap">Raise an error</div>
      <div id="spDf" style="position:absolute;left:52px;top:196px;height:56px;padding:0 20px;display:flex;align-items:center;border-radius:999px;background:#ffd166;color:#3b2a00;font-size:44px;font-weight:800">default</div>
      <div id="spR2" style="position:absolute;left:52px;top:310px;font-size:52px;font-weight:800;color:#fff;white-space:nowrap">Continue on error</div></div>`);
    ADD(`<div class="w h" id="clk" style="left:920px;top:345px;width:200px;height:200px"><svg width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="#fff" stroke="${NAVY}" stroke-width="12"/>${[0, 1, 2, 3].map((k) => `<line x1="100" y1="22" x2="100" y2="38" stroke="${NAVY}" stroke-width="8" stroke-linecap="round" transform="rotate(${k * 90} 100 100)"/>`).join('')}<g id="clkH"><line x1="100" y1="100" x2="100" y2="40" stroke="${ORG}" stroke-width="10" stroke-linecap="round"/></g><circle cx="100" cy="100" r="10" fill="${NAVY}"/></svg></div>`);
    ADD(`<div class="w h" id="clkT" style="left:780px;top:575px;width:480px;height:170px;box-sizing:border-box;background:#fff;border:5px solid ${NAVY};border-radius:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:54px;font-weight:800;color:${NAVY};line-height:1.15;white-space:nowrap"><div>Request timeout</div><div style="color:${ORG}">30 s</div></div>`);
  });
  /* pigeonholes (status code / error body), same cells reused in the Contoso case with the Topic.* names */
  GRP('rkE', () => {
    ADD(RNG('pg1', 2450, 640, 580, ['status code', 'Topic.StatusCode', '<span style="font-size:40px;font-weight:800">404</span>']));
    ADD(RNG('pg2', 2450, 770, 580, ['error body', 'Topic.ErrorResponse', IC('document_text', 'width:48px;height:48px')]));
  });
  /* sorting table + belt + side track */
