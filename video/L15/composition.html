  /* L15 · Tools inside a topic. The Contoso warehouse and stock floor, world 3840x2160.

  const NEXO = (id) => { let s = agent(id, 0, 0, { folder: '' }).replace('width="360" height="500"', 'width="330" height="458"'); const vest = `<path d="M104 316 L146 304 L180 338 L214 304 L256 316 L256 440 Q256 468 228 468 L132 468 Q104 468 104 440 Z" fill="#f2c230" stroke="#b88a14" stroke-width="4"/><rect x="104" y="384" width="152" height="12" fill="#fff"/><rect x="104" y="414" width="152" height="12" fill="#fff"/>`; const k = s.lastIndexOf('</svg>'); return s.slice(0, k) + vest + s.slice(k); };

      ${o ? `<div id="m0R" style="position:absolute;left:-14px;top:154px;width:508px;height:250px;box-sizing:border-box;border:10px solid #ffd166;border-radius:26px;opacity:0"></div>` : ''}
      ${k === 1 ? `<div id="m1S" style="position:absolute;left:0;top:252px;width:480px;height:140px;opacity:0"><div style="position:absolute;left:40px;top:26px;width:260px;height:96px;border-radius:50%;background:rgba(110,80,40,.40)"></div><div style="position:absolute;left:250px;top:14px;width:170px;height:70px;border-radius:50%;background:rgba(110,80,40,.30)"></div></div>` : ''}</div>`; };

  ADD(PILL('nmP', 420, 412, 'name', GLD, GOLD, 'width:200px;justify-content:center;color:#3b2a00', false));
  ADD(PILL('dsP', 250, 530, 'description', '#c9b48a', CRM, 'width:370px;justify-content:center;font-size:50px;color:' + INK, false));
  ADD(`<div class="w h" id="wbx" style="left:588px;top:203px;width:2204px;height:476px;box-sizing:border-box;border:10px dashed #6b7280;border-radius:28px"></div>`);

  /* dispatch tower (orchestrator) + its beams */
  ADD(`<svg class="w" id="twr" style="left:1810px;top:650px" width="300" height="400" viewBox="0 0 300 400"><rect x="30" y="364" width="240" height="36" rx="14" fill="#6b7488"/><path d="M70 364 L96 150 H204 L230 364 Z" fill="#3a4a78"/><rect x="104" y="196" width="92" height="18" rx="9" fill="#5b6b9a"/><rect x="100" y="240" width="100" height="18" rx="9" fill="#5b6b9a"/><rect x="96" y="284" width="108" height="18" rx="9" fill="#5b6b9a"/><rect x="88" y="128" width="124" height="34" rx="12" fill="#2d3a5c"/><circle cx="150" cy="70" r="58" fill="#8a93a6" stroke="#2d3a5c" stroke-width="8"/><circle id="twOn" cx="150" cy="70" r="50" fill="#ffd166" opacity="0"/></svg>`);

  ADD(PILL('twOff', 2130, 880, 'off', NAVY, '#fff', '', false));
  const BM = [['bm0', 'M1960 720 H960 V642'], ['bm1', 'M1960 720 H1420 V642'], ['bm3', 'M1960 720 H2500 V642'], ['bmL', 'M1900 760 H990'], ['bmR', 'M2020 760 H2800'], ['bmB', 'M2020 720 H3130 V1120']];
  ADD(`<svg class="w" id="bmS" style="left:0;top:0;overflow:visible" width="3840" height="1500" viewBox="0 0 3840 1500">${BM.map(([id, d]) => `<g id="${id}" opacity="0"><path d="${d}" fill="none" stroke="rgba(255,217,102,.45)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#ffd166" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></g>`).join('')}<rect id="bmX" x="3070" y="1112" width="120" height="16" rx="8" fill="#6b7280" opacity="0"/></svg>`);
  const BL = {};

  /* lanes: painted floor with a steel-blue rail; L has the stops, the docking bay and the "+" pad */

  ADD(LN(0, 560) + LN(1, 1660) + LN(2, 2760));

  ADD(SIGN('sgL', 640, 340) + SIGN('sgR', 2800, 280));
  [900, 1120, 1340].forEach((x, k) => ADD(`<div class="w h" id="sp${k}" style="left:${x - 26}px;top:1274px;width:52px;height:52px;box-sizing:border-box;border-radius:50%;background:#fff;border:10px solid ${STL}"></div>`));

  ADD(BX(1060, 1352, 480, 200, 'rgba(255,217,102,.55)', '8px solid #ffd166', 'border-radius:20px;opacity:0;box-shadow:0 0 40px 12px rgba(255,217,102,.7)', '', 'bayGl'));
  ADD(`<div class="w h" id="mpl" style="left:1080px;top:1368px;width:440px;height:168px"><div style="position:absolute;left:0;top:0;width:440px;height:88px;box-sizing:border-box;background:#aeb6c6;border:8px solid #8a93a6;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#3a4a78">${IC('table', 'width:56px;height:56px')}</div><div style="position:absolute;left:0;top:96px;width:440px;height:72px;box-sizing:border-box;background:${GOLD};border:6px solid ${GLD};border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:#3b2a00;white-space:nowrap">Check inventory</div></div>`);
  ADD(`<div class="w h" id="pad" style="left:1118px;top:1258px;width:84px;height:84px;box-sizing:border-box;border-radius:50%;background:#fff;border:8px solid ${STL};color:${STL};font-size:60px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1">+</div>`);
  ADD(`<div class="w h" id="lockI" style="left:1450px;top:1250px;width:100px;height:100px;box-sizing:border-box;border-radius:50%;background:${NAVY};color:#fff;display:flex;align-items:center;justify-content:center">${IC('lock_closed', 'width:56px;height:56px')}</div>`);
  ADD(`<div class="w h" id="exb" style="left:1010px;top:742px;width:130px;height:130px;box-sizing:border-box;border-radius:50%;background:${GOLD};border:8px solid ${GLD};color:#3b2a00;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)">exam</div>`);

  ADD(WIG('wig2', 'M1330 1100 C 1430 990, 1500 1110, 1590 1000 S 1740 1050, 1780 970'));
