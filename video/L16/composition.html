<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>L16 · Agent flows inside a topic · world style</title>
<script src="gsap.min.js"></script>
<!-- TAIL 2.5 -->
<link rel="stylesheet" href="style.css" />
<style>
  .h { opacity: 0; }
  #ovL .pl, #ovL .lbp { position: absolute; left: 120px; font-size: 40px; font-weight: 800; padding: 8px 28px; border-radius: 999px; background: #fff; border: 4px solid #2f5bd3; color: #2f5bd3; box-shadow: var(--shadow); white-space: nowrap; opacity: 0; }
  #ovL .pl { top: 120px; }
  #ovL .lbp { top: 210px; font-size: 38px; border-color: #1f2a44; color: #1f2a44; }
  #ovL .lbp.st { border-color: #3d6e9e; color: #3d6e9e; } #ovL .lbp.am { border-color: #d98a00; color: #a86b00; } #ovL .lbp.rd { border-color: #c4392f; color: #c4392f; }
  #world .tag { font-size: 36px; }
  #world .tag.stl { color: #3d6e9e; border: 3px solid #3d6e9e; } #world .tag.cyl { color: #1b7f95; border: 3px solid #2a9db5; } #world .tag.nvl { color: #1f2a44; border: 3px solid #1f2a44; }
  .exam .xq { font-size: 38px; }
  .exam .xwhy { top: 510px; font-size: 34px; } .exam .xwhy div { text-wrap: balance; }
  .exam .xp { top: 690px; height: 290px; }
  .xp .rm { height: 290px; width: 820px; }
  .xp .rm h4 { font-size: 40px; }
  .xp .pz { position: absolute; box-sizing: border-box; white-space: nowrap; font-weight: 800; font-size: 34px; border-radius: 16px; padding: 6px 18px; background: #2d3a5c; color: #fff; border: 4px solid #3a4a78; display: flex; align-items: center; gap: 10px; }
  #exams .exam .xo em.trap { font-size: 32px; }
  #uiS .nav div { font-size: 32px; } #uiS .bar, #uiS .bar .t { font-size: 32px; } #uiS .bar .hc { font-size: 32px; } #uiS .btn { font-size: 32px; } #uiS .crumb { font-size: 32px; } #uiS h3 { font-size: 44px; }
  .uw .nc { position: absolute; box-sizing: border-box; border: 3px solid var(--line2); border-radius: 18px; padding: 10px 24px; background: #fff; }
  .uw .nc small { display: block; font-size: 32px; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
  .uw .mn { position: absolute; background: #fff; border: 3px solid var(--line2); border-radius: 16px; box-shadow: 0 16px 40px rgba(16,24,40,.25); opacity: 0; font-size: 34px; font-weight: 700; }
  .uw .mn div { padding: 12px 24px; }
  .uw .pp { position: absolute; font-size: 32px; font-weight: 800; padding: 6px 22px; border-radius: 999px; background: #cfe0ff; color: #1f3a8a; border: 3px solid #2f5bd3; white-space: nowrap; opacity: 0; }
  .uw .vc { display: inline-block; font-size: 32px; font-weight: 800; padding: 2px 16px; border-radius: 12px; background: #3d6e9e; color: #fff; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
<section class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="2">
<div id="stage"></div>
</section>
<audio id="narr" src="narration.mp3" data-start="0" data-duration="{{DURATION}}" data-track-index="1" data-volume="1"></audio>
</div>

<!-- @world -->
<script>
  /* L16 · Agent flows inside a topic. "The Contoso assembly plant", world 3840x2160, camera scale 1 everywhere.
     Top band (y 0-1080): line x 340-1700 (title / urgency / socket / ticket number), depot x 2250-3500 (cart, Tools page, crane), door x 1740.
     Cams: CL line (960,540) · CJ junction (1900,540) · CD depot (2800,540).
     Bottom row (y 1080+): S2 (x 0-1920) hatch + back workshop (scene 6), S3 (x 1920-3840) callback pole (8) and Valeria's desk (9). */
  const STEEL = '#3d6e9e', YEL = '#f2c230', AMBR = '#e8913a', CYAN = '#2a9db5', CRM = '#f4ead2', GRN = '#1e7f4f', RED = '#c4392f', NAVY = '#1f2a44', INK = '#141821', MUTE = '#5d6472', CORAL = '#e07a5f', PURP = '#8a5cd6', ACC = '#2f5bd3', LON = '#6fb1ff';
  const CL = [960, 540], CJ = [1900, 540], CD = [2800, 540], CS2 = [960, 1620], CS3 = [2880, 1620];
  const P2 = (x, y) => `left:${x}px;top:${1080 + y}px`, P3 = (x, y) => `left:${1920 + x}px;top:${1080 + y}px`;
  const human = (id, x, y, top, hair, extra) => `<svg class="w" id="${id}" style="left:${x}px;top:${y}px" width="150" height="285" viewBox="0 0 200 380"><g><path d="M16 380 Q16 170 100 158 Q184 170 184 380 Z" fill="${top}"/><circle cx="100" cy="92" r="54" fill="#f2c9a6"/><path d="M44 90 Q44 30 100 30 Q156 30 156 90 Q130 62 100 64 Q70 62 44 90 Z" fill="${hair}"/><circle cx="80" cy="98" r="6" fill="#141821"/><circle cx="120" cy="98" r="6" fill="#141821"/><path d="M84 122 Q100 134 116 122" stroke="#141821" stroke-width="5" fill="none" stroke-linecap="round"/></g>${extra || ''}</svg>`;
  const nexo = (id, x, y) => agent(id, x, y, { folder: '' }).replace('width="360" height="500"', 'width="187" height="260"').replace('</svg>', '<path d="M70 118 Q70 52 180 52 Q290 52 290 118 Z" fill="#e8913a"/><rect x="54" y="110" width="252" height="18" rx="9" fill="#c9702a"/></svg>');
  const CHS = { st: [STEEL, STEEL], am: ['#e8913a', '#a85a10'], cy: [CYAN, '#1b7f95'], cr: ['#d9c9a6', INK], nv: ['#8a93a6', MUTE] };
  const ch = (id, x, y, icon, text, k, w) => {
    const c = CHS[k || 'nv'], raw = text.length * 22.3 + (icon ? 66 : 0) + 50, two = !w && raw > 650, ww = w || Math.min(650, Math.ceil(raw));
    return `<div class="chip sm" id="${id}" style="left:${x}px;top:${y}px;width:${ww}px;border-color:${c[0]};color:${c[1]};${k === 'cr' ? 'background:' + CRM + ';' : ''}${two ? 'height:auto;min-height:84px;padding:8px 20px;white-space:normal;line-height:1.15;' : ''}">${icon ? IC(icon) : ''}<span${two ? ' style="text-wrap:balance"' : ''}>${text}</span></div>`;
  };
  const wp = (id, xc, y, text, cls) => `<div class="tag ${cls || 'nvl'}" id="${id}" style="left:${xc}px;top:${y}px">${text}</div>`;
  const mod = (id, x, y, extra) => `<div class="w mod" id="${id}" style="left:${x}px;top:${y}px;width:300px;height:230px"><svg class="w" style="left:0;top:0" width="300" height="230" viewBox="0 0 300 230"><rect x="20" y="150" width="260" height="70" rx="14" fill="#5d6472"/><rect x="20" y="150" width="260" height="20" rx="10" fill="#7b8598"/><path d="M230 150 L230 92 L150 40 L108 68" fill="none" stroke="#8a93a6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><circle cx="108" cy="68" r="17" fill="#2f3a52"/>${[50, 90, 130].map((cx, k) => `<circle id="${id}_l${k}" cx="${cx}" cy="128" r="11" fill="#9aa3b5"/>`).join('')}</svg><div id="${id}_pl" class="w" style="left:30px;top:164px;width:240px;height:52px;background:${YEL};border-radius:10px;font-size:34px;font-weight:800;color:${INK};display:flex;align-items:center;justify-content:center;white-space:nowrap">CreateTicket</div>${extra || ''}</div>`;
  const stn = (id, x, w, kind, name, nf) => `<div class="w stn" id="${id}" style="left:${x}px;top:440px;width:${w}px;height:160px;background:#fff;border:6px solid ${STEEL};border-radius:18px;padding:10px 0 0 22px;box-sizing:border-box"><div style="font-size:32px;font-weight:700;color:${MUTE}">${kind}</div><div style="font-size:${nf || 44}px;font-weight:800;color:${INK};white-space:nowrap">${name}</div><i class="w" id="${id}_l" style="right:16px;top:16px;width:28px;height:28px;border-radius:50%;background:#c9ced8"></i></div>`;
  const laptopSvg = '<svg width="60" height="44" viewBox="0 0 120 88"><rect x="14" y="4" width="92" height="62" rx="6" fill="#1f2a44"/><rect x="22" y="12" width="76" height="46" rx="3" fill="#e6ecfb"/><rect x="0" y="70" width="120" height="12" rx="6" fill="#8a93a6"/></svg>';

  /* ═══════ TOP BAND ═══════ */
  ADD(`<div class="w" style="left:0;top:760px;width:3840px;height:320px;background:#e3e7ef;border-top:6px solid #d3d9e4"></div>`);
  ADD(`<div class="w" style="left:0;top:1080px;width:3840px;height:760px;background:#eef1f7"></div><div class="w" style="left:0;top:1840px;width:3840px;height:320px;background:#e3e7ef;border-top:6px solid #d3d9e4"></div>`);
  ADD(`<div class="w" style="left:0;top:100px;width:3840px;height:22px;background:#8a93a6"></div>`);
  /* back lines */
  [['bk1', 175], ['bk2', 275]].forEach(([id, y]) => ADD(`<div class="w" id="${id}" style="left:1450px;top:${y}px;width:350px;height:30px;background:repeating-linear-gradient(90deg,#4a5262 0 30px,#5d6472 30px 60px);border:5px solid #8a93a6;border-radius:8px"></div><div class="w" id="${id}b" style="left:1500px;top:${y + 36}px;width:150px;height:54px;background:#fff;border:4px solid #8a93a6;border-radius:12px;font-size:34px;font-weight:800;color:${MUTE};display:flex;align-items:center;justify-content:center">Topic</div>`));
  /* Report problem line */
  ADD(`<div class="w" id="cd1" style="left:840px;top:250px;width:6px;height:42px;background:#8a93a6"></div><div class="w" id="cd2" style="left:1360px;top:250px;width:6px;height:42px;background:#8a93a6"></div>`);
  ADD(`<div class="w" id="lbd" style="left:780px;top:290px;width:640px;height:64px;background:#fff;border:6px solid ${STEEL};border-radius:14px;font-size:40px;font-weight:800;color:${STEEL};display:flex;align-items:center;justify-content:center;white-space:nowrap">Topic: Report problem</div>`);
  [400, 1000, 1600].forEach((x) => ADD(`<div class="w" style="left:${x}px;top:690px;width:24px;height:70px;background:#8a93a6"></div>`));
  ADD(`<div class="w" id="belt" style="left:340px;top:640px;width:1360px;height:50px;background:repeating-linear-gradient(90deg,#4a5262 0 40px,#5d6472 40px 80px);background-position:0px 0px;border:6px solid ${STEEL};border-radius:10px;box-sizing:border-box"></div>`);
  ADD(stn('st0', 400, 260, 'Question', 'title') + stn('st1', 710, 260, 'Question', 'urgency') + stn('st2', 1360, 300, 'Message', 'ticket number', 36));
  ADD(`<div class="w" id="sock" style="left:1010px;top:410px;width:300px;height:230px;border:6px dashed ${STEEL};border-radius:18px;background:rgba(61,110,158,.10);box-sizing:border-box"></div>`);
  ADD(`<div class="w" id="sockp" style="left:1010px;top:640px;width:300px;height:50px;background:${STEEL};border-radius:0 0 10px 10px;color:#fff;font-size:32px;font-weight:800;display:flex;align-items:center;justify-content:center;white-space:nowrap"><span id="sockt" style="opacity:0">Action node</span></div>`);
  ADD(`<div class="w h" id="p1" style="left:360px;top:572px;width:84px;height:68px;background:#a8a08c;border:4px solid #8a8269;border-radius:8px"></div><div class="w h" id="p2" style="left:360px;top:572px;width:84px;height:68px;background:#b7b09c;border:4px solid #8a8269;border-radius:8px"></div><div class="w h" id="pcl" style="left:380px;top:572px;width:84px;height:68px;background:#a8a08c;border:4px solid #8a8269;border-radius:8px"></div>`);
  ADD(mod('mA', 1010, 410).replace('class="w mod"', 'class="w mod h"'));
  ADD(`<svg class="w h" id="pin" style="left:1135px;top:352px" width="50" height="58" viewBox="0 0 50 58"><circle cx="25" cy="20" r="16" fill="${YEL}" stroke="#7a6208" stroke-width="4"/><path d="M25 36 L25 56" stroke="#7a6208" stroke-width="6" stroke-linecap="round"/></svg>`);
  ADD(ch('stub1', 1307, 362, 'ticket_diagonal', 'ticket number', 'cr'));
  /* characters at the plant */
  ADD(`<div class="w" id="ctr" style="left:100px;top:870px;width:460px;height:110px;background:#c9ced8;border-top:14px solid #aeb6c6;border-radius:10px 10px 0 0"></div>`);
  ADD(human('mar', 140, 700, CORAL, '#3a2a22'));
  ADD(`<svg class="w" id="lap" style="left:340px;top:798px" width="120" height="76" viewBox="0 0 120 76"><rect x="14" y="4" width="92" height="56" rx="6" fill="#1f2a44"/><rect x="20" y="10" width="80" height="44" rx="3" fill="#e6ecfb"/><rect x="0" y="62" width="120" height="12" rx="6" fill="#8a93a6"/></svg>`);
  ADD(`<div class="w h" id="mcard" style="left:140px;top:566px;width:210px;height:100px;background:#fff;border:5px solid ${AMBR};border-radius:20px;display:flex;align-items:center;justify-content:center;gap:16px;box-shadow:var(--shadow)">${laptopSvg}${IC('warning', 'width:56px;height:56px;color:#d98a00')}</div>`);
  ADD(human('val', 640, 700, PURP, '#2b1f3a'));
  ADD(human('mgr', 1480, 600, '#8a93a6', '#2b2b2b', '<rect x="62" y="206" width="76" height="12" fill="#5d6472"/><path d="M52 190 L100 232 L148 190" fill="none" stroke="#f4f6fa" stroke-width="8"/>'));
  ADD(`<div class="w" id="nxg" style="left:800px;top:720px;width:187px;height:260px">${nexo('nx', 0, 0)}<div class="chip sm h" id="nxs" style="left:-260px;top:-110px;width:440px;background:${CRM};border-color:#d9c9a6;color:${INK}">${IC('ticket_diagonal')}<span>create a ticket</span></div></div>`);
  ADD(`<div class="w" id="door" style="left:1740px;top:430px;width:160px;height:330px;background:#8a93a6;border:8px solid #6d7688;border-radius:12px 12px 0 0;box-sizing:border-box"><div class="w" style="left:14px;top:14px;right:14px;bottom:0;background:#c9ced8"></div><div class="w" style="left:112px;top:170px;width:16px;height:16px;border-radius:50%;background:#5d6472"></div></div>`);
  ADD(`<div class="w h" id="dsg" style="left:1660px;top:290px;width:440px;height:120px;box-sizing:border-box;background:${NAVY};border-radius:20px;color:#fff;font-size:34px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;box-shadow:var(--shadow)">Create an agent flow<br>and its parameters</div>`);

  /* depot */
  ADD(`<div class="w h" id="tpb" style="left:2470px;top:330px;width:300px;height:80px;background:#fff;border:6px solid ${NAVY};border-radius:16px;font-size:42px;font-weight:800;color:${NAVY};display:flex;align-items:center;justify-content:center">Tools page</div>`);
    ADD(`<div class="w" id="cartG" style="left:2250px;top:640px;width:480px;height:330px">
    ${mod('mB', 30, 10)}
    <div class="w" style="left:0;top:240px;width:480px;height:34px;background:#8a93a6;border-radius:8px"></div>
    <div class="w" style="left:50px;top:270px;width:56px;height:56px;border-radius:50%;background:#2f3a52;border:8px solid #5d6472;box-sizing:border-box"></div><div class="w" style="left:374px;top:270px;width:56px;height:56px;border-radius:50%;background:#2f3a52;border:8px solid #5d6472;box-sizing:border-box"></div>
    <svg class="w h" id="chn" style="left:0;top:0;overflow:visible" width="480" height="330"><path d="M50 280 L-70 330" stroke="#3a3a4a" stroke-width="14" stroke-dasharray="26 12" stroke-linecap="round" fill="none"/><path d="M430 280 L550 330" stroke="#3a3a4a" stroke-width="14" stroke-dasharray="26 12" stroke-linecap="round" fill="none"/></svg>
    <div class="w h" id="lck" style="left:205px;top:262px;width:70px;height:70px;border-radius:50%;background:#fff;border:5px solid #3a3a4a;display:flex;align-items:center;justify-content:center;box-sizing:border-box">${IC('lock_closed', 'width:40px;height:40px;color:#3a3a4a')}</div>
    <svg class="w h" id="lev" style="left:380px;top:100px;overflow:visible" width="200" height="200" viewBox="0 0 200 200"><rect x="44" y="104" width="32" height="36" rx="8" fill="#5d6472"/><g id="lev_s"><line x1="60" y1="110" x2="150" y2="110" stroke="#2f3a52" stroke-width="14" stroke-linecap="round"/><circle cx="150" cy="110" r="30" fill="#fff" stroke="${STEEL}" stroke-width="6"/><path d="M138 124 V98 M138 98 H164 V110" stroke="${STEEL}" stroke-width="5" fill="none" stroke-linecap="round"/></g></svg>
  </div>`);
  ADD(`<div class="w" id="crn" style="left:2690px;top:122px;width:300px;height:200px"><div class="w" style="left:40px;top:-20px;width:60px;height:22px;background:#5d6472;border-radius:6px"></div><div class="w" style="left:200px;top:-20px;width:60px;height:22px;background:#5d6472;border-radius:6px"></div>
    <svg class="w" style="left:0;top:0" width="300" height="170" viewBox="0 0 300 170"><rect x="0" y="0" width="300" height="170" rx="22" fill="${NAVY}"/><rect id="crn_w" x="30" y="28" width="170" height="96" rx="12" fill="#2d3a5c"/><circle cx="244" cy="76" r="20" fill="#2d3a5c"/></svg>
    <div class="w" id="crn_r" style="left:146px;top:170px;width:8px;height:358px;background:#5d6472;transform-origin:50% 0%"><i class="w" style="left:-18px;bottom:-12px;width:44px;height:28px;border:8px solid #5d6472;border-top:0;border-radius:0 0 22px 22px;box-sizing:border-box"></i></div></div>`);
  ADD(`<svg class="w h" id="sig" style="left:1870px;top:520px" width="90" height="90" viewBox="0 0 90 90"><circle cx="45" cy="45" r="42" fill="${STEEL}"/></svg><div class="w h" id="sigi" style="left:1892px;top:542px;width:46px;height:46px">${IC('plug_connected', 'width:46px;height:46px;color:#fff')}</div>`);
  ADD(`<svg class="w h" id="wsg" style="left:2830px;top:320px" width="100" height="100" viewBox="0 0 100 100"><path d="M50 8 L94 88 H6 Z" fill="${YEL}" stroke="#7a6208" stroke-width="6" stroke-linejoin="round"/><path d="M50 34 V60" stroke="#141821" stroke-width="9" stroke-linecap="round"/><circle cx="50" cy="75" r="5.5" fill="#141821"/></svg>`);
  ADD(`<div class="w h" id="abn" style="left:2780px;top:520px;width:700px;height:90px;background:${AMBR};border-radius:20px;color:#141821;font-size:34px;font-weight:800;display:flex;align-items:center;padding-left:28px;box-sizing:border-box;box-shadow:var(--shadow)">Ask the end user before running<i class="w" id="abn_l" style="right:22px;top:22px;width:46px;height:46px;border-radius:50%;background:#fff3d6;border:5px solid #a85a10;box-sizing:border-box"></i></div>`);
  ADD(`<div class="w h" id="nwt" style="left:2860px;top:330px;width:300px;height:80px;background:#fff;border:6px solid ${NAVY};border-radius:16px;font-size:42px;font-weight:800;color:${NAVY};display:flex;align-items:center;justify-content:center">new tool</div>`);
  ADD(`<div class="w" id="mNg" style="left:3100px;top:650px;width:300px;height:230px;opacity:0">${mod('mN', 0, 0, `<div class="w" style="left:-18px;top:150px;width:44px;height:44px;border-radius:50%;background:${STEEL};display:flex;align-items:center;justify-content:center">${IC('plug_connected', 'width:28px;height:28px;color:#fff')}</div><div class="w" style="left:270px;top:150px;width:30px;height:70px;background:${CYAN};border-radius:6px"></div>`)}</div>`);
  /* tag "flow requirements" + tool picker drawer (scene 5) */
  const r5 = (k, ic, html) => `<div class="w" id="r5_${k}" style="left:24px;top:${88 + k * 82}px;width:576px;height:70px;opacity:.3;display:flex;align-items:center;gap:14px;font-size:34px;font-weight:800;color:${INK};white-space:nowrap">${IC(ic, 'width:46px;height:46px;color:' + STEEL + ';flex:0 0 auto')}${html}</div>`;
  ADD(`<div class="w h" id="fl5" style="left:3016px;top:140px;width:624px;height:520px;box-sizing:border-box;background:#fff;border:6px solid ${STEEL};border-radius:24px;box-shadow:var(--shadow);transform-origin:0 0"><div class="w" style="left:24px;top:16px;font-size:42px;font-weight:800;color:${STEEL}">flow requirements</div>
    ${r5(0, 'plug_connected', 'When an agent calls the flow')}${r5(1, 'arrow_reply', '<span style="background:#d6f0f5;color:#1b7f95;border:3px solid ' + CYAN + ';border-radius:12px;padding:0 12px">Respond to the agent</span>')}${r5(2, 'rocket', 'published')}${r5(3, 'timer', '100 seconds <span style="font-size:32px;border:3px solid ' + STEEL + ';border-radius:999px;padding:0 16px;color:' + STEEL + '">real time</span>')}${r5(4, 'toolbox', 'solution flow')}</div>`);
  ADD(`<div class="w h" id="dr5" style="left:3016px;top:690px;width:624px;height:190px;box-sizing:border-box;background:#fff;border:6px solid ${NAVY};border-radius:24px;box-shadow:var(--shadow)"><div class="w" style="left:24px;top:14px;font-size:36px;font-weight:800;color:${NAVY}">tool picker</div><div class="w" style="left:24px;top:84px;width:340px;height:80px;border:4px dashed #8a93a6;border-radius:14px;box-sizing:border-box"></div><div class="w h" id="dp5" style="left:30px;top:90px;width:328px;height:68px;background:${YEL};border-radius:10px;font-size:34px;font-weight:800;color:${INK};display:flex;align-items:center;justify-content:center">CreateTicket</div></div>`);

  /* ═══════ CHIPS (top band) ═══════ */
