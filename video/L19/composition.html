<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>L19 · Error handling in flows · world style</title>
<script src="gsap.min.js"></script>
<!-- TAIL 2.5 -->
<link rel="stylesheet" href="style.css" />
<style>
  .h { opacity: 0; }
  #world { width: 7680px; height: 1080px; }
  #world .wall { width: 7680px; height: 820px; background: repeating-linear-gradient(90deg, #f4f6fa 0 120px, #e8ecf5 120px 240px); }
  #world .floor { top: 820px; width: 7680px; height: 260px; }
  .bl { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; top: 900px; white-space: nowrap; font-size: 42px; font-weight: 800; padding: 10px 32px; border-radius: 999px; background: #fff; border: 4px solid #2f5bd3; color: #2f5bd3; box-shadow: var(--shadow); opacity: 0; z-index: 8; }
  .bl.st { border-color: #3d6e9e; color: #3d6e9e; } .bl.or { border-color: #e07b39; color: #b4551a; } .bl.vi { border-color: #7b5ea7; color: #7b5ea7; } .bl.am { border-color: #b8860b; color: #7a4d00; } .bl.nv { border-color: #1f2a44; color: #1f2a44; } .bl.gr { border-color: #1e7f4f; color: #1e7f4f; }
  .pl { position: absolute; left: 120px; top: 120px; font-size: 40px; font-weight: 800; padding: 10px 28px; border-radius: 999px; background: #fff; border: 4px solid #2f5bd3; color: #2f5bd3; box-shadow: var(--shadow); white-space: nowrap; opacity: 0; z-index: 8; }
  .bub { position: absolute; box-sizing: border-box; padding: 8px 24px; border-radius: 26px; font-size: 36px; font-weight: 700; white-space: nowrap; background: #e07a5f; color: #fff; opacity: 0; }
  .ac { position: absolute; display: flex; align-items: center; gap: 12px; box-sizing: border-box; height: 100px; padding: 0 20px; background: #fff; border: 5px solid #3d6e9e; border-radius: 24px; font-size: 36px; font-weight: 800; color: #141821; white-space: nowrap; box-shadow: var(--shadow); }
  .ac .ic { width: 46px; height: 46px; color: #3d6e9e; flex: 0 0 auto; }
  .sgn { position: absolute; box-sizing: border-box; white-space: nowrap; font-size: 38px; font-weight: 800; padding: 4px 22px; border-radius: 999px; background: #fff; border: 4px solid #3d6e9e; color: #3d6e9e; text-align: center; opacity: 0; }
  .pt { position: absolute; left: 15px; width: 260px; height: 78px; box-sizing: border-box; border-radius: 16px; background: #2d3a5c; border: 4px solid #3a4a78; color: #b9c3dd; font-size: 34px; font-weight: 800; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
  .stc { position: absolute; width: 270px; height: 80px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #fff; border: 4px solid #1f2a44; border-radius: 20px; font-size: 36px; font-weight: 800; color: #1f2a44; opacity: 0; }
  .stc .ic { width: 44px; height: 44px; }
  .brow { position: absolute; left: 20px; width: 580px; height: 84px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: #f3f5f9; border-radius: 16px; font-size: 36px; font-weight: 800; color: #141821; opacity: 0; }
  .brow .ic { width: 52px; height: 52px; opacity: 0; }
  .clk { position: absolute; box-sizing: border-box; border: 10px solid #7b5ea7; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 40px; font-weight: 800; color: #7b5ea7; opacity: 0; }
  .clk .ic { width: 56px; height: 56px; }
  .exam .xq { font-size: 38px; }
  .exam .xwhy { top: 545px; font-size: 38px; }
  .exam .xp { top: 670px; height: 290px; }
  .xp .rm { height: 290px; width: 820px; }
  .xp .rm h4 { font-size: 40px; top: 8px; }
  .xp .pz { position: absolute; box-sizing: border-box; white-space: nowrap; font-weight: 800; font-size: 34px; border-radius: 16px; padding: 4px 18px; background: #2d3a5c; color: #fff; border: 4px solid #3a4a78; }
  #exams .xo em.trap { font-size: 32px; }
  #uiS { top: 80px; height: 790px; }
  #uiS .nav div { font-size: 32px; } #uiS .bar { font-size: 32px; } #uiS .bar .t { font-size: 32px; } #uiS .btn { font-size: 32px; } #uiS .crumb { font-size: 32px; } #uiS h3 { font-size: 44px; }
  #uiS .lay { overflow: hidden; }
  #uiS .sc { position: absolute; box-sizing: border-box; border: 6px solid #3d6e9e; border-radius: 26px; background: #fff; }
  #uiS .sc > b { position: absolute; left: 20px; top: 10px; font-size: 38px; font-weight: 800; }
  #uiS .nc { position: absolute; box-sizing: border-box; border: 3px solid var(--line2); border-radius: 18px; padding: 10px 22px; background: #fff; font-size: 36px; font-weight: 800; display: flex; align-items: center; gap: 12px; }
  #uiS .nc small { display: block; font-size: 32px; font-weight: 700; color: var(--muted); }
  #uiS .nc .ic { width: 44px; height: 44px; color: #3d6e9e; flex: 0 0 auto; }
  #uiS .vc { display: inline-block; font-size: 34px; font-weight: 800; padding: 2px 16px; border-radius: 12px; background: #1f2a44; color: #fff; }
  #uiS .ckr { position: absolute; left: 24px; height: 60px; display: flex; align-items: center; gap: 18px; font-size: 36px; font-weight: 800; }
  #uiS .ckb { width: 42px; height: 42px; box-sizing: border-box; border: 4px solid #1f2a44; border-radius: 9px; position: relative; flex: 0 0 auto; background: #fff; }
  #uiS .ckb .ic { position: absolute; left: -4px; top: -4px; width: 42px; height: 42px; color: #1e7f4f; opacity: 0; }
  #uiS .row b { font-size: 36px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
<section class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="2">
<div id="stage"></div>
</section>
<audio id="narr" src="narration.mp3" data-start="0" data-duration="{{DURATION}}" data-track-index="1" data-volume="1"></audio>
</div>

<!-- @world -->
<script>
  /* L19 · Error handling in flows. "The Contoso big top and safety net". World = one row of four sets, each 1920x1080, camera scale 1 (pans between sets):
     T0 corner (x 0): Marta, laptop, Nexo, banner; at the close Valeria, manager, IT sign, recap board, side flap.
     T1 rig (x 1920): flap + Valeria, control post (run after), rig = Try (blue), net = Catch (orange), closing curtain.
     T2 (x 3840): results board result(), sieve Filter array, ringmaster's stand (logbook, pigeon), tent flap + IT team sign, mini curtain.
     T3 (x 5760): practice ladder, retry tag + action settings, three rest clocks, cable car external service. */
  const NAVY = '#1f2a44', BLUE = '#2f5bd3', GRN = '#1e7f4f', RED = '#c4392f', AMB = '#d98a00', VIO = '#7b5ea7', TRY = '#3d6e9e', NETC = '#e07b39', YEL = '#f2c230', INK = '#141821', CORAL = '#e07a5f', PILL = '#cfe0ff', WOOD = '#8a6a3a';
  const X1 = 1920, X2 = 3840, X3 = 5760;
  const human = (id, x, y, top, hair, k, extra) => `<svg class="w" id="${id}" style="left:${x}px;top:${y}px" width="${200 * k}" height="${380 * k}" viewBox="0 0 200 380"><g><path d="M16 380 Q16 170 100 158 Q184 170 184 380 Z" fill="${top}"/><circle cx="100" cy="92" r="54" fill="#f2c9a6"/><path d="M44 90 Q44 30 100 30 Q156 30 156 90 Q130 62 100 64 Q70 62 44 90 Z" fill="${hair}"/><circle cx="80" cy="98" r="6" fill="#141821"/><circle cx="120" cy="98" r="6" fill="#141821"/><path d="M84 122 Q100 134 116 122" stroke="#141821" stroke-width="5" fill="none" stroke-linecap="round"/></g>${extra || ''}</svg>`;
  const banner = (id, x, y, w, h, fs) => `<div class="w" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><div style="position:absolute;left:40px;top:-40px;height:50px;border-left:6px solid ${WOOD}"></div><div style="position:absolute;right:40px;top:-40px;height:50px;border-right:6px solid ${WOOD}"></div><div style="position:absolute;inset:0;background:${YEL};clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);display:flex;align-items:flex-start;justify-content:center;padding-top:${Math.round(h * 0.17)}px;font-size:${fs}px;font-weight:800;color:#3a2a00">CreateTicket</div></div>`;
  const laptop = (id, x, y) => `<div class="w" id="${id}" style="left:${x}px;top:${y}px;width:320px;height:200px"><div style="position:absolute;left:20px;top:0;width:280px;height:178px;background:${NAVY};border-radius:16px;padding:10px"><div style="position:relative;width:100%;height:100%;background:#fff;border-radius:8px;overflow:hidden">
    <div id="${id}_d" style="position:absolute;inset:0"><div style="position:absolute;left:14px;top:16px;width:150px;height:22px;border-radius:11px;background:#c9d8f7"></div><div style="position:absolute;left:14px;top:52px;width:200px;height:22px;border-radius:11px;background:#e2e5eb"></div><div style="position:absolute;left:14px;top:100px;width:100px;height:44px;border-radius:22px;background:#e2e5eb;display:flex;align-items:center;justify-content:center;gap:10px"><i style="width:14px;height:14px;border-radius:50%;background:#8a93a6"></i><i style="width:14px;height:14px;border-radius:50%;background:#8a93a6"></i><i style="width:14px;height:14px;border-radius:50%;background:#8a93a6"></i></div></div>
    <div id="${id}_ok" style="position:absolute;inset:0;background:#fff;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:34px;font-weight:800;color:${GRN}">${IC('checkmark_circle', 'width:56px;height:56px')}ticket saved</div></div></div><div style="position:absolute;left:0;top:178px;width:320px;height:22px;background:#8a93a6;border-radius:6px"></div></div>`;
  const pigeon = (id, x, y) => `<svg class="w" id="${id}" style="left:${x}px;top:${y}px" width="110" height="80" viewBox="0 0 110 80"><path d="M8 40 L36 30 L36 52 Z" fill="#7d8aa6"/><ellipse cx="54" cy="44" rx="34" ry="24" fill="#9aa8c4"/><path d="M40 40 Q56 18 76 40 Q58 52 40 40 Z" fill="#7d8aa6"/><circle cx="84" cy="30" r="15" fill="#9aa8c4"/><circle cx="88" cy="27" r="3.5" fill="#141821"/><path d="M97 30 L110 34 L97 38 Z" fill="${AMB}"/></svg>`;
  const flap = (id, x, y, w, h) => `<svg class="w" id="${id}" style="left:${x}px;top:${y}px" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect x="${w * 0.14}" y="${h * 0.08}" width="${w * 0.72}" height="${h * 0.92}" fill="${NAVY}"/><path d="M0 ${h * 0.08} L${w * 0.4} ${h * 0.08} L${w * 0.2} ${h} L0 ${h} Z" fill="#d8dff0" stroke="#aeb9d6" stroke-width="4" stroke-linejoin="round"/><path d="M${w} ${h * 0.08} L${w * 0.6} ${h * 0.08} L${w * 0.8} ${h} L${w} ${h} Z" fill="#d8dff0" stroke="#aeb9d6" stroke-width="4" stroke-linejoin="round"/><rect x="0" y="0" width="${w}" height="${h * 0.1}" rx="8" fill="${WOOD}"/></svg>`;
  const netSvg = (id, x, y, w, h) => { let l = ''; for (let i = -h; i < w; i += 70) l += `<line x1="${i}" y1="0" x2="${i + h}" y2="${h}"/><line x1="${i + h}" y1="0" x2="${i}" y2="${h}"/>`; return `<svg class="w h" id="${id}" style="left:${x}px;top:${y}px" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><clipPath id="${id}_c"><rect x="3" y="3" width="${w - 6}" height="${h - 6}" rx="26"/></clipPath></defs><rect x="3" y="3" width="${w - 6}" height="${h - 6}" rx="26" fill="#fbe5d4"/><g clip-path="url(#${id}_c)" stroke="${NETC}" stroke-width="5">${l}</g></svg>`; };
  const outline = (id, x, y, w, h, col) => `<svg class="w" id="${id}" style="left:${x}px;top:${y}px;overflow:visible" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect pathLength="1" x="5" y="5" width="${w - 10}" height="${h - 10}" rx="30" fill="none" stroke="${col}" stroke-width="10" stroke-dasharray="1" stroke-dashoffset="1" stroke-linecap="round"/></svg>`;
  const ac = (id, x, y, w, t, icon) => `<div class="ac" id="${id}" style="left:${x}px;top:${y}px;width:${w}px">${IC(icon || 'person')}<span>${t}</span></div>`;
  const curtain = (id, x, y, w) => `<div class="w h" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:24px;overflow:hidden;background:${NAVY};border-top:14px solid ${WOOD};border-radius:0 0 18px 18px;box-shadow:var(--shadow);z-index:5">${Array.from({ length: 9 }, (_, k) => `<div style="position:absolute;left:${Math.round(w / 9 * k) + 10}px;top:0;bottom:0;width:${Math.round(w / 9) - 24}px;background:#2a3a5e;border-radius:30px"></div>`).join("")}<div style="position:absolute;left:0;right:0;top:12px;text-align:center;font-size:44px;font-weight:800;color:#fff">Terminate</div>
    <div class="w h" id="${id}_pl" style="left:50px;right:50px;top:200px;height:130px;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800;color:${INK}">status Failed</div>
    <div class="w h" id="${id}_nt" style="left:${(w - 340) / 2}px;top:400px;width:340px;height:120px;background:#ffe9a8;border:4px solid #e0b84a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;color:${INK}">message</div></div>`;

  /* ═══════ decor ═══════ */
  const FLAGS = ['#e07b39', '#3d6e9e', '#7b5ea7', '#c3cee8'];
  const garland = (x0) => `<svg class="w" style="left:${x0}px;top:62px" width="1920" height="120" viewBox="0 0 1920 120"><path d="M0 14 Q240 80 480 14 T960 14 T1440 14 T1920 14" fill="none" stroke="${WOOD}" stroke-width="6"/>${Array.from({ length: 24 }, (_, k) => { const x = 20 + k * 80, y = 14 + 36 * Math.abs(Math.sin((x / 480) * Math.PI)); return `<polygon points="${x},${y} ${x + 50},${y} ${x + 25},${y + 58}" fill="${FLAGS[k % 4]}"/>`; }).join('')}</svg>`;
  const cones = (x0) => `<svg class="w" style="left:${x0}px;top:62px" width="1920" height="762" viewBox="0 0 1920 762"><polygon points="300,0 420,0 600,762 100,762" fill="#e1e8f6"/><polygon points="1500,0 1620,0 1820,762 1320,762" fill="#e1e8f6"/></svg>`;
  [0, X1, X2, X3].forEach((x0) => ADD(cones(x0) + garland(x0)));
  ADD(`<div class="w" style="left:100px;top:846px;width:1700px;height:130px;border-radius:40px;background:#e6dcc4"></div>`);
  ADD(`<div class="w" style="left:${X1 + 560}px;top:800px;width:1300px;height:230px;border-radius:50%;background:#e6dcc4"></div>`);
  ADD(`<div class="w" style="left:${X2 + 100}px;top:846px;width:1700px;height:130px;border-radius:40px;background:#e6dcc4"></div>`);
  ADD(`<div class="w" style="left:${X3 + 100}px;top:846px;width:1700px;height:130px;border-radius:40px;background:#e6dcc4"></div>`);

  /* ═══════ T0 corner ═══════ */
  ADD(banner('bn0', 700, 110, 560, 120, 54));
  ADD(human('mar', 200, 470, CORAL, '#3a2a22', 1));
  ADD(`<div class="w" style="left:420px;top:850px;width:360px;height:16px;background:${WOOD};border-radius:6px"></div><div class="w" style="left:450px;top:866px;width:14px;height:100px;background:${WOOD}"></div><div class="w" style="left:740px;top:866px;width:14px;height:100px;background:${WOOD}"></div>`);
  ADD(laptop('lap0', 440, 650));
  ADD(`<div class="bub" id="bubM" style="left:420px;top:520px">my laptop</div>`);
  ADD(agent('nex', 810, 470, { folder: '' }).replace('width="360" height="500"', 'width="288" height="400"'));
  ADD(`<svg class="w" id="nbd" style="left:930px;top:730px" width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="${NETC}" stroke="#fff" stroke-width="4"/><g stroke="#fff" stroke-width="4"><line x1="14" y1="22" x2="50" y2="22"/><line x1="14" y1="34" x2="50" y2="34"/><line x1="14" y1="46" x2="50" y2="46"/><line x1="22" y1="12" x2="22" y2="52"/><line x1="34" y1="12" x2="34" y2="52"/><line x1="46" y1="12" x2="46" y2="52"/></g></svg>`);
  ADD(human('val0', 1130, 540, '#8a5cd6', '#2b2b2b', 0.8).replace('<svg class="w"', '<svg class="w h"'));
  ADD(human('mgr0', 1310, 540, '#8a93a6', '#2b2b2b', 0.8, `<rect x="118" y="230" width="46" height="34" rx="6" fill="#fff"/>`).replace('<svg class="w"', '<svg class="w h"'));
  ADD(`<div class="w h" id="its0" style="left:1480px;top:690px;width:200px;height:160px"><div style="position:absolute;left:94px;top:70px;width:12px;height:90px;background:${WOOD}"></div><div style="position:absolute;left:0;top:0;width:200px;height:68px;border-radius:14px;background:${NAVY};color:#fff;font-size:38px;font-weight:800;display:flex;align-items:center;justify-content:center">IT team</div></div>`);
  ADD(pigeon('pg0', 1540, 560).replace('<svg class="w"', '<svg class="w h"'));
  ADD(flap('fl0', 1690, 330, 160, 500).replace('<svg class="w"', '<svg class="w h"'));
  ADD(`<div class="w h" id="sgH" style="left:1370px;top:200px;width:430px;height:84px;box-sizing:border-box;background:${NAVY};border-radius:20px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;font-weight:800;white-space:nowrap">Human-in-the-loop</div>`);
  const rrow = (id, y, h, inner, wrap) => `<div class="w" id="${id}" style="left:24px;top:${y}px;width:876px;height:${h}px;opacity:.62;font-size:36px;font-weight:800;line-height:46px;color:${INK};${wrap ? 'text-wrap:balance' : 'white-space:nowrap'}">${inner}</div>`;
  const rc = (t, bg) => `<span style="display:inline-block;background:#fff;color:${bg};border:3px solid ${bg};border-radius:14px;padding:0 12px;margin-right:12px;line-height:38px">${t}</span>`;
  ADD(`<div class="w h" id="rb" style="left:860px;top:90px;width:940px;height:336px;box-sizing:border-box;background:#fff;border:10px solid ${NAVY};border-radius:28px;overflow:hidden;z-index:6"><div style="position:absolute;left:24px;top:4px;font-size:44px;font-weight:800;color:${NAVY}">Remember</div>
    ${rrow('rl0', 62, 46, rc('Try', TRY) + 'main actions')}
    ${rrow('rl1', 110, 46, rc('Catch', NETC) + 'has failed · has timed out')}
    ${rrow('rl2', 160, 46, rc('result()', NAVY) + 'Filter array keeps the error')}
    ${rrow('rl3', 210, 46, rc('retry', VIO) + 'exponential · transient failures')}
    ${rrow('rl4', 260, 46, rc('Terminate', NAVY) + 'status Failed · message')}</div>`);

  /* ═══════ T1 rig ═══════ */
  ADD(flap('fl1', X1 + 130, 330, 160, 500));
  ADD(netSvg('net', X1 + 720, 612, 1060, 230));
  ADD(banner('bn1', X1 + 760, 90, 520, 110, 50));
  ADD(`<svg class="w" id="rig" style="left:${X1 + 700}px;top:230px" width="1100" height="620" viewBox="0 0 1100 620"><rect x="30" y="150" width="22" height="470" fill="${WOOD}"/><rect x="1048" y="150" width="22" height="470" fill="${WOOD}"/><rect x="0" y="200" width="150" height="20" rx="6" fill="${WOOD}"/><rect x="950" y="200" width="150" height="20" rx="6" fill="${WOOD}"/><line x1="150" y1="204" x2="950" y2="204" stroke="${WOOD}" stroke-width="10" stroke-linecap="round"/></svg>`);
  ADD(ac('a1', X1 + 740, 320, 230, 'action 1'));
  ADD(ac('cDv', X1 + 990, 320, 480, 'Dataverse · insert row', 'database'));
  ADD(ac('a3', X1 + 1490, 320, 230, 'action 3'));
  ADD(outline('tOut', X1 + 700, 230, 1100, 310, TRY));
  ADD(outline('nOut', X1 + 700, 600, 1100, 250, NETC));
  ADD(`<div class="sgn" id="tgTry" style="left:${X1 + 740}px;top:205px">Try</div><div class="sgn" id="tgCatch" style="left:${X1 + 740}px;top:572px;border-color:${NETC};color:#b4551a">Catch</div>`);
  ADD(`<div class="w h" id="post" style="left:${X1 + 290}px;top:380px;width:290px;height:500px"><div style="position:absolute;inset:0;background:${NAVY};border-radius:24px"></div><div style="position:absolute;left:20px;top:14px;font-size:40px;font-weight:800;color:#fff;white-space:nowrap">run after</div>
    ${['has failed', 'has timed out', 'is skipped', 'is successful'].map((t, k) => `<div class="pt" id="p${k}" style="top:${86 + k * 96}px">${t}</div>`).join('')}</div>`);
  ADD(`<svg class="w h" id="lns" style="left:${X1}px;top:0" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" stroke-width="8" stroke-linecap="round"><path d="M580 450 C640 450 650 380 700 380" stroke="${TRY}" stroke-dasharray="16 14"/><path d="M580 700 C640 700 650 725 700 725" stroke="${NETC}" stroke-dasharray="16 14"/></svg>`);
