<link rel="stylesheet" href="style.css" />
<style>
  .h { opacity: 0; }
  #nex, #val, #brg, #brg2 { z-index: 2; } #arc { z-index: 1; } #beam, #bud, #lpA, #lpR, #tkt { z-index: 1; } #env, #stA, #stR { z-index: 3; }
  #uiBack { background: #eef1f7 !important; }
  #exams .xp { top: 650px; height: 300px; } #exams .xp .rm { height: 300px; width: 820px; } #exams .xp .rm h4 { font-size: 38px; top: 10px; line-height: 1.2; }
  #world .wall { background: linear-gradient(#eaf3fb, #f4f8fc); }
  .bl { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; top: 920px; white-space: nowrap; font-size: 42px; font-weight: 800; padding: 10px 32px; border-radius: 999px; background: #fff; border: 4px solid #2f5bd3; color: #2f5bd3; box-shadow: var(--shadow); opacity: 0; z-index: 8; }
  .bl.red { border-color: #c4392f; color: #c4392f; } .bl.green { border-color: #1e7f4f; color: #1e7f4f; } .bl.am { border-color: #b8860b; color: #7a4d00; } .bl.bu { border-color: #3d6e9e; color: #3d6e9e; } .bl.vi { border-color: #7b5ea7; color: #7b5ea7; } .bl.tl { border-color: #2f8f83; color: #1f6f65; } .bl.sl { border-color: #5a6b7d; color: #3f4d5c; } .bl.nv { border-color: #1f2a44; color: #1f2a44; }
  #plG, #plH { top: 75px !important; }
  .pl { position: absolute; left: 120px; top: 120px; font-size: 40px; font-weight: 800; padding: 10px 28px; border-radius: 999px; background: #fff; border: 4px solid #2f5bd3; color: #2f5bd3; box-shadow: var(--shadow); white-space: nowrap; opacity: 0; z-index: 8; }
  .wp { position: absolute; box-sizing: border-box; white-space: nowrap; font-size: 34px; font-weight: 800; padding: 5px 18px; border-radius: 999px; background: #fff; border: 4px solid #8a93a6; color: #141821; text-align: center; line-height: 1.2; opacity: 0; }
  .bub { position: absolute; box-sizing: border-box; padding: 8px 24px; border-radius: 26px; font-size: 36px; font-weight: 700; white-space: nowrap; background: #e07a5f; color: #fff; opacity: 0; }
  .mp svg { width: 100%; height: 100%; display: block; }
  .exam .xq { font-size: 34px; padding: 20px 40px; }
  .exam .xwhy { top: 532px; font-size: 36px; line-height: 1.3; }
  .xp .pin { position: absolute; left: 24px; top: 72px; width: 772px; height: 200px; display: flex; flex-direction: column; gap: 12px; }
  .xp .r1 { display: flex; flex-direction: row; align-items: stretch; gap: 14px; height: 108px; }
  .xp .r2 { display: flex; flex-direction: row; align-items: center; gap: 14px; height: 70px; }
  .xp .hb { box-sizing: border-box; flex: 0 0 auto; border: 5px solid #3d6e9e; border-radius: 18px; background: #e9f1fb; color: #141821; padding: 6px 14px; font-size: 34px; font-weight: 800; display: flex; flex-direction: column; justify-content: center; line-height: 1.2; white-space: nowrap; }
  .xp .hb small { font-size: 32px; font-weight: 700; color: #3d6e9e; }
  .xp .cc { box-sizing: border-box; flex: 0 0 auto; border: 4px solid; border-radius: 999px; padding: 6px 22px; font-size: 34px; font-weight: 800; white-space: nowrap; line-height: 1.2; }
  .xp .cc.g { background: #e3f4ea; border-color: #1e7f4f; color: #1e7f4f; } .xp .cc.r { background: #fde8e6; border-color: #c4392f; color: #c4392f; }
  .xp .bar { flex: 0 0 auto; width: 26px; border-radius: 8px; background: repeating-linear-gradient(45deg, #5a6b7d 0 10px, #e9ecf3 10px 20px); }
  #uiS .nav div { font-size: 32px; } #uiS .bar { font-size: 32px; } #uiS .bar .t { font-size: 32px; } #uiS .btn { font-size: 36px; padding: 12px 34px; } #uiS .crumb { font-size: 32px; } #uiS h3 { font-size: 44px; }
  #uiS .lay { overflow: hidden; }
  #uiS .nc { position: absolute; box-sizing: border-box; border: 3px solid var(--line2); border-radius: 18px; padding: 10px 22px; background: #fff; font-size: 36px; font-weight: 800; }
  #uiS .nc small { display: block; font-size: 32px; font-weight: 700; color: var(--muted); }
  #uiS .mn { position: absolute; background: #fff; border: 3px solid var(--line2); border-radius: 16px; box-shadow: 0 16px 40px rgba(16,24,40,.25); opacity: 0; font-size: 34px; font-weight: 700; z-index: 5; }
  #uiS .vc { display: inline-block; font-size: 32px; font-weight: 800; padding: 2px 16px; border-radius: 12px; color: #fff; }
  #uiS .sk { position: absolute; background: #e9edf4; border-radius: 12px; }
</style>

<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
<section class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="2">
<div id="stage"></div>
</section>
<audio id="narr" src="narration.mp3" data-start="0" data-duration="{{DURATION}}" data-track-index="1" data-volume="1"></audio>
</div>

<!-- @world -->
<script>
  /* L20 · The Contoso canal locks. World 3840x2160, camera scale 1 (text base >= 32 px).
     Water band y1000-1330 (x0-3300). Far bank (structures) y<=1000, near bank (towpath, characters feet ~1500) y>=1330.
     Mouth x150-1000 · lock 1 AI frame x860-1500 · conditions frame x1520-1880 · lock 2 manual frame x1920-2580 · amber outline x830-2610
     docks x2640-2860 (approved far bank y760-960, rejected near bank y1390-1590) · export quay x3330-3760 · RFI bay x1400-2140 y1500-1900.
     Near bank sets (each only in its scenes): tray/dial x820-1930 (3) · bells x1790-2600 (1) · second hut x1960-2340 (2) · RFI fence x2180-2600 (6). */
  const NAVY = '#1f2a44', BLUE = '#2f5bd3', GRN = '#1e7f4f', RED = '#c4392f', AMB = '#e0a03a', AMBD = '#8a5a00', BLU3 = '#3d6e9e', VIO = '#7b5ea7', TEAL = '#2f8f83', SLT = '#5a6b7d', YEL = '#f2c230', CORAL = '#e07a5f', INK = '#141821', WTR = '#7fb8e0';
  const P = (x, y) => `left:${x}px;top:${y}px`;
  const human = (id, x, y, top, hair, extra, cls) => `<svg class="w ${cls || ''}" id="${id}" style="${P(x, y)}" width="150" height="285" viewBox="0 0 200 380"><g><path d="M16 380 Q16 170 100 158 Q184 170 184 380 Z" fill="${top}"/><circle cx="100" cy="92" r="54" fill="#f2c9a6"/><path d="M44 90 Q44 30 100 30 Q156 30 156 90 Q130 62 100 64 Q70 62 44 90 Z" fill="${hair}"/><circle cx="80" cy="98" r="6" fill="#141821"/><circle cx="120" cy="98" r="6" fill="#141821"/><path d="M84 122 Q100 134 116 122" stroke="#141821" stroke-width="5" fill="none" stroke-linecap="round"/></g>${extra || ''}</svg>`;
  const mini = (id, x, y, c, w) => `<div class="w mp" id="${id}" style="${P(x, y)};width:${w || 60}px;height:${(w || 60) * 200 / 90}px">${person(c)}</div>`;
  const wp = (id, x, y, t, col, o) => { o = o || {}; return `<div class="wp" id="${id}" style="${P(x, y)};border-color:${col || '#8a93a6'};color:${o.c || col || INK};${o.bg ? 'background:' + o.bg + ';' : ''}${o.w ? 'width:' + o.w + 'px;' : ''}${o.fs ? 'font-size:' + o.fs + 'px;' : ''}${o.on ? 'opacity:1;' : ''}${o.st || ''}">${t}</div>`; };
  const box = (id, x, y, w, h, st, inner) => `<div class="w" id="${id}" style="${P(x, y)};width:${w}px;height:${h}px;box-sizing:border-box;${st || ''}">${inner || ''}</div>`;
  const grp = (id, inner) => ADD(`<div class="w" id="${id}" style="left:0;top:0;width:0;height:0">${inner}</div>`);

  /* ═══════ BASE ═══════ */
  ADD(box('wat', 0, 1000, 3840, 330, `background:linear-gradient(#8ec5e8,#6aaedb);border-top:6px solid #5a9cc9;border-bottom:6px solid #5a9cc9`));
  ADD(box('gnd', 0, 1330, 3840, 830, `background:#d6dcc2`));
  ADD(box('gnd2', 0, 1330, 3840, 40, `background:#e4d9b6`));
  ADD(`<div id="wv">${Array.from({ length: 16 }, (_, k) => `<div class="w wvs" style="left:${100 + k * 200}px;top:${1050 + (k * 71) % 240}px;width:110px;height:8px;border-radius:4px;background:#d9ecf8"></div>`).join('')}</div>`);

  /* mouth: house, banner, sign, first gate */
  grp('gM', `${box('hse', 160, 800, 320, 200, `background:#d9c9a6;border:6px solid #b89c64;border-radius:10px`)}
    <svg class="w" style="${P(140, 730)}" width="360" height="80" viewBox="0 0 360 80"><path d="M0 80 L180 4 L360 80 Z" fill="#a8483f"/></svg>
    ${box('ban', 120, 700, 400, 100, `background:${YEL};border:6px solid #b8860b;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:${INK};white-space:nowrap;z-index:2`, 'Laptop purchase')}
    ${box('hilp', 680, 770, 14, 230, `background:#6b7280;border-radius:6px`)}
    ${wp('hil', 520, 720, 'Human in the loop', AMB, { bg: '#fff3d6', c: AMBD, on: 1, st: 'padding:5px 14px;' })}
    ${box('g0', 1000, 1000, 40, 330, `background:#6b7280;border-radius:6px`)}
    <div class="w" id="gDec" style="left:0;top:0;width:0;height:0"><svg class="w" style="left:1500px;top:620px" width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="55" fill="#ffe08a"/></svg>
    ${[[1100, 620], [1500, 790]].map(([x, y]) => `<svg class="w" style="left:${x}px;top:${y}px" width="300" height="90" viewBox="0 0 300 90"><g fill="#fff"><rect x="0" y="34" width="300" height="56" rx="28"/><circle cx="115" cy="38" r="38"/><circle cx="200" cy="42" r="32"/></g></svg>`).join('')}
    ${Array.from({ length: 5 }, (_, k) => `<svg class="w" style="left:${1090 + k * 150}px;top:${790 + (k % 2) * 20}px" width="96" height="${160 - (k % 2) * 20}" viewBox="0 0 96 160"><rect x="40" y="86" width="16" height="${74 - (k % 2) * 20}" fill="#8a6330"/><circle cx="48" cy="48" r="48" fill="#7fb069"/></svg>`).join('')}</div>`);

  ADD(`<div id="pav">${[0, 1, 2, 3].map((r) => Array.from({ length: 21 }, (_, k) => `<div class="w" style="left:${90 + k * 180 + (r % 2) * 90}px;top:${1500 + r * 100}px;width:120px;height:44px;border-radius:12px;background:#c9ceb4"></div>`).join('')).join('')}${Array.from({ length: 9 }, (_, k) => `<div class="w" style="left:${300 + k * 420}px;top:1338px;width:34px;height:60px;border-radius:10px;background:#6b7280"></div>`).join('')}</div>`);
  /* barge (group): left 280, top 1105; crate + hull + flag + cargo tag */
  ADD(`<div class="w" id="brg" style="${P(280, 1105)};width:280px;height:230px">
    <div class="w" style="left:60px;top:0;width:150px;height:96px;box-sizing:border-box;background:#b98a4e;border:5px solid #8a6330;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:#fff">laptop</div>
    <svg class="w" style="left:0;top:96px" width="280" height="76" viewBox="0 0 280 76"><path d="M0 0 H280 L244 72 H36 Z" fill="#5a6b7d"/></svg>
    <div class="w" style="left:246px;top:20px;width:6px;height:80px;background:#3a3a4a"></div><div class="w" style="left:250px;top:20px;width:30px;height:22px;background:${CORAL}"></div>
    <div class="w" id="tg" style="left:0;top:184px;width:280px;height:48px;box-sizing:border-box;border:4px dashed #8a93a6;border-radius:12px;background:#fff;text-align:center;font-size:32px;font-weight:800;line-height:40px;color:${INK};opacity:0"><span id="tgt" style="opacity:0"></span></div></div>`);
  ADD(`<div class="w" id="brg2" style="${P(280, 1130)};width:200px;height:150px;opacity:0"><div class="w" style="left:40px;top:0;width:110px;height:70px;background:#b98a4e;border:5px solid #8a6330;border-radius:10px"></div><svg class="w" style="left:0;top:70px" width="200" height="56" viewBox="0 0 200 56"><path d="M0 0 H200 L176 52 H24 Z" fill="#5a6b7d"/></svg></div>`);

  /* characters */
  ADD(human('mar', 200, 1165, CORAL, '#3a2a22'));
  ADD(box('mlap', 340, 1400, 120, 86, `background:#1f2a44;border:6px solid #3a4a78;border-radius:10px`, `<div class="w" style="left:8px;top:8px;width:88px;height:50px;background:#e6ecfb;border-radius:4px"></div>`));
  ADD(agent('nex', 0, 1150, { folder: '', lock: true }).replace('width="360" height="500"', 'width="216" height="300"').replace('left:0px', 'left:0px'));
  ADD(human('val', 0, 1165, '#7b5cd6', '#2b2b2b'));
  ADD(human('mgr', 360, 1165, '#8a93a6', '#2b2b2b', '', 'h'));
  ADD(`<div class="bub h" id="bNew" style="${P(100, 1070)}">new laptop</div>`);

  /* ═══════ LOCK 1 · AI stage ═══════ */
  grp('gL1', `${box('f1', 860, 560, 640, 440, `background:#f3effa;border:8px solid ${VIO};border-radius:26px`)}
    ${wp('t1', 884, 574, 'AI stage', VIO)}
    <svg class="w" id="arc" style="${P(880, 680)}" width="400" height="650" viewBox="0 0 400 650"><rect x="0" y="20" width="40" height="630" fill="${VIO}"/><rect x="360" y="20" width="40" height="630" fill="${VIO}"/><rect x="0" y="0" width="400" height="56" rx="14" fill="${VIO}"/></svg>
    ${box('beam', 930, 790, 300, 14, `background:#cbbbe9;border-radius:7px;opacity:0`)}
    ${wp('bud', 1000, 840, 'budget', VIO)}
    ${wp('lpA', 1290, 600, 'Approve', VIO, { on: 1, fs: 32 })}${wp('lpR', 1290, 670, 'Reject', VIO, { on: 1, fs: 32 })}
    ${wp('tkt', 1290, 790, 'rationale', VIO, { bg: '#fff', st: 'border-radius:10px;' })}`);
  /* conditions */
  grp('gSW', `${box('fs', 1520, 560, 360, 440, `background:#e6f4f2;border:8px solid ${TEAL};border-radius:26px`)}
    ${wp('ts', 1544, 574, 'conditions', TEAL)}
    ${[['bR', 1544, 640, 'route'], ['bA', 1704, 640, 'approve'], ['bJ', 1544, 704, 'reject'], ['bS', 1704, 704, 'skip']].map(([id, x, y, t]) => wp(id, x, y, t, TEAL, { w: 150, fs: 32, st: 'padding:5px 4px;' })).join('')}
    ${box('slot', 1544, 774, 220, 70, `border:4px dashed ${TEAL};border-radius:14px;background:#fff`)}
    ${wp('tIn', 1558, 781, 'input', TEAL, { fs: 32 })}
    ${wp('cond', 1544, 852, 'condition', TEAL)}${wp('thr', 1544, 918, 'threshold', TEAL)}`);
  ADD(`<svg class="w" id="rail" style="${P(1500, 1100)}" width="1200" height="230" viewBox="0 0 1200 230" fill="none" stroke="${TEAL}" stroke-width="8" stroke-linecap="round" opacity="0"><path d="M0 60 H1140"/><path d="M200 60 Q280 60 320 160 Q340 190 400 190 H1140"/></svg>`);
  ADD(box('gtS', 1690, 1000, 36, 330, `background:#6b7280;border-radius:6px;transform-origin:50% 100%;opacity:0`));
  ADD(wp('stA', 1600, 1080, 'approved', '#8a93a6', { fs: 34, bg: '#f3f5f9' }));
  ADD(wp('stR', 1600, 1080, 'rejected', '#8a93a6', { fs: 34, bg: '#f3f5f9' }));
  /* lock 2 */
  grp('gL2', `${box('f2', 1920, 560, 660, 440, `background:#eaf1f8;border:8px solid ${BLU3};border-radius:26px`)}
    ${wp('t2', 1944, 574, 'manual stage', BLU3)}${wp('mgmt', 2230, 574, 'management', BLU3)}
    ${box('bd', 1944, 640, 410, 340, `background:#fff;border:4px solid ${BLU3};border-radius:16px`,
      `<div class="w" id="bdh" style="left:14px;top:6px;font-size:36px;font-weight:800;color:${BLU3};white-space:nowrap;opacity:0">approval type</div>
       ${wp('pl1', 14, 58, 'First to respond', BLU3, { w: 380, fs: 32, on: 1, st: 'padding:5px 6px;' })}${wp('pl2', 14, 124, 'Everyone must approve', BLU3, { w: 380, fs: 32, on: 1, st: 'padding:5px 6px;' })}
       ${wp('fT', 14, 200, 'title', '#8a93a6', { fs: 32, on: 1, c: '#5d6472' })}${wp('fD', 150, 200, 'Details', '#8a93a6', { fs: 32, on: 1, c: '#5d6472' })}${wp('fA', 14, 264, 'Assigned to', '#8a93a6', { fs: 32, on: 1, c: '#5d6472' })}`)}
    ${mini('k1', 2380, 800, '#8a93a6', 56)}${mini('k2', 2450, 800, '#3d6e9e', 56)}${mini('k3', 2520, 800, '#7b6a4e', 56)}
    ${[2408, 2478, 2548].map((x, i) => `<div class="w" id="fg${i + 1}" style="left:${x}px;top:752px;width:40px;height:44px;opacity:0"><div class="w" style="left:0;top:0;width:5px;height:44px;background:#3a3a4a"></div><div class="w" style="left:5px;top:0;width:30px;height:22px;background:${BLU3}"></div></div>`).join('')}`);
  ADD(box('gt2', 2310, 1000, 36, 330, `background:#6b7280;border-radius:6px;transform-origin:50% 100%;opacity:0`));
  /* amber outline */
  grp('gOut', `${box('out', 830, 470, 1780, 890, `border:10px solid ${AMB};border-radius:40px`)}
    ${wp('tOut', 862, 484, 'multistage approval', AMB, { bg: '#fff3d6', c: AMBD })}${wp('tHR', 1330, 484, 'Human review · preview', AMB, { bg: '#fff3d6', c: AMBD })}
    ${wp('stp', 1840, 484, 'agent flow', NAVY)}`);
  /* bells (near bank) */
  grp('gBells', `${wp('bT', 1850, 1150, 'Teams', NAVY, { w: 150 })}${wp('bO', 2030, 1150, 'Outlook', NAVY, { w: 180 })}${wp('bP', 1840, 1235, 'Power Automate portal', NAVY, { w: 450 })}`);
  /* second hut (near bank) */
  grp('gH2', `${box('h2', 1960, 1368, 380, 180, `background:#eaf1f8;border:8px solid ${BLU3};border-radius:22px`)}${mini('mg2', 2250, 1380, '#8a93a6', 70)}${wp('h2t', 1984, 1384, 'Assigned to', BLU3)}
    <svg class="w" id="lnk" style="${P(1900, 960)}" width="700" height="470" viewBox="0 0 700 470" fill="none" stroke="${NAVY}" stroke-width="6" stroke-dasharray="14 12" opacity="0"><path d="M480 20 Q480 250 385 420"/></svg>
    ${box('brr', 2290, 1190, 130, 22, `background:repeating-linear-gradient(45deg,#5a6b7d 0 10px,#e9ecf3 10px 20px);border-radius:8px;opacity:0;z-index:3`)}
    ${wp('sam', 1980, 1230, 'same approver', SLT, { z: 1 })}`);
  /* tray (scene 3) */
  grp('gTray', `${box('tr', 820, 1372, 810, 152, `background:#e9edf3;border:4px solid ${VIO};border-radius:22px`)}
    ${wp('iD', 834, 1384, 'documents', VIO, { fs: 32 })}${wp('iI', 1062, 1384, 'images', VIO, { fs: 32 })}${wp('iT', 1228, 1384, 'text', VIO, { fs: 32 })}${wp('iK', 1354, 1384, 'knowledge', VIO, { fs: 32 })}
    ${wp('scr', 834, 1456, 'instructions', '#8a6330', { bg: '#f4ead2', fs: 32, w: 260 })}
    <div class="wp" id="dial" style="${P(1670, 1392)};border-color:${VIO};font-size:32px;padding:5px 18px 5px 64px"><div class="w" id="knob" style="left:10px;top:6px;width:42px;height:42px;border-radius:50%;box-sizing:border-box;border:5px solid ${VIO};background:#fff"><div class="w" style="left:14px;top:-2px;width:6px;height:16px;background:${VIO};border-radius:3px"></div></div>model</div>
    ${wp('tst', 1860, 1392, 'Test', VIO, { fs: 34, bg: '#f3effa' })}`);
  /* docks */
  grp('gDk', `${box('dkA', 2600, 860, 220, 84, `background:#f3f5f9;border:6px solid #8a93a6;border-radius:18px`, `<div class="w" style="left:0;right:0;top:12px;text-align:center;font-size:34px;font-weight:800;color:${INK}">approved</div>`)}
    ${box('dkR', 2600, 1360, 220, 84, `background:#f3f5f9;border:6px solid #8a93a6;border-radius:18px`, `<div class="w" style="left:0;right:0;top:12px;text-align:center;font-size:34px;font-weight:800;color:${INK}">rejected</div>`)}`);
  /* request for information (scene 6) */
  grp('gBay', `${box('bay', 1400, 1490, 740, 370, `background:#a9d3ee;border:10px solid ${SLT};border-radius:40px`)}
    ${wp('tRfi', 1424, 1504, 'Request for information', SLT)}
    <svg class="w" id="buoy" style="${P(1450, 1600)}" width="120" height="240" viewBox="0 0 120 240"><rect x="30" y="20" width="60" height="140" rx="26" fill="${SLT}"/><rect x="30" y="70" width="60" height="26" fill="${YEL}"/><circle cx="60" cy="12" r="12" fill="#fff" stroke="${SLT}" stroke-width="5"/><path d="M10 175 H110" stroke="#fff" stroke-width="8" stroke-linecap="round"/></svg>
    ${box('env', 1590, 1640, 210, 120, `background:#fff;border:5px solid ${SLT};border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800;color:${INK};opacity:0`, 'Outlook')}
