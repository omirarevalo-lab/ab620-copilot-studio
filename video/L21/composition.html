<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>L21 · Monitor agent flows and their cost · world style</title>
<script src="gsap.min.js"></script>
<!-- TAIL 2.5 -->
<link rel="stylesheet" href="style.css" />
<style>
  .tk { position: absolute; width: 120px; height: 78px; display: flex; align-items: center; justify-content: center; background: #fff; border: 6px solid #2f5bd3; border-radius: 16px; color: #2f5bd3; box-sizing: border-box; opacity: 0; }
  .tk .ic { width: 46px; height: 46px; }
  .stn { position: absolute; top: 1142px; width: 200px; height: 230px; background: #dfe5f2; border: 6px solid #8a93a6; border-radius: 22px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #5d6472; }
  .stn .ic { width: 90px; height: 90px; margin-top: 30px; }
  .stn i.lamp { position: absolute; left: 82px; top: 20px; width: 36px; height: 36px; border-radius: 50%; background: #b6bdcc; }
  .dtab { position: absolute; top: 612px; width: 380px; height: 66px; border-radius: 20px; background: #2d3a5c; border: 3px solid #5b6b97; color: #cfd8ee; font-size: 40px; font-weight: 800; display: flex; align-items: center; justify-content: center; opacity: 0; }
  .tb { padding: 12px 36px; font-size: 34px; font-weight: 700; color: #5d6472; border-bottom: 6px solid rgba(47,91,211,0); }
  .rr { position: absolute; left: 0; width: 1228px; height: 66px; display: flex; align-items: center; gap: 22px; border-bottom: 2px solid var(--line); font-size: 32px; border-radius: 10px; }
  .ck { width: 38px; height: 38px; border: 4px solid #8a93a6; border-radius: 9px; display: flex; align-items: center; justify-content: center; margin-left: 10px; }
  .ck i { font-style: normal; color: #fff; font-size: 28px; font-weight: 800; opacity: 0; }
  .st { width: 240px; font-weight: 800; } .st.ok { color: #1e7f4f; } .st.bad { color: #c4392f; } .st.run { color: #d98a00; }
  .du { width: 190px; } .tm { width: 190px; color: #5d6472; }
  .stp { position: absolute; left: 0; width: 900px; height: 76px; display: flex; align-items: center; gap: 18px; padding: 0 20px; border-radius: 16px; font-size: 34px; font-weight: 700; border: 4px solid transparent; }
  .stp .ic { width: 44px; height: 44px; }
  .ut { position: absolute; top: 0; height: 290px; background: #f3f5f9; border-radius: 22px; padding: 22px 28px; border: 3px solid #e2e5eb; }
  .ut small { display: block; font-size: 32px; font-weight: 700; color: #5d6472; }
  .ut b { display: block; font-size: 92px; line-height: 1.1; margin-top: 18px; }
  .clk { position: absolute; left: 0; top: 330px; display: inline-flex; align-items: center; gap: 14px; background: #fff3d6; border: 3px solid #d98a00; color: #7a4d00; border-radius: 999px; padding: 10px 28px; font-size: 32px; font-weight: 800; opacity: 0; }
  .clk .ic { width: 40px; height: 40px; color: #d98a00; }
  .stepcap { position: absolute; left: 56px; top: 712px; width: 1228px; height: 80px; border-radius: 18px; background: #e6ecfb; color: #2f5bd3; font-size: 40px; font-weight: 800; display: flex; align-items: center; padding: 0 30px; opacity: 0; }
  .cc { position: absolute; height: 112px; display: flex; align-items: center; justify-content: center; padding: 0 34px; border-radius: 26px; background: #fff; border: 6px solid #2f5bd3; color: #141821; font-size: 56px; font-weight: 800; white-space: nowrap; opacity: 0; box-sizing: border-box; }
  .cc.op { background: none; border: none; color: #5d6472; padding: 0 6px; }
  .cs { position: absolute; width: 320px; height: 104px; display: flex; align-items: center; justify-content: center; text-align: center; border-radius: 24px; background: #fff; border: 6px solid #8a5cd6; color: #8a5cd6; font-size: 34px; font-weight: 800; line-height: 1.12; box-sizing: border-box; opacity: 0; }
  .dr { position: absolute; width: 390px; height: 140px; display: flex; align-items: center; gap: 16px; padding: 0 22px; border-radius: 24px; background: #fff; border: 6px solid #b6bdcc; color: #5d6472; font-size: 34px; font-weight: 800; line-height: 1.12; box-sizing: border-box; opacity: 0; }
  .dr i.lp { flex: 0 0 38px; height: 38px; border-radius: 50%; background: #b6bdcc; }
  .tbar { position: absolute; height: 28px; border-radius: 14px; }
  .ovb { position: absolute; inset: 0; background: #f4f6fa; opacity: 0; }
  #stage #uiBack { background: #eef1f7; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
<section class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="2">
<div id="stage"></div>
</section>
<audio id="narr" src="narration.mp3" data-start="0" data-duration="{{DURATION}}" data-track-index="1" data-volume="1"></audio>
</div>

<!-- @world -->
<script>
  /* L21 · Monitor agent flows and their cost.
     World 3840x2160: dashboard 700,70 (1400x700) · agent 300,870 · belt y1372 x420-1900 · stations 800/1080/1360 · cable gap 1625-1675 y1250 · Dataverse 1740,1050 · tank 2280,950 ·
     test window 700,1560 · finance desk 1500-2100,1740 · harness district: Standard 2780 · glass tower 3130 · chat 3520 (base y1400) */
  const BLUE = '#2f5bd3', GRN = '#1e7f4f', RED = '#c4392f', AMB = '#d98a00', PUR = '#8a5cd6', NAVY = '#1f2a44';
  const D = (id, st, html) => `<div class="w" id="${id}" style="${st}">${html || ''}</div>`;
  const H = (id, st, html) => D(id, st + ';opacity:0', html);
  const PL = (id, x, y, t, c, fs) => pill(id, x, y, t, c).replace('style="', 'style="font-size:' + fs + 'px;');
  const SB = (id, x, y, t, fs, c) => say(id, x, y, t, c).replace('style="', 'style="font-size:' + fs + 'px;');
  const pulse = (sel, t, col) => tl.fromTo(sel, { boxShadow: '0 0 0 0 rgba(217,138,0,0)' }, { boxShadow: `0 0 0 10px ${col || 'rgba(217,138,0,.85)'}`, duration: 0.25, yoyo: true, repeat: 1 }, t);

  /* ═════════ WORLD: pipes, cables ═════════ */
  const sparkSvg = [[1650, 1214, 1636, 1240, 1664, 1240, 1648, 1274], [1628, 1232, 1646, 1250, 1630, 1268], [1676, 1226, 1660, 1250, 1678, 1266]].map((p) => `<polyline points="${p.join(',')}" fill="none" stroke="#ffb000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  ADD(`<svg class="w" id="pipes" style="left:0;top:0" width="3840" height="2160" viewBox="0 0 3840 2160">
    <path d="M2330 1450 L2330 1490 L900 1490 L900 1415" fill="none" stroke="#b9c0cf" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    ${cable('pfuel', 'M2330 1450 L2330 1490 L900 1490 L900 1415', '#6aa0ff', 14)}
    ${cable('ppay', 'M2480 1700 L2480 1450', GRN, 24)}
    <path d="M1560 1250 L1625 1250" stroke="${RED}" stroke-width="18" stroke-linecap="round" id="cbL"/><path d="M1675 1250 L1740 1250" stroke="${RED}" stroke-width="18" stroke-linecap="round" id="cbR"/>
    ${cable('cbOk', 'M1560 1250 L1740 1250', GRN, 18)}
    <g id="sp">${sparkSvg}</g>
  </svg>`);
  ADD(`<svg class="w" id="cpipes" style="left:0;top:0" width="3840" height="2160" viewBox="0 0 3840 2160">${cable('cpA', 'M2945 1500 C 2945 1440, 3200 1450, 3280 1390', PUR, 14)}${cable('cpB', 'M3280 1500 L3280 1390', PUR, 14)}${cable('cpC', 'M3615 1500 C 3615 1440, 3360 1450, 3280 1390', PUR, 14)}</svg>`);

  /* tank (prepaid capacity) */
  ADD(D('tank', 'left:2280px;top:950px;width:400px;height:500px;border:10px solid #8a93a6;border-radius:30px;background:#f8f9fb;overflow:hidden', D('tkFill', 'left:0;bottom:0;width:380px;height:430px;background:linear-gradient(#8cb4ff,#5b8be6)')));
  ADD(PL('lbTank', 2470, 860, 'Prepaid capacity', 'navy', 48) + PL('tEmpty', 2480, 1160, 'EMPTY', 'red', 64));

  /* harness district */
  const bricks = 'repeating-linear-gradient(0deg,#b4533f 0 28px,#e8dccf 28px 32px),#b4533f';
  ADD(`<div id="hd" style="opacity:0">` +
    D('hStd', 'left:2780px;top:1060px;width:260px;height:340px;border-radius:14px;border:6px solid #8a3a2a;box-sizing:border-box;background:' + bricks) +
    D('hGls', 'left:3130px;top:920px;width:300px;height:480px;border-radius:18px;border:6px solid #5b8be6;box-sizing:border-box;background:linear-gradient(135deg,#e6f0ff,#bcd4ff 55%,#e6f0ff)', IC('sparkle', 'position:absolute;left:100px;top:40px;width:100px;height:100px;color:#2f5bd3')) +
    D('hChat', 'left:3520px;top:1060px;width:260px;height:340px;border-radius:40px;border:6px solid #8a93a6;box-sizing:border-box;background:#f3f5f9', IC('chat', 'position:absolute;left:80px;top:40px;width:100px;height:100px;color:#5d6472')) +
    PL('lbStd', 2910, 985, 'Standard', 'navy', 44) + PL('lbGls', 3280, 842, 'Microsoft Copilot harness', 'blue', 44) + PL('lbFor', 3280, 764, 'formerly GitHub Copilot harness', 'amber', 36) + PL('lbChat', 3650, 985, 'Copilot chat', 'navy', 44) + `</div>`);
  /* meters (dials) inside each building */
  const dial = (id, cx, cy) => {
    let t = ''; for (let k = 0; k < 12; k++) { const a = (k / 12) * 2 * Math.PI; t += `<line id="${id}_t${k}" x1="${70 + 52 * Math.sin(a)}" y1="${70 - 52 * Math.cos(a)}" x2="${70 + 62 * Math.sin(a)}" y2="${70 - 62 * Math.cos(a)}" stroke="#8a93a6" stroke-width="7" stroke-linecap="round"/>`; }
    return `<svg class="w" id="${id}" style="left:${cx - 70}px;top:${cy - 70}px;opacity:0" width="140" height="140" viewBox="0 0 140 140"><circle cx="70" cy="70" r="66" fill="#fff" stroke="#1f2a44" stroke-width="6"/>${t}
      <g id="${id}_n"><line x1="70" y1="70" x2="70" y2="30" stroke="#c4392f" stroke-width="8" stroke-linecap="round"/></g><circle cx="70" cy="70" r="9" fill="#1f2a44"/></svg>`;
  };
  ADD(dial('mStd', 2910, 1290) + dial('mGls', 3280, 1300) + dial('mChat', 3650, 1290));
  gsap.set(['#mStd_n', '#mGls_n', '#mChat_n'], { rotation: -40, svgOrigin: '70 70' });
  /* coins (Copilot Credits) */
  const coin = (id, x, y, t, s) => D(id, `left:${x}px;top:${y}px;width:${s || 120}px;height:${s || 120}px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#f2b705);border:6px solid #b98400;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:${(s || 120) * 0.42}px;font-weight:800;color:#6b4a00;opacity:0`, t);
  ADD(coin('cnS', 2850, 1090, 'CC') + coin('cnG', 3220, 1090, 'CC') + coin('cnC', 3590, 1090, 'CC'));
  ADD(PL('lbCC', 2480, 800, 'Copilot Credits', 'amber', 56));
  /* cost pipe chips (Microsoft Copilot harness meter) */
  const CS = (id, x, t) => `<div class="cs" id="${id}" style="left:${x}px;top:1500px">${t}</div>`;
  ADD(CS('csA', 2785, 'LLM tokens') + CS('csB', 3120, 'Tools<br>knowledge · MCP') + CS('csC', 3455, 'Runtime'));
  ADD(PL('lbStdD', 2910, 1430, 'per event · defined rates', 'blue', 40));

  /* ═════════ WORLD: dashboard ═════════ */
  const ptA = (a) => [260 + 200 * Math.cos(a * Math.PI / 180), 270 - 200 * Math.sin(a * Math.PI / 180)];
  const arc = (a0, a1, col) => { const p = ptA(a0), q = ptA(a1); return `<path d="M${p[0]} ${p[1]} A200 200 0 0 1 ${q[0]} ${q[1]}" fill="none" stroke="${col}" stroke-width="46" stroke-linecap="butt"/>`; };
  const needle = (id) => `<g id="${id}"><line x1="260" y1="270" x2="260" y2="92" stroke="#fff" stroke-width="14" stroke-linecap="round"/><circle cx="260" cy="270" r="24" fill="#fff"/></g>`;
  ADD(`<div class="w" id="dash" style="left:700px;top:70px;width:1400px;height:720px;background:#1f2a44;border-radius:50px;box-shadow:0 30px 80px rgba(16,24,40,.35)">
    <div class="w" id="dashGlow" style="left:-14px;top:-14px;width:1428px;height:748px;border-radius:62px;box-shadow:0 0 0 0 rgba(255,209,102,0);"></div>
    <div class="w" style="left:30px;top:30px;width:1340px;height:660px;background:#101a33;border-radius:36px"></div>
    <div class="w" style="left:70px;top:50px;font-size:44px;font-weight:800;color:#cfd8ee;white-space:nowrap">Create ticket · agent flow</div>
    <svg class="w" style="left:90px;top:110px" width="520" height="330" viewBox="0 0 520 330">${arc(180, 120, '#c4392f')}${arc(120, 60, '#d98a00')}${arc(60, 0, '#2fae6a')}${needle('nH')}</svg>
    <svg class="w" style="left:790px;top:110px" width="520" height="330" viewBox="0 0 520 330">${arc(180, 0, '#6aa0ff')}<text x="60" y="322" font-size="40" font-weight="800" fill="#cfd8ee" text-anchor="middle">E</text><text x="460" y="322" font-size="40" font-weight="800" fill="#cfd8ee" text-anchor="middle">F</text>${needle('nF')}</svg>
    ${H('dHl', 'left:90px;top:436px;width:520px;text-align:center;font-size:64px;font-weight:800;color:#fff', 'Health')}
    ${H('dFl', 'left:790px;top:436px;width:520px;text-align:center;font-size:64px;font-weight:800;color:#fff', 'Fuel')}
    ${H('dCr', 'left:790px;top:514px;width:520px;text-align:center;font-size:44px;font-weight:800;color:#ffd166', 'Copilot Credits')}
    ${['Overview', 'Activity', 'Analytics'].map((n, k) => `<div class="dtab" id="dt${k}" style="left:${100 + k * 410}px">${n}</div>`).join('')}</div>`);
  gsap.set('#nH', { rotation: -78, svgOrigin: '260 270' }); gsap.set('#nF', { rotation: -80, svgOrigin: '260 270' });

  /* ═════════ WORLD: factory ═════════ */
  ADD(D('dv', 'left:1740px;top:1050px;width:340px;height:322px;background:#1f2a44;border-radius:26px', IC('database', 'position:absolute;left:125px;top:26px;width:90px;height:90px;color:#8cb4ff') +
    '<div class="w" style="left:0;top:130px;width:340px;text-align:center;font-size:60px;font-weight:800;color:#fff">Dataverse</div>' + [0, 1].map((k) => `<div class="w" style="left:40px;top:${220 + k * 50}px;width:260px;height:30px;border-radius:8px;background:#2d3a5c"></div>`).join('')));
  [[800, 'send'], [1080, 'document_text'], [1360, 'ticket_diagonal']].forEach(([x, ic], k) => ADD(`<div class="stn" id="st${k}" style="left:${x}px"><i class="lamp" id="la${k}"></i>${IC(ic)}</div>`));
  ADD(D('belt', 'left:420px;top:1372px;width:1480px;height:40px;background:#4a5468;border-radius:20px') + D('beltLine', 'left:440px;top:1388px;width:1440px;height:6px;background:repeating-linear-gradient(90deg,#8a93a6 0 30px,transparent 30px 60px)'));
  ADD(agent('ag', 300, 870, { folder: '' }));
  ADD(`<svg class="w" style="left:300px;top:870px" width="360" height="500" viewBox="0 0 360 500"><path d="M62 190 Q62 100 180 100 Q298 100 298 190" fill="none" stroke="#141821" stroke-width="10"/><rect x="42" y="168" width="26" height="64" rx="12" fill="#141821"/><rect x="292" y="168" width="26" height="64" rx="12" fill="#141821"/><path d="M62 232 Q70 262 130 262" fill="none" stroke="#141821" stroke-width="8"/></svg>`);
  /* meter under station 3 */
  ADD(H('meter', 'left:1380px;top:1430px;width:160px;height:122px;background:#fff;border:6px solid #1f2a44;border-radius:18px;overflow:hidden;box-sizing:border-box', D('mFill', 'left:0;bottom:0;width:148px;height:6px;background:linear-gradient(#ffd166,#f2b705)') + '<div class="w" style="left:0;top:10px;width:148px;text-align:center;font-size:34px;font-weight:800;color:#1f2a44">credits</div>'));
  /* employees, user, technician, finance */
  ADD(crowd('em0', 230, 1580, '#8a5cd6') + crowd('em1', 520, 1580, '#d98a00') + crowd('em2', 800, 1580, '#1e7f4f') + crowd('usr', 380, 1580, '#2f5bd3'));
  ADD(crowd('tech', 1640, 1480, '#1e7f4f'));
  ADD(crowd('fin', 1620, 1600, '#8a5cd6') + D('desk', 'left:1500px;top:1740px;width:600px;height:110px;border-radius:14px;background:#c9ced8') + D('deskL1', 'left:1530px;top:1850px;width:20px;height:50px;background:#c9ced8') + D('deskL2', 'left:2050px;top:1850px;width:20px;height:50px;background:#c9ced8') +
    D('calc', 'left:1960px;top:1640px;width:120px;height:100px;border-radius:14px;background:#1f2a44;color:#6be3a0;font-size:36px;font-weight:800;display:flex;align-items:center;justify-content:center', '0'));
  /* test window (designer) */
  ADD(H('twin', 'left:700px;top:1560px;width:520px;height:300px;border-radius:22px;background:#fff;border:6px solid #1f2a44;overflow:hidden;box-sizing:border-box',
    '<div class="w" style="left:0;top:0;width:508px;height:62px;background:#1f2a44;color:#fff;font-size:34px;font-weight:700;display:flex;align-items:center;padding-left:22px">Designer · Test run</div>' +
    D('twBelt', 'left:30px;top:170px;width:450px;height:20px;border-radius:10px;background:#4a5468') + [0, 1, 2].map((k) => `<div class="w tw" id="tw${k}" style="left:${40 + k * 130}px;top:128px;width:60px;height:40px;border-radius:10px;background:#fff;border:5px solid #2f5bd3;box-sizing:border-box"></div>`).join('')));
  ADD(PL('tFree', 1410, 1700, 'free', 'green', 72));
  /* cards */
  const TK = (id, left) => `<div class="tk" id="${id}" style="left:${left}px;top:1294px">${IC('ticket_diagonal')}</div>`;
  ADD(['tk0', 'tk1', 'tk2', 'tk3'].map((i) => TK(i, 560)).join('') + ['tk4', 'tk5', 'tk6'].map((i) => TK(i, 560)).join('') + TK('tk7', 960) + TK('tk8', 1180) + ['tk9', 'tk10', 'tk11'].map((i) => TK(i, 560)).join('') + TK('tkU', 560));
  /* bubbles, tags */
  ADD(SB('b0', 275, 1440, 'ticket?', 60) + SB('b1', 565, 1440, 'ticket?', 60) + SB('b2', 845, 1440, 'ticket?', 60));
  ADD(PL('lbBelt', 1000, 1050, 'Create ticket', 'navy', 52) + PL('tLost', 1520, 1030, 'Ticket lost', 'red', 56) + SB('bFin', 1700, 1470, 'How much do flows cost?', 52));
  ADD(PL('tOk', 1900, 980, 'created', 'green', 52));

  /* ═════════ UI windows (generated per prefix) ═════════ */
  const RUNS = [['Succeeded', '2.1 s', '09:12', 'ok'], ['Failed', '1.4 s', '09:40', 'bad'], ['Succeeded', '2.3 s', '10:05', 'ok'], ['Failed', '1.5 s', '10:31', 'bad'], ['In progress', '…', '10:58', 'run']];
  const TABS = (p, hide) => `<div id="${p}_tabs" style="position:absolute;left:56px;top:24px;display:flex;gap:10px${hide ? ';opacity:0' : ''}">${['Overview', 'Activity', 'Analytics'].map((n, k) => `<div class="tb" id="${p}_tb${k}"${k === 0 ? ' style="color:#2f5bd3;border-bottom-color:#2f5bd3"' : ''}>${n}</div>`).join('')}</div>`;
  const ovLay = (p) => `<div class="lay" id="${p}_ov" style="top:130px;opacity:0">
    ${[['Name', 'Create ticket', 0, 0], ['Description', 'Creates IT tickets in Dataverse', 584, 0], ['Connections', 'Dataverse', 0, 116], ['Owners', 'IT team', 584, 116]].map((f, k) => `<div class="fld" id="${p}_f${k}" style="position:absolute;left:${f[2]}px;top:${f[3]}px;width:560px"><small>${f[0]}</small>${f[1]}</div>`).join('')}
    <div id="${p}_rh" style="position:absolute;left:0;top:236px;font-size:34px;font-weight:800">Recent runs</div>
    ${[0, 1, 2].map((k) => `<div class="rr" id="${p}_o${k}" style="top:${284 + k * 56}px;height:52px"><span class="st ${RUNS[k][3]}" style="margin-left:10px">${RUNS[k][0]}</span><span class="du">${RUNS[k][1]}</span><span class="tm">${RUNS[k][2]}</span></div>`).join('')}
    <span class="btn" id="${p}_bOff" style="position:absolute;left:0;top:462px;font-size:32px">Turn off</span><span class="btn" id="${p}_bDel" style="position:absolute;left:190px;top:462px;font-size:32px;color:#c4392f;border-color:#c4392f">Delete</span></div>`;
  const acLay = (p) => `<div class="lay" id="${p}_ac" style="top:130px;opacity:0">
    <div style="position:absolute;left:0;top:-6px;font-size:44px;font-weight:800">Run history</div>
    <div style="position:absolute;right:0;top:0;display:flex;gap:16px"><span class="btn" id="${p}_bR" style="font-size:32px;opacity:.4">Resubmit</span><span class="btn" id="${p}_bC" style="font-size:32px;opacity:.4">Cancel</span></div>
    <div class="rr" style="top:70px;height:56px;font-weight:800;color:#5d6472;font-size:30px"><span style="width:52px"></span><span id="${p}_hS" style="width:240px;border-radius:8px">Status</span><span id="${p}_hD" class="du" style="border-radius:8px">Duration</span><span class="tm">Started</span></div>
    ${RUNS.map((r, k) => `<div class="rr" id="${p}_r${k}" style="top:${134 + k * 70}px"><span class="ck" id="${p}_c${k}"><i>✓</i></span><span class="st ${r[3]}">${r[0]}</span><span class="du">${r[1]}</span><span class="tm">${r[2]}</span></div>`).join('')}</div>`;
  const dtLay = (p) => `<div class="lay" id="${p}_dt" style="top:130px;opacity:0">
