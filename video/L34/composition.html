<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>L34 · Application Insights and the Monitor tab · world style</title>
<script src="gsap.min.js"></script>
<!-- TAIL 2.5 -->
<link rel="stylesheet" href="style.css" />
<style>
  #stage .uw .nav div { font-size: 30px; padding: 16px 28px; }
  #stage .uw .fld small { font-size: 30px; }
  #stage .uw .btn { font-size: 30px; }
  #stage .uw.az .nav { width: 380px; } #stage .uw.az .main { left: 380px; }
  #stage .uw.m .nav { width: 240px; } #stage .uw.m .main { left: 240px; padding: 30px 40px; }
  #stage #uiBack { background: #eef1f7; }
  .ly { position: absolute; left: 40px; right: 40px; top: 10px; bottom: 0; opacity: 0; }
  .rw { position: absolute; left: 0; display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 700; border-bottom: 2px solid #e2e5eb; }
  .mc { position: absolute; height: 230px; box-sizing: border-box; border: 3px solid #e2e5eb; border-radius: 20px; padding: 12px 16px; background: #f3f5f9; }
  .mc small { display: block; font-size: 30px; font-weight: 700; color: #5d6472; }
  .mc b { display: block; font-size: 68px; line-height: 1.1; }
  .mc .dl { font-size: 30px; font-weight: 700; color: #1e7f4f; line-height: 1.15; }
  .cp { position: absolute; display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; padding: 6px 20px; font-size: 30px; font-weight: 700; background: #fff; border: 3px solid #2f5bd3; color: #2f5bd3; opacity: 0; }
  .sr { position: absolute; left: 0; width: 1148px; height: 130px; border-bottom: 2px solid #e2e5eb; opacity: 0; }
  .sr > b { position: absolute; left: 0; top: 4px; font-size: 34px; }
  .sr .tgl { position: absolute; left: 1030px; top: 0; }
  .sr .cp { top: 70px; }
  .tgl.on { background: #2f5bd3; }
  .cd { position: absolute; width: 110px; height: 76px; background: #fff; border: 6px solid #2f5bd3; border-radius: 12px; opacity: 0; box-sizing: border-box; }
  .cd:after { content: ""; position: absolute; left: 12px; top: 14px; width: 60px; height: 8px; border-radius: 4px; background: #c9d8f7; box-shadow: 0 16px 0 #c9d8f7, 0 32px 0 #c9d8f7; }
  .dm { position: absolute; width: 290px; height: 170px; background: #fff; border: 8px solid #d98a00; border-radius: 22px; box-sizing: border-box; opacity: 0; text-align: center; padding-top: 12px; }
  .dm span { display: block; font-size: 40px; font-weight: 700; color: #5d6472; } .dm em { display: block; font-style: normal; font-size: 62px; font-weight: 800; }
  .ovb { position: absolute; inset: 0; background: #f4f6fa; opacity: 0; }
  .xp .cdk { position: absolute; width: 180px; height: 70px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 800; }
  .kcard { position: absolute; background: #fff; border-radius: 28px; box-shadow: 0 30px 80px rgba(16,24,40,.25); opacity: 0; box-sizing: border-box; }
  .code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 36px; line-height: 80px; font-weight: 700; white-space: nowrap; color: #141821; }
  .code div { opacity: 0; }
  .code .k { color: #2f5bd3; } .code .s { color: #1e7f4f; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
<section class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="2">
<div id="stage"></div>
</section>
<audio id="narr" src="narration.mp3" data-start="0" data-duration="{{DURATION}}" data-track-index="1" data-volume="1"></audio>
</div>

<!-- @world -->
<script>
  /* L34 · Application Insights and the Monitor tab.
     World 3840x2160. Hangar (left): black box 360,420 · drawer 300,1180 · investigator 950,1300 + terminal 1070,1240 · chart2 940,250 · admin 260,1590 · gate on the cable 1180,867.
     Contoso floor: Nexo 1650,1010 · help desk y1470 · employees 2080-2410,1340 · team desk 1450,1640 · board above Nexo 1530,470.
     Cockpit (right): panel 2560,360 (1020x1080) · finance desk 2700,1800.
     Camera bounds: cx in [960/s, 3840-960/s], cy in [540/s, 2160-540/s]. */
  const BLUE = '#2f5bd3', GRN = '#1e7f4f', RED = '#c4392f', AMB = '#d98a00', PUR = '#8a5cd6', NAVY = '#1f2a44';
  const D = (id, st, html) => `<div class="w" id="${id}" style="${st}">${html || ''}</div>`;
  const PL = (id, x, y, t, c, fs) => pill(id, x, y, t, c).replace('style="', 'style="font-size:' + fs + 'px;');
  const SB = (id, x, y, t, fs, c) => say(id, x, y, t, c).replace('style="', 'style="font-size:' + fs + 'px;');
  const pulse = (sel, t, col) => tl.fromTo(sel, { boxShadow: '0 0 0 0 rgba(217,138,0,0)' }, { boxShadow: `0 0 0 10px ${col || 'rgba(217,138,0,.85)'}`, duration: 0.25, yoyo: true, repeat: 1, immediateRender: false }, t);
  const camAt = (x, y, s, t) => CAM(x, y, s, t, 0.01);
  const TG = (id, t, on) => { tl.to('#' + id, { backgroundColor: on ? BLUE : '#c9ced8', duration: 0.2 }, t); tl.to('#' + id + 'K', { x: on ? 52 : 0, duration: 0.2 }, t); };
  const tgl = (id, on) => `<div class="tgl" id="${id}" style="${on ? 'background:#2f5bd3' : ''}"><i id="${id}K" style="${on ? 'transform:translateX(52px)' : ''}"></i></div>`;
  const WSWAP = (a, b, t) => { tl.to(a, { opacity: 0, duration: 0.35 }, t); tl.fromTo(b, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.45, ease: 'power2.out' }, t + 0.4); };
  /* world <-> UI: the outgoing layer fades fully to 0 before the incoming one starts (no double exposure) */
  const UIIN2 = (sel, t) => { ON('#uiBack', t - 0.45, 0.4); tl.fromTo(sel, { opacity: 0, scale: 0.28 }, { opacity: 1, scale: 1, duration: 0.7, ease: 'power3.out' }, t); };
  const UIOUT2 = (sel, t) => { tl.to(sel, { opacity: 0, scale: 0.28, duration: 0.5, ease: 'power3.in' }, t); OFF('#uiBack', t + 0.5, 0.4); };
  const UP =(sel, t, y) => tl.fromTo(sel, { opacity: 0, y: y || 20 }, { opacity: 1, y: 0, duration: 0.4, immediateRender: false }, t);

  /* ═════════ WORLD ═════════ */
  /* Contoso floor */
  ADD(D('hdesk', 'left:1560px;top:1470px;width:540px;height:80px;border-radius:14px;background:#c9ced8'));
  ADD(agent('nx', 1650, 1010, { folder: '' }));
  ADD(`<svg class="w" style="left:1650px;top:1010px" width="360" height="500" viewBox="0 0 360 500"><path d="M62 190 Q62 100 180 100 Q298 100 298 190" fill="none" stroke="#141821" stroke-width="10"/><rect x="42" y="168" width="26" height="64" rx="12" fill="#141821"/><rect x="292" y="168" width="26" height="64" rx="12" fill="#141821"/><path d="M62 232 Q70 262 130 262" fill="none" stroke="#141821" stroke-width="8"/></svg>`);
  ADD(PL('lbNexo', 1830, 1572, 'Nexo · IT agent', 'navy', 60));
  ADD(crowd('em0', 2080, 1340, '#8a5cd6') + crowd('em1', 2190, 1340, '#d98a00') + crowd('em2', 2300, 1340, '#1e7f4f') + crowd('mgr', 2410, 1340, NAVY));
  ADD(maker('mk', 1450, 1640));
  ADD(D('tcA', 'left:1850px;top:1800px;width:170px;height:30px;border-radius:14px;background:#ffd166') + D('tcB', 'left:1940px;top:1852px;width:170px;height:30px;border-radius:14px;background:#ffd166') + D('tcC', 'left:1850px;top:1904px;width:130px;height:30px;border-radius:14px;background:#8cb4ff'));
  ADD(PL('lbTest', 1980, 1710, 'Test canvas', 'amber', 60));
  ADD(D('fc0', 'left:1380px;top:1720px;font-size:110px;opacity:0', '😟') + D('fc1', 'left:2330px;top:1160px;font-size:110px;opacity:0', '😟'));
  ADD(SB('bq1', 1400, 880, 'What do they ask?', 64) + SB('bq2', 2270, 1130, 'Is it working?', 64) + SB('bq2g', 2270, 1130, 'Is it working? ✓', 64, 'green'));

  /* chart builder (board above Nexo and the small copy beside the drawer) */
  const HR = [0.5, 0.85, 0.4, 0.75, 0.6, 0.45, 0.8, 0.65];
  const chartHTML = (p, x, y, W, H, n, title, fs, showQ) => {
    const bw = Math.floor((W - 60 - (n - 1) * 16) / n), mx = H - 140;
    let h = `<div class="w" id="${p}" style="left:${x}px;top:${y}px;width:${W}px;height:${H}px;background:#fff;border:8px solid ${NAVY};border-radius:28px;box-sizing:border-box;opacity:0">
      <div class="w" style="left:0;top:14px;width:${W - 16}px;text-align:center;font-size:${fs}px;font-weight:800">${title}</div>`;
    for (let k = 0; k < n; k++) {
      const bh = Math.round(mx * HR[k % 8]);
      h += `<div class="w" id="${p}_b${k}" style="left:${22 + k * (bw + 16)}px;top:${H - 24 - bh}px;width:${bw}px;height:${bh}px;border-radius:8px;background:#8a93a6"></div>`;
      if (showQ) h += `<div class="w" id="${p}_q${k}" style="left:${22 + k * (bw + 16)}px;top:${H - 24 - bh - 72}px;width:${bw}px;text-align:center;font-size:60px;font-weight:800;color:#5d6472;opacity:0">?</div>`;
    }
    return h + '</div>';
  };
  ADD(chartHTML('bd', 1530, 470, 700, 420, 8, 'Monday numbers', 56, true));
  ADD(chartHTML('c2', 940, 250, 340, 290, 6, 'Monday', 52, false));
  ADD(PL('lbTests', 1880, 400, 'tests', 'amber', 64));

  /* hangar */
  ADD(`<svg class="w" id="cabs" style="left:0;top:0" width="3840" height="2160" viewBox="0 0 3840 2160">
    ${cable('cbl', 'M1715 1195 L1330 1195 C1150 1195 1100 640 825 640', BLUE, 14)}
    ${cable('cbT', 'M1715 1195 L1330 1195 C1150 1195 1100 640 825 640', AMB, 14)}
    ${cable('cbG', 'M1715 1195 L1330 1195 C1150 1195 1100 640 825 640', '#9aa3b5', 14)}
    ${cable('cbH1', 'M820 500 C1100 400 1300 560 1540 700', PUR, 12, '30 18')}
    ${cable('cbH2', 'M820 520 C1200 300 1800 300 2060 600', PUR, 12, '30 18')}</svg>`);
  ADD(D('bbW', 'left:360px;top:420px;width:460px;height:300px;opacity:0',
    D('bbBody', 'left:0;top:0;width:460px;height:300px;border-radius:46px;background:linear-gradient(#f58a1f,#d9680a);border:10px solid #a84f06;box-sizing:border-box;box-shadow:0 0 0 0 rgba(255,209,102,0)') +
    D('', 'left:30px;top:200px;width:400px;height:30px;background:repeating-linear-gradient(90deg,#fff 0 40px,#141821 40px 80px)') +
    D('', 'left:36px;top:40px;width:110px;height:110px;border-radius:50%;background:#2f5bd3;color:#fff;font-size:58px;font-weight:800;display:flex;align-items:center;justify-content:center;border:6px solid #fff;box-sizing:border-box', 'Az') +
    D('', 'left:180px;top:60px;width:230px;height:26px;border-radius:13px;background:#ffffff80') + D('', 'left:180px;top:110px;width:170px;height:26px;border-radius:13px;background:#ffffff80')));
  ADD(D('bbs', 'left:560px;top:-200px;width:120px;height:80px;border-radius:20px;background:#e8700a;border:6px solid #a84f06;box-sizing:border-box;opacity:0'));
  ADD(PL('lbBB', 590, 330, 'Application Insights', 'amber', 64) + PL('lbAz', 590, 250, 'Azure', 'blue', 64));
  ADD(D('drawerW', 'left:300px;top:1180px;width:600px;height:320px;border-radius:20px;background:#8a93a6;border:8px solid #5d6472;box-sizing:border-box',
    D('', 'left:20px;top:20px;width:540px;height:110px;border-radius:12px;background:#c9ced8') + D('', 'left:200px;top:62px;width:140px;height:20px;border-radius:10px;background:#5d6472') +
    D('', 'left:20px;top:156px;width:540px;height:110px;border-radius:12px;background:#c9ced8') + D('', 'left:200px;top:198px;width:140px;height:20px;border-radius:10px;background:#5d6472')));
  ADD(PL('lbDr', 600, 1110, 'customEvents', 'navy', 64));
  ADD(crowd('inv', 950, 1300, '#1e7f4f'));
  ADD(D('trm', 'left:1070px;top:1240px;width:220px;height:170px;border-radius:16px;background:#1f2a44;border:8px solid #5d6472;box-sizing:border-box',
    D('', 'left:20px;top:24px;width:120px;height:12px;border-radius:6px;background:#6be3a0') + D('', 'left:20px;top:56px;width:160px;height:12px;border-radius:6px;background:#8cb4ff') + D('', 'left:20px;top:88px;width:90px;height:12px;border-radius:6px;background:#6be3a0')) + D('', 'left:1160px;top:1410px;width:30px;height:90px;background:#8a93a6'));
  ADD(`<svg class="w" id="mag" style="left:880px;top:1320px" width="110" height="110" viewBox="0 0 110 110"><circle cx="40" cy="40" r="28" fill="#dff0ff" stroke="#141821" stroke-width="9"/><path d="M62 62 L100 100" stroke="#141821" stroke-width="12" stroke-linecap="round"/></svg>`);
  const rec = (id, x) => `<div class="cd" id="${id}" style="left:${x}px;top:730px"></div>`;
  ADD(['r0', 'r1', 'r2', 'r3', 'r4', 'r5', 'rF'].map((id, k) => rec(id, [480, 540, 600, 500, 580, 540, 540][k])).join(''));
  const dcard = (id, x, y, lab, col) => `<div class="dm" id="${id}" style="left:${x}px;top:${y}px;border-color:${col}"><span>designMode:</span><em style="color:${col}">${lab}</em></div>`;
  ADD(dcard('cT', 1850, 1690, 'True', AMB) + dcard('cF', 2100, 1420, 'False', BLUE));
  ADD(PL('pStampT', 1300, 990, 'designMode: True', 'amber', 60) + PL('pMarked', 1300, 990, 'marked, not missing', 'green', 60));

  /* security post and gate */
  ADD(admin('adm', 260, 1590));
  ADD(SB('bAdm', 1000, 1640, 'No agent sends telemetry', 60));
  ADD(gate('gt', 1340, 867));
  gsap.set('#gt_bar', { rotation: -85 });
  ADD(PL('lbGate', 1960, 880, 'Data policy', 'red', 64));
  ADD(chip('conn', 540, 1560, 'plug_connected', 'Application Insights in Copilot Studio', '').replace('class="chip "', 'class="chip" ').replace('style="', 'style="width:1040px;height:120px;font-size:46px;'));
  ADD(D('connB', 'left:1250px;top:1490px;opacity:0;padding:6px 26px;border-radius:999px;background:#c4392f;color:#fff;font-size:52px;font-weight:800;', 'Blocked'));
  ADD(D('tgBox', 'left:1560px;top:790px;width:560px;height:100px;border-radius:26px;background:#fff;border:6px solid #2f5bd3;box-sizing:border-box;box-shadow:0 10px 30px rgba(16,24,40,.12);opacity:0;display:flex;align-items:center;gap:26px;padding-left:28px;font-size:50px;font-weight:800', 'Enable logging' +
    '<div class="w" id="tgW" style="left:420px;top:20px;width:110px;height:58px;border-radius:29px;background:#2f5bd3"><i id="tgWK" class="w" style="left:6px;top:6px;width:46px;height:46px;border-radius:50%;background:#fff;transform:translateX(52px)"></i></div>'));
  ADD(`<svg class="w" id="hand" style="left:2300px;top:1100px;opacity:0" width="90" height="116" viewBox="0 0 46 60"><path d="M4 4 L4 48 L16 37 L25 56 L33 52 L24 34 L40 34 Z" fill="#141821" stroke="#fff" stroke-width="3"/></svg>`);
  ADD(PL('lbNot', 1840, 700, 'not an admin control', 'amber', 64) + PL('lbBack', 1840, 700, 'comes back', 'red', 64) + PL('lbEnv', 1700, 620, 'Environment telemetry · Preview<br>traces and spans', 'purple', 60));

  /* cockpit */
  const ptA = (a, R) => [120 + R * Math.cos(a * Math.PI / 180), 130 - R * Math.sin(a * Math.PI / 180)];
  const garc = (a0, a1, col) => { const p = ptA(a0, 90), q = ptA(a1, 90); return `<path d="M${p[0]} ${p[1]} A90 90 0 0 1 ${q[0]} ${q[1]}" fill="none" stroke="${col}" stroke-width="26"/>`; };
  const gauge = (id, cx, cy, label) => `<svg class="w" id="${id}" style="left:${cx - 120}px;top:${cy - 140}px" width="240" height="150" viewBox="0 0 240 150">${garc(180, 120, '#c4392f')}${garc(120, 60, '#d98a00')}${garc(60, 0, '#2fae6a')}<g id="${id}_n"><line x1="120" y1="130" x2="120" y2="52" stroke="#fff" stroke-width="10" stroke-linecap="round"/><circle cx="120" cy="130" r="14" fill="#fff"/></g></svg>` +
    `<div class="w" style="left:${cx - 250}px;top:${cy + 20}px;width:500px;text-align:center;font-size:60px;font-weight:800;color:#fff">${label}</div>`;
  ADD(D('ckW', 'left:0;top:0;opacity:0',
    D('ckGlow', 'left:2546px;top:346px;width:1048px;height:1108px;border-radius:70px;box-shadow:0 0 0 0 rgba(255,209,102,0)') +
    D('', 'left:3000px;top:1440px;width:140px;height:70px;background:#8a93a6') +
    D('', 'left:2560px;top:360px;width:1020px;height:1080px;background:#1f2a44;border-radius:60px;box-shadow:0 30px 80px rgba(16,24,40,.35)') +
    D('', 'left:2590px;top:390px;width:960px;height:1020px;background:#101a33;border-radius:44px') +
    D('', 'left:2640px;top:400px;font-size:84px;font-weight:800;color:#ffd166', 'Monitor') +
    gauge('g0', 2815, 640, 'Sessions') + gauge('g1', 3325, 640, 'Users') + gauge('g2', 2815, 940, 'Avg duration') + gauge('g3', 3325, 940, 'Success rate')));
  ['g0', 'g1', 'g2', 'g3'].forEach((g) => gsap.set('#' + g + '_n', { rotation: -85, svgOrigin: '120 130' }));
  ADD(D('thc', 'left:2580px;top:1170px;width:400px;height:250px;border-radius:28px;background:#1d2742;border:6px solid #5b6b97;box-sizing:border-box',
    D('', 'left:24px;top:16px;font-size:60px;font-weight:800;color:#fff', 'Reactions') +
    D('thE', 'left:24px;top:120px;font-size:60px;font-weight:800;color:#8a93a6;opacity:1', '–') +
    D('thF', 'left:24px;top:116px;font-size:64px;font-weight:800;color:#fff;opacity:0', '👍 1  👎 0')));
  ADD(D('fuel', 'left:3000px;top:1170px;width:560px;height:250px;border-radius:28px;background:#1d2742;border:6px solid #5b6b97;box-sizing:border-box',
    D('', 'left:26px;top:16px;font-size:60px;font-weight:800;color:#ffd166;line-height:1.1', 'Total estimated<br>credits used') +
    D('', 'left:26px;top:170px;width:500px;height:34px;border-radius:17px;background:#3a4a78') + D('', 'left:26px;top:170px;width:330px;height:34px;border-radius:17px;background:linear-gradient(90deg,#ffd166,#f2b705)')));
  document.getElementById('ckW').append(document.getElementById('thc'), document.getElementById('fuel'));
  ADD(SB('thb', 2190, 1250, '👍', 80) + SB('nxAns', 1830, 900, 'VPN fixed', 60, 'blue'));
  ADD(D('thf', 'left:2200px;top:1280px;font-size:90px;opacity:0', '👍'));

  /* finance */
  ADD(crowd('fin', 2850, 1640, '#8a5cd6') + D('', 'left:2700px;top:1800px;width:700px;height:100px;border-radius:14px;background:#c9ced8') + D('', 'left:2730px;top:1900px;width:20px;height:60px;background:#c9ced8') + D('', 'left:3350px;top:1900px;width:20px;height:60px;background:#c9ced8') +
    D('', 'left:3100px;top:1700px;width:140px;height:100px;border-radius:14px;background:#1f2a44;color:#6be3a0;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center', '2,480'));
  ADD(PL('lbFin', 3050, 1580, 'Finance', 'purple', 60));

  /* plane, buildings, pills */
  ADD(`<svg class="w" id="plane" style="left:-500px;top:120px" width="420" height="150" viewBox="0 0 420 150"><path d="M20 80 Q20 60 60 58 L300 58 Q400 60 410 78 Q400 98 300 100 L60 100 Q20 98 20 80 Z" fill="#1f2a44"/><path d="M150 60 L110 10 L170 10 L230 60 Z" fill="#1f2a44"/><path d="M150 98 L110 148 L170 148 L230 98 Z" fill="#1f2a44"/><path d="M40 60 L20 20 L60 20 L80 60 Z" fill="#1f2a44"/></svg>`);
  ADD(D('bBrick', 'left:1520px;top:560px;width:260px;height:340px;border-radius:14px;border:6px solid #8a3a2a;box-sizing:border-box;opacity:0;background:repeating-linear-gradient(0deg,#b4533f 0 28px,#e8dccf 28px 32px),#b4533f') +
    D('bGlass', 'left:2000px;top:460px;width:300px;height:440px;border-radius:18px;border:6px solid #5b8be6;box-sizing:border-box;opacity:0;background:linear-gradient(135deg,#e6f0ff,#bcd4ff 55%,#e6f0ff)', IC('sparkle', 'position:absolute;left:100px;top:40px;width:100px;height:100px;color:#2f5bd3')));
  ADD(PL('lbBoth', 1830, 380, 'Environment telemetry · both harnesses', 'purple', 60) + PL('lbTwo', 1830, 560, 'two tools', 'blue', 84) + PL('lbKeep', 1830, 700, 'keep tests out', 'amber', 84));
  ADD(PL('lbRec', 640, 830, 'records → deep analysis', 'amber', 64) + PL('lbNow', 3070, 1585, 'health now', 'blue', 64));
  ADD(PL('lbMon', 3070, 245, 'Monitor tab · Microsoft Copilot harness', 'blue', 60) + PL('lbAlias', 3070, 120, 'formerly GitHub Copilot harness', 'amber', 60));
  ADD(PL('lbUnch', 1830, 930, 'agent unchanged', 'green', 64) + PL('lbZero', 1830, 700, 'no need to start from zero', 'blue', 84));
  ADD(PL('lbFalse', 1880, 400, 'designMode = False', 'green', 64));
