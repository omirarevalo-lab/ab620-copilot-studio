<script>
  /* L35 · Create a test set (test sets and evaluation). World 3840x2160.
     Shelf (left): binder 170,1000 · cards x 560-1220 y 400-1250 · plank y 1440 · sources shelf 110,1670 (bottom left).
     Team corner: makers 1210 / 1500 (floor y 1280). Hall: Nexo 1700,1000 · desk 1620,1400 · teacher 2480 · wall above Nexo = chart / scoreboard / glossary.
     Floor right: ID gate 2600,1540 · robots 3090-3490 · plaque 2400,1040. Harness district (right): brick 2650,860 · glass tower 3000,560.
     Camera bounds: cx in [960/s, 3840-960/s], cy in [540/s, 2160-540/s]. */
  const BLUE = '#2f5bd3', GRN = '#1e7f4f', RED = '#c4392f', AMB = '#d98a00', PUR = '#8a5cd6', NAVY = '#1f2a44', BRICK = '#b4533f', GB = '#4a5a78';
  const D = (id, st, html) => `<div class="w"${id ? ` id="${id}"` : ''} style="${st}">${html || ''}</div>`;
  const H = (id, st, html) => D(id, st + ';opacity:0', html);
  const PL = (id, x, y, t, c, fs) => pill(id, x, y, t, c).replace('style="', 'style="font-size:' + fs + 'px;');
  const SB = (id, x, y, t, fs, c) => say(id, x, y, t, c).replace('style="', 'style="font-size:' + fs + 'px;');
  const pulse = (sel, t, col) => tl.fromTo(sel, { boxShadow: '0 0 0 0 rgba(217,138,0,0)' }, { boxShadow: `0 0 0 10px ${col || 'rgba(217,138,0,.85)'}`, duration: 0.25, yoyo: true, repeat: 1, immediateRender: false }, t);
  const camAt = (x, y, s, t) => CAM(x, y, s, t, 0.01);
  const UIIN2 = (sel, t) => { ON('#uiBack', t - 0.45, 0.4); tl.fromTo(sel, { opacity: 0, scale: 0.28 }, { opacity: 1, scale: 1, duration: 0.7, ease: 'power3.out' }, t); };
  const UIOUT2 = (sel, t) => { tl.to(sel, { opacity: 0, scale: 0.28, duration: 0.5, ease: 'power3.in' }, t); OFF('#uiBack', t + 0.5, 0.4); };
  const SWX = (a, b, t) => { tl.to(a, { opacity: 0, duration: 0.3 }, t); tl.fromTo(b, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, immediateRender: false }, t); };
  const UP = (sel, t, y) => tl.fromTo(sel, { opacity: 0, y: y || 20 }, { opacity: 1, y: 0, duration: 0.4, immediateRender: false }, t);
  const NAVC = (sel, k, t, n, col) => { for (let i = 0; i < n; i++) { const on = i === k; tl.to(`${sel}_nv${i}`, { backgroundColor: on ? '#ffffff' : '#f3f5f9', color: on ? col : '#5d6472', fontWeight: on ? 700 : 400, borderLeftColor: on ? col : 'rgba(0,0,0,0)', duration: 0.15 }, t); } };
  const SW = (a, b, t) => { tl.to(a, { opacity: 0, duration: 0.25 }, t); tl.fromTo(b, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, immediateRender: false }, t + 0.3); };
  const cell = (w, t, st) => `<span style="display:inline-block;width:${w}px;overflow:hidden;white-space:nowrap;${st || ''}">${t}</span>`;
  const trow = (id, top, h, cells, st) => `<div class="rw" ${id ? `id="${id}" ` : ''}style="top:${top}px;width:1180px;height:${h}px;font-weight:600;font-size:32px;${st || ''}">${cells}</div>`;
  const lbl = (t, c) => `<div style="font-size:44px;font-weight:800;margin-bottom:18px;color:${c || '#141821'}">${t}</div>`;

  /* ═════════ WORLD ═════════ */
  /* hall */
  ADD(agent('nx', 1700, 1000, { folder: '' }));
  ADD(D('deskG', 'left:0;top:0;width:1px;height:1px', D('desk', 'left:1620px;top:1400px;width:560px;height:36px;border-radius:10px;background:#c9ced8') + D('', 'left:1650px;top:1436px;width:18px;height:120px;background:#c9ced8') + D('', 'left:2130px;top:1436px;width:18px;height:120px;background:#c9ced8')));
  ADD(PL('lbNexo', 1880, 1590, 'Nexo · IT agent', 'navy', 60));
  ADD(crowd('tch', 2480, 1280, NAVY));
  const paper = (id, x, y, w, h, title, tint, extra, nobars) => H(id, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${tint};border:6px solid ${NAVY};border-radius:16px;box-shadow:0 20px 40px rgba(16,24,40,.2)`,
    D('', 'left:24px;top:12px;font-size:60px;font-weight:800;white-space:nowrap', title) + (nobars ? '' : [0, 1, 2].map((k) => D('', `left:24px;top:${110 + k * 52}px;width:${[300, 250, 280][k]}px;height:20px;border-radius:10px;background:#c9ced8`)).join('')) + (extra || ''));
  ADD(paper('ppr', 2130, 1090, 420, 300, 'Test set', '#fff', H('ppr_st', 'left:20px;top:150px;font-size:56px;font-weight:800;color:#1e7f4f;border:8px solid #1e7f4f;border-radius:14px;padding:0 12px;transform:rotate(-8deg);white-space:nowrap;background:#ffffffee', 'SAME EXAM')));
  ADD(paper('ppq1', 1730, 1130, 420, 300, 'Other set', '#fff3d6') + paper('ppq2', 1730, 1130, 420, 300, 'New set', '#e6ecfb'));
  ADD(H('cal', 'left:1560px;top:520px;width:300px;height:310px;background:#fff;border:6px solid ' + NAVY + ';border-radius:20px;overflow:hidden;box-shadow:0 20px 40px rgba(16,24,40,.2)',
    D('', 'left:0;top:0;width:288px;height:100px;background:#c4392f') +
    D('calM', 'left:0;top:116px;width:288px;text-align:center;font-size:72px;line-height:1.05;font-weight:800', 'MON<br>28') + H('calF', 'left:0;top:116px;width:288px;text-align:center;font-size:72px;line-height:1.05;font-weight:800;color:#c4392f', 'FRI<br>25')));
  ADD(H('note', 'left:1560px;top:880px;width:400px;height:180px;background:#ffe27a;border-radius:12px;box-shadow:0 14px 30px rgba(16,24,40,.25);display:flex;align-items:center;justify-content:center;text-align:center;font-size:56px;font-weight:800;line-height:1.1;color:#7a4d00', 'new<br>instructions'));
  ADD(PL('lbMon', 1700, 400, 'Monday', 'navy', 60));
  /* team corner */
  ADD(crowd('mk1', 1180, 1280, '#2f5bd3') + crowd('mk2', 1470, 1280, '#4b6fe0'));
  ADD(SB('bW', 1225, 1090, 'worse!', 64, 'red') + SB('bB', 1515, 1090, 'better!', 64, 'green') + SB('bW2', 1225, 1090, 'worse!', 64, 'red') + SB('bB2', 1515, 1090, 'better!', 64, 'green'));
  ADD(PL('lbGuess', 1370, 980, 'guessing', 'amber', 64) + PL('lbMeas', 2330, 960, "measure, don't guess", 'blue', 64));
  /* Monday numbers chart (wall above Nexo) */
  const HR = [0.5, 0.85, 0.4, 0.75, 0.6, 0.45, 0.8, 0.65];
  const chartHTML = (p, x, y, W, Hh, n, title, fs, showQ) => {
    const bw = Math.floor((W - 60 - (n - 1) * 16) / n), mx = Hh - 140;
    let h = `<div class="w" id="${p}" style="left:${x}px;top:${y}px;width:${W}px;height:${Hh}px;background:#fff;border:8px solid ${NAVY};border-radius:28px;box-sizing:border-box;opacity:0">
      <div class="w" style="left:0;top:14px;width:${W - 16}px;text-align:center;font-size:${fs}px;font-weight:800">${title}</div>`;
    for (let k = 0; k < n; k++) {
      const bh = Math.round(mx * HR[k % 8]);
      h += `<div class="w" id="${p}_b${k}" style="left:${22 + k * (bw + 16)}px;top:${Hh - 24 - bh}px;width:${bw}px;height:${bh}px;border-radius:8px;background:#8a93a6"></div>`;
      if (showQ) h += `<div class="w" id="${p}_q${k}" style="left:${22 + k * (bw + 16)}px;top:${Hh - 24 - bh - 72}px;width:${bw}px;text-align:center;font-size:60px;font-weight:800;color:#5d6472;opacity:0">?</div>`;
    }
    return h + '</div>';
  };
  ADD(chartHTML('bd', 1500, 400, 720, 420, 8, 'Monday numbers', 56, true));
  ADD(H('bdX', 'left:1480px;top:604px;width:760px;height:14px;background:#c4392f;border-radius:7px;transform:rotate(-24deg)'));
  ADD(PL('lbNoBase', 1860, 860, 'no before measurement', 'red', 60));
  /* scoreboard (scene 15) */
  ADD(H('scb', 'left:1480px;top:300px;width:1000px;height:560px;background:#fff;border:10px solid ' + NAVY + ';border-radius:36px;box-shadow:0 30px 70px rgba(16,24,40,.25)',
    D('', 'left:0;top:20px;width:980px;text-align:center;font-size:64px;font-weight:800;color:' + NAVY, 'Scoreboard') + D('', 'left:488px;top:110px;width:6px;height:420px;background:#c9ced8') +
    D('', 'left:0;top:120px;width:488px;text-align:center;font-size:64px;font-weight:800;color:#5d6472', 'Before') + D('', 'left:494px;top:120px;width:488px;text-align:center;font-size:64px;font-weight:800;color:' + GRN, 'After') +
    D('', 'left:84px;top:210px;width:320px;text-align:center;font-size:56px;font-weight:700;border:4px solid #c9ced8;border-radius:999px;padding:4px 0', 'Test set') + D('', 'left:578px;top:210px;width:320px;text-align:center;font-size:56px;font-weight:700;border:4px solid #c9ced8;border-radius:999px;padding:4px 0', 'Test set') +
    D('', 'left:0;top:310px;width:488px;text-align:center;font-size:170px;font-weight:800;color:#5d6472', '74%') + D('scbA', 'left:494px;top:310px;width:488px;text-align:center;font-size:170px;font-weight:800;color:' + GRN, '86%')));

  /* case shelf */
  ADD(D('plank', 'left:200px;top:1440px;width:1100px;height:36px;border-radius:10px;background:#c9ced8'));
  ADD(D('bndr', 'left:440px;top:1000px;width:300px;height:440px;border-radius:18px;background:#1f2a44;border:8px solid #141b2d',
    [0, 1, 2, 3].map((k) => D('', `left:-14px;top:${50 + k * 100}px;width:40px;height:22px;border-radius:11px;background:#8a93a6`)).join('') + D('', 'left:50px;top:150px;width:200px;height:110px;border-radius:12px;background:#fff;color:#141821;font-size:56px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1', 'Test<br>set')));
  const card = (id, x, y, w, h, t, bc, bg) => H(id, `left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${bg || '#fff'};border:6px solid ${bc};border-radius:20px;box-shadow:0 10px 30px rgba(16,24,40,.12);display:flex;align-items:center;padding:0 24px;font-size:40px;font-weight:700;line-height:1.2`, t);
  ADD(card('cq', 560, 400, 620, 150, `<b style="color:${BLUE};margin-right:16px">Q</b>Where do I reset my password?`, BLUE));
  ADD(card('ca', 600, 580, 620, 150, `<b style="color:${GRN};margin-right:16px">A</b>Use the self-service reset page`, GRN));
  ADD(H('stp', 'left:850px;top:536px;width:100px;height:56px;border-radius:10px;background:#8a93a6'));
  ADD(card('cv0', 560, 880, 440, 88, 'I need a laptop', BLUE) + card('cv1', 700, 975, 440, 88, 'Which model?', GB, '#eef1f7') + card('cv2', 560, 1070, 440, 88, 'The 14-inch', BLUE) + card('cv3', 560, 1165, 440, 88, 'When is delivery?', BLUE));
  ADD(PL('lbFacts', 890, 770, 'facts', 'blue', 60) + PL('lbCtx', 830, 1290, 'context across turns', 'blue', 56));
  ADD(PL('lbCount', 380, 910, '40 cases', 'green', 60));
  /* scene 3 s4: ticket pile, answer rows, 40 cards */
  ADD(H('pile', 'left:560px;top:1150px;width:300px;height:250px', [0, 1, 2, 3].map((k) => D('', `left:${k * 14}px;top:${k * 18}px;width:240px;height:86px;border-radius:14px;background:#fff;border:5px solid ${AMB};display:flex;align-items:center;gap:12px;padding-left:16px;font-size:36px;font-weight:700`, IC('ticket_diagonal', 'width:50px;height:50px;color:' + AMB) + 'ticket')).join('')));
  ADD(PL('lbForty', 860, 1060, '40 real questions', 'brick', 60));
  ADD([0, 1, 2, 3].map((k) => H('wq' + k, `left:560px;top:${430 + k * 120}px;width:300px;height:76px;border-radius:14px;background:#fff;border:5px solid ${BLUE}`, D('', 'left:20px;top:26px;width:200px;height:18px;border-radius:9px;background:#c9d8f7')) + H('wa' + k, `left:890px;top:${446 + k * 120}px;width:260px;height:44px;border-radius:22px;background:${GRN};transform-origin:0 50%`)).join(''));
  ADD(`<svg class="w" id="hand" style="left:1100px;top:380px;opacity:0" width="90" height="116" viewBox="0 0 46 60"><path d="M4 4 L4 48 L16 37 L25 56 L33 52 L24 34 L40 34 Z" fill="#141821" stroke="#fff" stroke-width="3"/></svg>`);
  ADD(Array.from({ length: 40 }, (_, k) => H('sw' + k, `left:${600 + (k % 8) * 38}px;top:${1170 + Math.floor(k / 8) * 10}px;width:62px;height:44px;background:#fff;border:5px solid ${BLUE};border-radius:8px`)).join(''));
  /* answer key folder + method chips (scene 4) */
  ADD(H('kf', 'left:1450px;top:1060px;width:260px;height:210px',
    D('', 'left:0;top:0;width:260px;height:210px;border-radius:18px;background:#a82a22') +
    D('', 'left:0;top:4px;width:260px;text-align:center;color:#fff;font-size:44px;font-weight:800', 'Answer key') +
    D('kf_in', 'left:24px;top:56px;width:212px;height:112px;background:#fff;border-radius:8px;opacity:0;font-size:44px;font-weight:800;color:#8a93a6;text-align:center;padding-top:30px;line-height:1.1', 'empty') +
    D('kf_fr', 'left:0;top:56px;width:260px;height:154px;border-radius:18px;background:#c4392f;transform-origin:50% 100%')));
  const mchip = (id, y, icon, t, cls) => chip(id, 1480, y, icon, t, cls).replace('style="', 'style="width:640px;font-size:48px;');
  ADD(mchip('m0', 380, 'chat', 'Compare meaning', '') + mchip('m1', 540, 'text_t', 'Text similarity', '') + mchip('m2', 700, 'flag', 'Exact match', '') + mchip('m3', 880, 'sparkle', 'General quality', 'green'));
  ADD(`<svg class="w" style="left:0;top:0" width="3840" height="2160" viewBox="0 0 3840 2160"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="${BLUE}"/></marker></defs>
    ${[440, 600, 760].map((y, k) => `<path id="ar${k}" d="M1480 ${y} C1370 ${y} 1370 1165 1440 1165" fill="none" stroke="${BLUE}" stroke-width="10" marker-end="url(#ah)" opacity="0"/>`).join('')}</svg>`);
  ADD(PL('lbLoves', 760, 800, 'the exam loves this', 'amber', 64) + PL('lbNothing', 2500, 560, 'nothing to compare', 'grey', 60) + PL('lbNoKey', 2500, 880, 'grades without a key', 'green', 60));
  /* scene 6 s2-s3: sources shelf */
  ADD(H('srcShelf', 'left:110px;top:1670px;width:1500px;height:330px;border-radius:26px;background:#d9dee8'));
  const tile = (id, x, w, icon, t) => H(id, `left:${x}px;top:1700px;width:${w}px;text-align:center`, `<div id="${id}_d" style="width:140px;height:140px;margin:0 auto 10px;border-radius:36px;background:#fff;border:6px solid #8a93a6;display:flex;align-items:center;justify-content:center;color:#8a93a6">${IC(icon, 'width:80px;height:80px')}</div><b style="font-size:56px">${t}</b>`);
  ADD(tile('t0', 140, 190, 'text_t', 'Text') + tile('t1', 360, 190, 'document_text', 'Word') + tile('t2', 580, 210, 'table', 'Excel') + tile('t3', 820, 170, 'document_search', 'PDF') + tile('t4', 1020, 330, 'cloud', 'SharePoint'));
  ADD(H('tf', 'left:1400px;top:1700px;width:200px;text-align:center', `<div style="width:140px;height:140px;margin:0 auto 10px;border-radius:36px;background:#fff;border:6px solid #8a93a6;display:flex;align-items:center;justify-content:center;color:#8a93a6">${IC('building', 'width:80px;height:80px')}</div><b style="font-size:56px">Folder</b>`) + H('tfX', 'left:1380px;top:1760px;width:240px;height:14px;background:#c4392f;border-radius:7px;transform:rotate(-30deg)'));
  ADD(PL('lbMb', 780, 1600, '≤ 5 MB each', 'brick', 60) + PL('lbNoF', 1500, 1600, 'no folders', 'red', 60) + PL('lbSrc', 1100, 1010, 'tests its sources, not only its wording', 'brick', 56));
  ADD(`<svg class="w" style="left:0;top:0" width="3840" height="2160" viewBox="0 0 3840 2160">${[235, 455, 685, 905, 1185].map((x, k) => `<path id="sl${k}" d="M${x} 1690 C${x} 1560 830 1580 830 1470" fill="none" stroke="${BLUE}" stroke-width="10" opacity="0"/>`).join('')}</svg>`);
  ADD(card('nc0', 540, 1190, 600, 80, 'Reset a locked account?', BLUE) + card('nc1', 540, 1275, 600, 80, 'Pair a new laptop?', BLUE) + card('nc2', 540, 1360, 600, 76, 'Request software?', BLUE));
  /* scene 7: real traffic */
  ADD(crowd('e0', 780, 1280, '#8a5cd6') + crowd('e1', 900, 1280, '#d98a00') + crowd('e2', 1020, 1280, '#1e7f4f'));
  ADD(['Reset my password', 'VPN is down', 'New laptop?'].map((t, k) => H('rb' + k, `left:${825 + k * 120}px;top:1080px;width:2px;height:2px`, SB('rb' + k + 's', 0, 0, t, 60))).join(''));
  ADD(paper('pp2b', 1500, 830, 1100, 560, 'Monday morning', '#fff', '', true));
  ADD(['Reset my password', 'VPN is down', 'New laptop?'].map((t, k) => H('mq' + k, `left:1540px;top:${950 + k * 140}px;width:1020px;height:110px;background:#e6ecfb;border:6px solid ${BLUE};border-radius:20px;display:flex;align-items:center;padding-left:30px;font-size:56px;font-weight:700`, t)).join(''));
  ADD(SB('thought', 1250, 700, "makers' imagination", 60) + H('thX', 'left:900px;top:690px;width:700px;height:14px;background:#c4392f;border-radius:7px;transform:rotate(-8deg)'));
  ADD(PL('lbReal', 2050, 760, 'real traffic · coverage over polish', 'brick', 64));
  /* scene 8: ID door */
  ADD(gate('gt', 2600, 1540)); gsap.set('#gt_bar', { rotation: -85 });
  ADD(H('plaque', 'left:2400px;top:1040px;width:900px;height:430px;border-radius:30px;background:#fff;border:8px solid ' + GB + ';box-shadow:0 20px 50px rgba(16,24,40,.2)', D('', 'left:0;top:18px;width:884px;text-align:center;font-size:54px;font-weight:800;color:' + GB, 'Who can take the exam')));
  ADD(chip('ch0', 2440, 1150, 'checkmark_circle', 'No authentication', 'green').replace('style="', 'style="width:820px;height:110px;font-size:48px;'));
