<!doctype html>
<html lang="en">

<link rel="stylesheet" href="style.css" />
<style>
  #stage .uw { top: 130px; height: 760px; }
  #stage .uw .nav div { font-size: 30px; padding: 16px 28px; }
  #stage .uw .fld small { font-size: 30px; } #stage .uw .fld { font-size: 34px; }
  #stage .uw .btn { font-size: 30px; }
  #stage #uiBack { background: #eef1f7; }
  #stage .uw.sd .bar { background: #4a5a78; } #stage .uw.pu .bar { background: #4b2a8a; }
  #stage .uw.sd .nav div.on { color: #4a5a78; border-left-color: #4a5a78; }
  #stage .uw.pu .nav div.on { color: #8a5cd6; border-left-color: #8a5cd6; }
  #stage .uw.sd .btn.pri { background: #4a5a78; border-color: #4a5a78; }
  #stage .uw.pu .btn.pri { background: #8a5cd6; border-color: #8a5cd6; }
  #stage #uiE .nav { display: none; } #stage #uiE .main { left: 0; }
  .tag.brick { color: #a3402e; border: 3px solid #b4533f; }
  .tag.grey { color: #5d6472; border: 3px solid #8a93a6; }
  .tag.teal { color: #0e8f8f; border: 3px solid #0e8f8f; }
  .sb.red { border-color: #c4392f; } .sb.red:after { border-top-color: #c4392f; }
  .ly { position: absolute; left: 40px; right: 40px; top: 10px; bottom: 0; opacity: 0; }
  .rw { position: absolute; left: 0; display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 700; border-bottom: 2px solid #e2e5eb; }
  .cp { position: absolute; display: inline-flex; align-items: center; gap: 10px; border-radius: 999px; padding: 6px 20px; font-size: 30px; font-weight: 700; background: #fff; border: 3px solid #2f5bd3; color: #2f5bd3; opacity: 0; white-space: nowrap; }
  .pnl { position: absolute; box-sizing: border-box; border: 3px solid #e2e5eb; border-radius: 20px; background: #fafbfd; }
  .ins { position: absolute; box-sizing: border-box; background: #fff; border: 6px solid #4a5a78; border-radius: 28px; box-shadow: 0 30px 80px rgba(16,24,40,.25); opacity: 0; color: #141821; font-size: 38px; font-weight: 700; }
  .ins .t { position: absolute; white-space: nowrap; font-weight: 800; }
  .ins .p { position: absolute; box-sizing: border-box; border-radius: 16px; border: 4px solid #c9ced8; background: #fff; display: flex; align-items: center; padding: 0 20px; font-weight: 700; white-space: nowrap; }
  .ins .w { position: absolute; }
  .leg { position: absolute; display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 999px; padding: 6px 26px; font-size: 36px; font-weight: 800; white-space: nowrap; opacity: 0; box-shadow: 0 10px 30px rgba(16,24,40,.15); }
  .pcard { position: absolute; box-sizing: border-box; background: #fff; border: 6px solid #1f2a44; border-radius: 20px; box-shadow: 0 20px 40px rgba(16,24,40,.2); opacity: 0; font-weight: 800; white-space: nowrap; }
  .mono { font-family: Consolas, 'Courier New', monospace; }
  .rtx { position: absolute; font-size: 64px; font-weight: 800; line-height: 1.18; white-space: nowrap; }
  .rtx .dt { display: inline-block; width: 58px; height: 58px; border-radius: 50%; color: #fff; text-align: center; line-height: 58px; font-size: 40px; margin-right: 18px; }
  .rr { font-size: 32px; font-weight: 800; white-space: nowrap; } .rr .dt { display: inline-block; width: 44px; height: 44px; border-radius: 50%; color: #fff; text-align: center; line-height: 44px; font-size: 30px; margin-right: 12px; }
  #exD .xo b.k { background: #efe7fb; color: #8a5cd6; } #exD .xl { color: #c9b4f0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
<section class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="2">
<div id="stage"></div>
</section>
<audio id="narr" src="narration.mp3" data-start="0" data-duration="{{DURATION}}" data-track-index="1" data-volume="1"></audio>
</div>

<!-- @world -->
<script>
  /* L36 · Evaluation methods. World 3840x2160 "Contoso grading hall".
     Hall: intake x 250-900 (Nexo 540,1230 · binder 250,1290 · folder 250,1000 · cards 250,470/740) · belt y 1850 · desk columns x 1100/1590/2080/2570 · row A table y 800, row B table y 1430.
     Row A: General quality, Compare meaning, Text similarity, Exact match. Row B (left to right): Custom, Content safety, Tool use, Keyword match. Invalid bin 2830-3030.
     Harness district (scenes 12-15): glass tower x 3070-3600 y 330-1700. Detail text lives in screen-space insets (.ins) at the right or left half of the frame. */
  const BLUE = '#2f5bd3', GRN = '#1e7f4f', RED = '#c4392f', AMB = '#d98a00', PUR = '#8a5cd6', NAVY = '#1f2a44', BRICK = '#b4533f', GB = '#4a5a78', TEAL = '#0e8f8f';
  const D = (id, st, html) => `<div class="w"${id ? ` id="${id}"` : ''} style="${st}">${html || ''}</div>`;
  const H = (id, st, html) => D(id, st + ';opacity:0', html);
  const PL = (id, x, y, t, c, fs) => pill(id, x, y, t, c).replace('style="', 'style="font-size:' + (fs || 60) + 'px;');
  const PR = (id, x, y, t, c, fs) => PL(id, x, y, t, c, fs).replace('style="', 'style="transform:translateX(-100%);');
  const SB = (id, x, y, t, fs, c) => say(id, x, y, t, c).replace('style="', 'style="font-size:' + (fs || 60) + 'px;');
  const pulse = (sel, t, col) => tl.fromTo(sel, { boxShadow: '0 0 0 0 rgba(217,138,0,0)' }, { boxShadow: `0 0 0 10px ${col || 'rgba(217,138,0,.85)'}`, duration: 0.25, yoyo: true, repeat: 1, immediateRender: false }, t);
  const camAt = (x, y, s, t) => CAM(x, y, s, t, 0.01);
  const UIIN2 = (sel, t) => { ON('#uiBack', t - 0.45, 0.4); tl.fromTo(sel, { opacity: 0, scale: 0.28 }, { opacity: 1, scale: 1, duration: 0.7, ease: 'power3.out' }, t); };
  const UIOUT2 = (sel, t) => { tl.to(sel, { opacity: 0, scale: 0.28, duration: 0.5, ease: 'power3.in' }, t); OFF('#uiBack', t + 0.5, 0.4); };
  const SWX = (a, b, t) => { tl.to(a, { opacity: 0, duration: 0.3 }, t); tl.fromTo(b, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, immediateRender: false }, t + 0.3); };
  const UP = (sel, t, y) => tl.fromTo(sel, { opacity: 0, y: y || 20 }, { opacity: 1, y: 0, duration: 0.4, immediateRender: false }, t);
  const NAVC = (sel, k, t, n, col) => { for (let i = 0; i < n; i++) { const on = i === k; tl.to(`${sel}_nv${i}`, { backgroundColor: on ? '#ffffff' : '#f3f5f9', color: on ? col : '#5d6472', fontWeight: on ? 700 : 400, borderLeftColor: on ? col : 'rgba(0,0,0,0)', duration: 0.15 }, t); } };
  const cell = (w, t, st) => `<span style="display:inline-block;width:${w}px;overflow:hidden;white-space:nowrap;${st || ''}">${t}</span>`;
  const trow = (id, top, h, cells, st) => `<div class="rw" ${id ? `id="${id}" ` : ''}style="top:${top}px;width:1180px;height:${h}px;font-weight:600;font-size:34px;${st || ''}">${cells}</div>`;
  const lbl = (t, c) => `<div style="font-size:44px;font-weight:800;margin-bottom:18px;color:${c || '#141821'}">${t}</div>`;
  const fcl = (t) => `<span style="color:${RED}">${t}</span>`;

  /* ═════════ HALL ═════════ */
  const COLS = [1100, 1590, 2080, 2570], YA = 800, YB = 1430;
  const GR = {
    gq: { c: 0, r: 0, n: 'General<br>quality', col: PUR, sc: 1 }, cm: { c: 1, r: 0, n: 'Compare<br>meaning', col: BLUE, sc: 1 },
    ts: { c: 2, r: 0, n: 'Text<br>similarity', col: TEAL, sc: 1 }, em: { c: 3, r: 0, n: 'Exact<br>match', col: RED, sc: 0 },
    cu: { c: 0, r: 1, n: 'Custom', col: GRN, sc: 0 }, cs: { c: 1, r: 1, n: 'Content<br>safety', col: AMB, sc: 0 },
    tu: { c: 2, r: 1, n: 'Tool use', col: GB, sc: 0 }, kw: { c: 3, r: 1, n: 'Keyword<br>match', col: BRICK, sc: 0 } };
  const KS = Object.keys(GR), gx = (k) => COLS[GR[k].c], gy = (k) => (GR[k].r ? YB : YA);
  const dialSvg = (s, c) => `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><path d="M12 72 A40 40 0 0 1 88 72" fill="none" stroke="${c || TEAL}" stroke-width="12" stroke-linecap="round"/><path d="M50 72 L68 42" stroke="${c || TEAL}" stroke-width="9" stroke-linecap="round"/><circle cx="50" cy="72" r="9" fill="${c || TEAL}"/></svg>`;
  const lampsSvg = (s) => `<svg width="${s * 1.7}" height="${s}" viewBox="0 0 170 100"><circle cx="40" cy="50" r="34" fill="${GRN}"/><circle cx="130" cy="50" r="34" fill="${RED}"/></svg>`;
  const robot = (w) => miniBot(w);
  const EXTRA = {
    cm: () => D('lens', `left:${COLS[1] - 10}px;top:${YA - 190}px;width:150px;height:150px`, `<svg width="150" height="150" viewBox="0 0 150 150"><circle cx="62" cy="62" r="46" fill="rgba(47,91,211,.12)" stroke="${BLUE}" stroke-width="14"/><path d="M96 96 L140 140" stroke="${BLUE}" stroke-width="16" stroke-linecap="round"/></svg>`) + H('sf_cm', `left:${COLS[1] + 140}px;top:${YA - 70}px;width:80px;height:66px;border-radius:12px;background:#a82a22`),
    gq: () => D('gqSw', `left:${COLS[0] + 40}px;top:${YA - 100}px;width:130px;height:68px;border-radius:34px;background:#8a93a6;`, '<div id="gqSwT" class="w" style="left:0;top:0;width:130px;height:68px;border-radius:34px;background:#1e7f4f;opacity:0;color:#fff;font-size:44px;font-weight:800;text-align:center;line-height:68px">ON</div>'),
    ts: () => H('sf_ts', `left:${COLS[2] + 140}px;top:${YA - 70}px;width:80px;height:66px;border-radius:12px;background:#a82a22`),
    cu: () => D('rb_cu', `left:${COLS[0] + 40}px;top:${YB - 210}px;width:130px;height:180px;border-radius:10px;background:#fff;border:5px solid #8a93a6`, [0, 1, 2, 3].map((k) => D('', `left:18px;top:${24 + k * 36}px;width:80px;height:12px;border-radius:6px;background:#e2e5eb`)).join('')) };
  const deskH = (k) => { const g = GR[k], x = gx(k), y = gy(k);
    return D('d_' + k, 'left:0;top:0;width:1px;height:1px',
      D('', `left:${x - 210}px;top:${y}px;width:420px;height:30px;border-radius:10px;background:#c9ced8`) + D('', `left:${x - 170}px;top:${y + 30}px;width:18px;height:60px;background:#c9ced8`) + D('', `left:${x + 152}px;top:${y + 30}px;width:18px;height:60px;background:#c9ced8`) +
      (k === 'gq' ? D('g_gq', `left:${x - 210}px;top:${y - 175}px`, robot(160)) : D('g_' + k, `left:${x - 200}px;top:${y - 323}px`, person(g.col).replace('width="90" height="200"', 'width="150" height="333"'))) +
      H('bd_' + k, `left:${x + 110}px;top:${y - 250}px;width:110px;height:100px`, g.sc ? dialSvg(100) :
        `<div id="lg_${k}" class="w" style="left:6px;top:28px;width:44px;height:44px;border-radius:50%;background:${GRN};opacity:.3"></div><div id="lr_${k}" class="w" style="left:60px;top:28px;width:44px;height:44px;border-radius:50%;background:${RED};opacity:.3"></div>`) + (EXTRA[k] ? EXTRA[k]() : ''));
  };
  /* intake and belt */
  const hallHTML = [
    D('belt', 'left:300px;top:1850px;width:2540px;height:44px;border-radius:22px;background:#8a93a6') + D('', 'left:300px;top:1862px;width:2540px;height:8px;background:repeating-linear-gradient(90deg,#6c7587 0 30px,#8a93a6 30px 60px)'),
    D('nxG', 'left:0;top:0;width:1px;height:1px', agent('nx', 540, 1230, { folder: '' })),
    D('furn', 'left:0;top:0;width:1px;height:1px', D('bndr', 'left:250px;top:1290px;width:220px;height:320px;border-radius:18px;background:#1f2a44;border:8px solid #141b2d', [0, 1, 2].map((k) => D('', `left:-14px;top:${40 + k * 80}px;width:34px;height:20px;border-radius:10px;background:#8a93a6`)).join('') + D('', 'left:24px;top:100px;width:150px;height:100px;border-radius:12px;background:#fff;color:#141821;font-size:46px;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1', 'Test<br>set')) +
    D('kf', 'left:250px;top:1000px;width:260px;height:210px', D('', 'left:0;top:0;width:260px;height:210px;border-radius:18px;background:#a82a22') + D('', 'left:0;top:60px;width:260px;text-align:center;color:#fff;font-size:44px;font-weight:800;line-height:1.1', 'Answer<br>key'))),
    KS.map(deskH).join(''),
  ].join('');
  ADD(D('hallAll', 'left:0;top:0;width:1px;height:1px', hallHTML));
  KS.forEach((k) => ADD(PL('pl_' + k, gx(k), gy(k) + 80, GR[k].n, 'navy', 60).replace('class="tag navy"', 'class="tag navy pl"')));
  /* bin */
  ADD(H('bin', 'left:2810px;top:1470px;width:200px;height:220px;border-radius:0 0 28px 28px;border:8px solid #8a93a6;border-top:none;background:#e2e5eb') + PL('lbInv', 2910, 1330, 'Invalid', 'grey', 80));
  /* intake cards and bubbles */
  const pcard = (id, x, y, w, h, st, html) => `<div class="pcard" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;${st || ''}">${html}</div>`;
  ADD(pcard('kc', 250, 470, 600, 230, 'border-color:#c4392f;', '<div class="w" style="left:30px;top:14px;font-size:60px;color:#5d6472">Expected</div><div class="w mono" style="left:30px;top:86px;font-size:104px;color:#c4392f">CT-4471</div>'));
  ADD(pcard('nc', 250, 740, 600, 230, 'transform-origin:0 0;', '<div class="w" style="left:30px;top:14px;font-size:60px;color:#5d6472">Nexo</div><div class="w mono" style="left:30px;top:86px;font-size:104px;color:#141821">CT-44<span style="color:#c4392f">17</span></div>'));
  ADD(SB('bTick', 440, 700, 'Where is my<br>order?', 60) + PL('lbNexo', 790, 1130, 'Nexo · IT agent', 'navy', 60));
  ADD(PL('tgTest', 410, 1650, 'test set ✓', 'green', 60));
  ADD(H('stP', `left:${COLS[1] + 390}px;top:${YA - 560}px;padding:0 24px;font-size:110px;font-weight:800;color:${GRN};border:12px solid ${GRN};border-radius:24px;transform:rotate(-8deg);background:#ffffffee`, 'PASS'));
  ADD(PL('tg5', COLS[1], YA + 265, 'graded the meaning', 'amber', 60) + PL('tg7', COLS[1], YA + 265, 'grading rule ✗', 'red', 60));
  /* scene 1 easel, chips, lines */
  ADD(pcard('pEx', 300, 170, 520, 330, 'border-color:#4a5a78;', '<div class="w" style="left:36px;top:20px;font-size:76px;color:#141821">the exam</div>' + [0, 1, 2].map((k) => D('', `left:36px;top:${150 + k * 48}px;width:${[380, 330, 360][k]}px;height:18px;border-radius:9px;background:#c9ced8`)).join('')));
  const qchip = (id, x, y, icon, t) => chip(id, x, y, icon, t, '').replace('style="', 'style="width:480px;height:100px;font-size:56px;');
  ADD(qchip('qc0', 900, 150, 'chat', 'meaning') + qchip('qc1', 1420, 150, 'flag', 'exact words') + qchip('qc2', 900, 270, 'wrench', 'a tool') + qchip('qc3', 1420, 270, 'shield_checkmark', 'safety'));
  ADD(`<svg class="w" style="left:0;top:0" width="3840" height="2160" viewBox="0 0 3840 2160">
    <path id="ln0" d="M1900 200 C2200 200 2450 300 2570 470" fill="none" stroke="${BLUE}" stroke-width="10" opacity="0"/>
    <path id="lm0" d="M820 420 C1000 430 1300 440 ${COLS[1]} 470" fill="none" stroke="${RED}" stroke-width="8" opacity="0"/>
    <path id="lm1" d="M820 400 C1100 380 1700 400 ${COLS[2]} 470" fill="none" stroke="${GB}" stroke-width="8" opacity="0"/>
    <path id="lm2" d="M820 380 C1300 330 2100 340 ${COLS[3]} 470" fill="none" stroke="${GB}" stroke-width="8" opacity="0"/></svg>`);
  ADD(PL('tgSev', 1300, 250, 'several methods per test set', 'amber', 60) + PL('tgMis', 2100, 400, 'misleading', 'red', 60));
  /* scene 2 */
  ADD(PL('tgOn', COLS[0], YA + 265, 'on every test set', 'green', 60) + PL('tgDef', COLS[0], YA + 265, 'default', 'blue', 60));
  ADD(H('kf2', 'left:640px;top:690px;width:260px;height:210px', D('', 'left:0;top:0;width:260px;height:210px;border-radius:18px;background:#a82a22') + D('', 'left:0;top:60px;width:260px;text-align:center;color:#fff;font-size:44px;font-weight:800;line-height:1.1', 'Answer<br>key')));
  /* scene 3 tags */
  ADD(PL('tg3a', (COLS[1] + COLS[2]) / 2, YA + 265, 'need the answer key', 'red', 60) + PL('tg3b', 1750, YA + 265, 'policy in your<br>own words → meaning', 'blue', 60).replace('style="', 'style="border-radius:50px;') + PL('tg3c', 2560, YA + 265, 'phrasing matters<br>→ similarity', 'teal', 60).replace('style="', 'style="border-radius:50px;'));
  ADD(PL('tg4', COLS[3] - 450, YA + 150, 'no score · Pass / Fail', 'amber', 60));
  /* scene 6-9 tags */
  ADD(PL('tg6', COLS[2], YB + 270, 'Pass / Fail · no score', 'amber', 60) + PL('tg7s', COLS[1], YB + 270, 'Pass / Fail', 'amber', 60) + PL('tg8', COLS[0], YB + 270, 'write your own', 'green', 60));
  ADD(SB('bUser', 450, 520, 'What does my<br>manager earn?', 60, 'blue') + SB('bNx', 640, 900, "I can't share<br>salary information.", 60, 'green') + PL('tgRight', 430, 800, 'right answer ✓', 'green', 60));
  ADD(pcard('pRef', 250, 1000, 520, 140, 'transform-origin:0 0;', '<div class="w" style="left:30px;top:30px;font-size:56px">Salary refusal</div>'));
  ADD(PL('tgFlag', 493, YA - 102, 'correct refusal flagged', 'amber', 60) + PL('tgCu', COLS[0], YB + 270, 'expected refusals → Custom', 'green', 60));
  ADD(H('stC', 'left:0;top:0;padding:0 22px;font-size:54px;font-weight:800;color:#1e7f4f;border:8px solid #1e7f4f;border-radius:16px;transform:rotate(-4deg);background:#ffffffee;white-space:nowrap', 'Compliant → Pass'));
  /* scene 11: papers */
  const mp = (id, x, y, w, t) => pcard(id, x, y, w, 120, '', `<div class="w" style="left:24px;top:26px;font-size:52px;color:#5d6472">${t}</div>`);
  ADD(mp('mp0', COLS[1] - 250, YA + 265, 500, 'no answer key') + mp('mp1', COLS[2] - 220, YB + 270, 440, 'no keywords') + mp('mp2', COLS[3] - 260, YB + 270, 520, 'no expected tool'));
  /* ═════════ HARNESS DISTRICT ═════════ */
  const TX = 3070;
  ADD(D('dist', 'left:0;top:0;width:1px;height:1px;opacity:0',
    D('glassT', `left:${TX}px;top:380px;width:530px;height:1270px;border-radius:24px;border:6px solid #5b8be6;background:linear-gradient(135deg,#efe7fb,#c9b4f0 55%,#efe7fb)`) +
    D('', `left:${TX + 20}px;top:1000px;width:490px;height:28px;border-radius:10px;background:#8a5cd6`) +
    D('g_pu', `left:${TX + 40}px;top:677px`, person(PUR).replace('width="90" height="200"', 'width="150" height="333"')) +
    D('', `left:${TX + 260}px;top:790px;width:60px;height:60px;border-radius:50%;background:${GRN}`) + D('', `left:${TX + 260}px;top:890px;width:60px;height:60px;border-radius:50%;background:${RED}`) +
    D('', `left:${TX + 340}px;top:786px;font-size:60px;font-weight:800;color:${GRN}`, 'Pass') + D('', `left:${TX + 340}px;top:886px;font-size:60px;font-weight:800;color:${RED}`, 'Fail') +
    [0, 1, 2].map((k) => D('', `left:${TX + 40}px;top:${1300 + k * 105}px;width:90px;height:95px;border-radius:10px 10px 0 0;background:#8a5cd6;border:6px solid #4b2a8a`) + H('dr' + k, `left:${TX + 48}px;top:${1308 + k * 105}px;width:74px;height:83px;background:#efe7fb`)).join('')));
  ADD(PL('plGQ', TX + 265, 1090, 'General<br>quality', 'purple', 60).replace('class="tag purple"', 'class="tag purple pl2"'));
  ADD(PR('lbMsh2', TX - 30, 420, 'Microsoft Copilot<br>harness', 'purple', 60) + PR('lbAlias', TX - 30, 600, 'formerly<br>GitHub Copilot<br>harness', 'amber', 60).replace('style="', 'style="border-radius:50px;') + PR('tgAI', TX - 30, 600, 'AI-based', 'blue', 60) + PR('tgRel', TX - 30, 730, 'relevance · completeness', 'blue', 60));
  ADD(PR('lbStd', TX - 30, 880, 'standard harness only', 'brick', 56) + [['Compare meaning', 0], ['Exact match', 1], ['Tool use', 2], ['…', 3]].map((r) => `<div id="gh${r[1]}" class="rtx" style="right:${3840 - (TX - 30)}px;top:${990 + r[1] * 80}px;color:#8a93a6;opacity:0">${r[0]}</div>`).join(''));
  ADD(PR('ev0', TX - 30, 1295, 'Activity trace · Preview tab', 'purple', 60) + PR('ev1', TX - 30, 1400, 'Conversation history', 'purple', 60) + PR('ev2', TX - 30, 1505, 'Monitor tab', 'purple', 60));
