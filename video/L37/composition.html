<script>
  /* L37 · Review results. World 3840x2160 "Contoso review room" + harness district (x 4400-6000).
     Review room: maker 120,1000 · Nexo 1010,1000 · board x 1440-2670 y 400-1375 · trays y 1620 (centres 1500/1860/2220/2580) · lens stand x 3000 · easels x 1330-2570 · archive x 2500-3300 + box/folder x 3400-3760.
     District: F2 y 40-510 (triage), F1 y 530-990 (three doors), G y 1000-1260. Groups are faded as wholes (gIn gBd gTr gLn gEs gAr gDi gMt). */
  const BLUE = '#2f5bd3', GRN = '#1e7f4f', RED = '#c4392f', AMB = '#d98a00', PUR = '#8a5cd6', NAVY = '#1f2a44', BRICK = '#b4533f', GB = '#4a5a78', GREY = '#8a93a6', CHAR = '#3c4452';
  const D = (id, st, html) => `<div class="w"${id ? ` id="${id}"` : ''} style="${st}">${html || ''}</div>`;
  const H = (id, st, html) => D(id, st + ';opacity:0', html);
  const G = (id, html) => D(id, 'left:0;top:0;width:1px;height:1px;opacity:0', html);
  const PL = (id, x, y, t, c, fs) => pill(id, x, y, t, c).replace('style="', 'style="font-size:' + (fs || 60) + 'px;');
  const SB = (id, x, y, t, fs, c) => say(id, x, y, t, c).replace('style="', 'style="font-size:' + (fs || 60) + 'px;');
  const SH = (id, x, y, w, h, col, fs, html) => `<div class="sh" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-color:${col};font-size:${fs}px">${html}</div>`;
  const pulse = (sel, t, col) => tl.fromTo(sel, { boxShadow: '0 0 0 0 rgba(217,138,0,0)' }, { boxShadow: `0 0 0 10px ${col || 'rgba(217,138,0,.85)'}`, duration: 0.25, yoyo: true, repeat: 1, immediateRender: false }, t);
  const camAt = (x, y, s, t) => CAM(x, y, s, t, 0.01);
  const UIIN2 = (sel, t) => { ON('#uiBack', t - 0.45, 0.4); tl.fromTo(sel, { opacity: 0, scale: 0.28 }, { opacity: 1, scale: 1, duration: 0.7, ease: 'power3.out' }, t); };
  const UIOUT2 = (sel, t) => { tl.to(sel, { opacity: 0, scale: 0.28, duration: 0.5, ease: 'power3.in' }, t); OFF('#uiBack', t + 0.5, 0.4); };
  const SWX = (a, b, t) => { tl.to(a, { opacity: 0, duration: 0.3 }, t); tl.fromTo(b, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, immediateRender: false }, t + 0.3); };
  const NAVC = (sel, k, t, n, col) => { for (let i = 0; i < n; i++) { const on = i === k; tl.to(`${sel}_nv${i}`, { backgroundColor: on ? '#ffffff' : '#f3f5f9', color: on ? col : '#5d6472', fontWeight: on ? 700 : 400, borderLeftColor: on ? col : 'rgba(0,0,0,0)', duration: 0.15 }, t); } };
  const lbl = (t, c) => `<div style="font-size:44px;font-weight:800;margin-bottom:18px;color:${c || '#141821'}">${t}</div>`;
  const pers = (c, w) => person(c).replace('width="90" height="200"', `width="${w}" height="${Math.round(w * 200 / 90)}"`);
  const GRNS = { backgroundColor: '#e3f4ea', borderColor: GRN, color: GRN }, REDS = { backgroundColor: '#fde8e6', borderColor: RED, color: RED };

  /* ═════════ REVIEW ROOM ═════════ */
  const BX = 1440, BY = 400, TC = [1500, 1860, 2220, 2580];
  ADD(D('', 'left:3840px;top:0;width:3400px;height:1500px;background:linear-gradient(#f4f6fa,#eef1f7)') + D('', 'left:3840px;top:1500px;width:3400px;height:660px;background:#e3e7ef') + D('', 'left:3840px;top:1500px;width:3400px;height:6px;background:#d3d9e4'));
  /* intake */
  ADD(G('gIn', maker('mk', 120, 1000) + agent('nx', 1010, 1000, { folder: '' }) +
    D('bndr', 'left:815px;top:1110px;width:160px;height:230px;border-radius:14px;background:#1f2a44;border:8px solid #141b2d;box-sizing:border-box;color:#fff;font-size:46px;font-weight:800;text-align:center;line-height:1.05;padding-top:70px', 'Test<br>set') +
    PL('lbMk', 260, 1530, 'Maker', 'navy', 60).replace('class="tag navy"', 'class="tag navy" data-k="1"') + PL('lbNx', 1190, 1530, 'Nexo · IT agent', 'navy', 54)));
  ADD(PL('chRed', 2400, 260, '12 red', 'red', 64));
  ADD(SH('sh2', 560, 880, 480, 110, BLUE, 50, 'Instructions v2') + SH('sh3', 820, 700, 480, 110, AMB, 50, 'Instructions v3'));
  ADD(SB('bTh', 440, 840, 'rewrite the<br>instructions again?', 56) + H('qm', 'left:380px;top:830px;width:150px;height:150px;border-radius:50%;background:#c4392f;color:#fff;font-size:110px;font-weight:800;text-align:center;line-height:150px', '?'));
  ADD(PL('tgCause', 1030, 870, 'the cause is not here', 'red', 52));
  /* board */
  const slipH = (n) => { const c = (n - 1) % 4, r = Math.floor((n - 1) / 4); return `<div class="sl" id="sl${n}" style="left:${BX + 30 + c * 300}px;top:${BY + 30 + r * 235}px">Case ${n}<span class="ar" id="ar${n}">▲</span></div>`; };
  ADD(G('gBd', D('bdBg', `left:${BX}px;top:${BY}px;width:1230px;height:975px;border-radius:30px;background:#fafbfd;border:8px solid ${GREY};box-shadow:0 30px 80px rgba(16,24,40,.2)`) +
    D('', `left:${BX + 120}px;top:1375px;width:16px;height:125px;background:${GREY}`) + D('', `left:${BX + 1090}px;top:1375px;width:16px;height:125px;background:${GREY}`) +
    Array.from({ length: 16 }, (_, i) => slipH(i + 1)).join('')));
  /* trays */
  const TCOL = [GRN, RED, GREY, CHAR], TBG = ['#e3f4ea', '#fde8e6', '#f1f3f7', CHAR], TN = ['Pass', 'Fail', 'Invalid', 'Error'];
  const fsl = (id, k, t, col, ex) => `<div class="fs" id="${id}" style="left:${TC[k] - 110}px;top:1560px;border-color:${col};color:${col};${ex || ''}">${t}</div>`;
  const FSL = fsl('fp', 0, 'Case 14', GRN) + fsl('ff', 1, 'Case 3', RED) + fsl('fi', 2, 'Case 9', GREY, 'border-style:dashed;') + fsl('fe', 3, 'Case 5', CHAR, 'color:#fff;background:#3c4452;font-size:42px;');
  ADD(G('gTr', [0, 1, 2, 3].map((k) => D('tr' + k, `left:${TC[k] - 140}px;top:1620px;width:280px;height:140px;box-sizing:border-box;border:8px ${k === 2 ? 'dashed' : 'solid'} ${TCOL[k]};border-top:none;border-radius:0 0 26px 26px;background:${TBG[k]}`,
      k === 3 ? IC('settings', 'width:84px;height:84px;color:#fff;position:absolute;left:92px;top:22px') + D('', 'left:50px;top:62px;width:170px;height:10px;border-radius:5px;background:#ff8a80;transform:rotate(-35deg)') : '') +
    `<div class="pl2" style="left:${TC[k]}px;top:1800px;border-color:${TCOL[k]};color:${k === 3 ? '#fff' : TCOL[k]};background:${k === 3 ? CHAR : '#fff'};${k === 2 ? 'border-style:dashed' : ''}">${TN[k]}</div>`).join('') + FSL));
  ADD(PL('tgGr', 1680, 1440, 'graded', 'green', 60) + PL('ckNo', 2220, 1440, 'no expected response', 'grey', 54) + PL('tgInv', 2220, 1900, 'missing what<br>the method needs', 'grey', 52) + PL('tgErr', 2580, 1900, 'execution failure<br>no grade', 'char', 52) + PL('tgBr1', 1680, 1440, 'about the answer', 'green', 56) + PL('tgBr2', 2400, 1440, 'check the run first', 'grey', 56));
  ADD(`<svg class="w" style="left:0;top:0;overflow:visible" width="3840" height="2160" viewBox="0 0 3840 2160"><path id="br1" d="M1360 1595 V1555 H2000 V1595" fill="none" stroke="${NAVY}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0"/><path id="br2" d="M2080 1595 V1555 H2720 V1595" fill="none" stroke="${GREY}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0"/></svg>`);
  /* lens stand */
  ADD(G('gLn', D('', `left:2990px;top:760px;width:20px;height:740px;background:${GREY}`) + D('', `left:2900px;top:1490px;width:200px;height:20px;border-radius:10px;background:${GREY}`) +
    D('lens', 'left:2880px;top:640px;width:300px;height:300px', `<svg width="300" height="300" viewBox="0 0 300 300"><circle cx="120" cy="120" r="90" fill="rgba(47,91,211,.10)" stroke="${BLUE}" stroke-width="18"/><path d="M186 186 L270 270" stroke="${BLUE}" stroke-width="22" stroke-linecap="round"/></svg>`) +
    `<div class="pl2" style="left:3000px;top:1520px;border-color:${BLUE};color:${BLUE};font-size:54px">Show activity map</div>`));
  /* easels */
  const R1 = ['F', 'F', 'F', 'F', 'F', 'P', 'F', 'F'], R2 = ['P', 'P', 'P', 'P', 'P', 'F', 'F', 'F'];
  const eRow = (r, i, v) => `<div class="er" id="e${r}r${i}" style="left:${r === 1 ? 1350 : 2030}px;top:${520 + i * 95}px">Case ${i + 1}<span class="ph">—</span><span class="rs" id="e${r}s${i}" style="color:${v === 'P' ? GRN : RED}">${v === 'P' ? 'Pass' : 'Fail'}</span></div>`;
  ADD(G('gEs', D('', `left:1380px;top:1300px;width:16px;height:200px;background:${GREY}`) + D('', `left:1824px;top:1300px;width:16px;height:200px;background:${GREY}`) + D('', `left:2060px;top:1300px;width:16px;height:200px;background:${GREY}`) + D('', `left:2504px;top:1300px;width:16px;height:200px;background:${GREY}`) +
    D('', `left:1330px;top:400px;width:560px;height:900px;box-sizing:border-box;border:8px solid ${GREY};border-radius:26px;background:#fafbfd;box-shadow:0 30px 80px rgba(16,24,40,.2)`) + D('', `left:2010px;top:400px;width:560px;height:900px;box-sizing:border-box;border:8px solid ${GREY};border-radius:26px;background:#fafbfd;box-shadow:0 30px 80px rgba(16,24,40,.2)`) +
    D('', 'left:1330px;top:425px;width:560px;text-align:center;font-size:64px;font-weight:800', 'Run 1') + D('', 'left:2010px;top:425px;width:560px;text-align:center;font-size:64px;font-weight:800', 'Run 2') +
    R1.map((v, i) => eRow(1, i, v)).join('') + R2.map((v, i) => eRow(2, i, v)).join('') +
    [0, 1, 2, 3, 4, 5].map((i) => D('eA' + i, `left:1912px;top:${524 + i * 95}px;width:76px;text-align:center;font-size:60px;font-weight:800;opacity:0;color:${i < 5 ? GRN : RED}`, i < 5 ? '▲' : '▼')).join('') +
    H('ehl', `left:1340px;top:990px;width:1230px;height:96px;box-sizing:border-box;border:6px dashed ${RED};border-radius:16px`)));
  ADD(PL('tgSame', 1950, 300, 'same test set', 'blue', 60) + PL('tgLeg', 1950, 1330, '▲ failing → passing · ▼ passing → failing', 'navy', 46) + PL('cn1', 1610, 1415, '5 ▲', 'green', 64) + PL('cn2', 2290, 1415, '1 ▼', 'red', 64) + PL('tgNext', 2950, 990, 'open this one next', 'red', 56));
  ADD(SH('shEd', 1600, 1540, 700, 90, AMB, 46, 'Instructions edited'));
  /* archive */
  const AR2 = SH('csv1', 3430, 905, 300, 170, GB, 60, 'CSV') +
    D('boxB', `left:3400px;top:900px;width:360px;height:200px;border-radius:10px;background:#0e8f8f;color:#fff;font-size:52px;font-weight:800;text-align:center;line-height:200px;opacity:0`, 'CSV export') + D('lid', `left:3400px;top:850px;width:360px;height:55px;border-radius:10px;background:#0b7373;transform-origin:0 100%;opacity:0`) +
    SH('csv2', 3430, 700, 300, 170, GB, 60, 'CSV') +
    D('fld', `left:3400px;top:1250px;width:360px;height:220px;border-radius:0 18px 18px 18px;background:#e5b886;border:6px solid #8a5a2b;box-sizing:border-box;color:#141821;font-size:54px;font-weight:800;text-align:center;line-height:1.1;padding-top:60px;opacity:0`, 'Audit<br>history');
  ADD(G('gAr', D('', `left:2500px;top:640px;width:800px;height:860px;box-sizing:border-box;border:8px solid ${GREY};border-radius:20px;background:#d3d9e4`) +
    D('', `left:2540px;top:1250px;width:720px;height:110px;border-radius:12px;background:#b5bcca`) + D('', `left:2540px;top:1380px;width:720px;height:100px;border-radius:12px;background:#b5bcca`) + D('', `left:2860px;top:1290px;width:80px;height:20px;border-radius:10px;background:#8a93a6`) + D('', `left:2860px;top:1410px;width:80px;height:20px;border-radius:10px;background:#8a93a6`) +
    [0, 1, 2].map((k) => D('as' + k, `left:${2530 + k * 250}px;top:700px;width:220px;height:110px;box-sizing:border-box;border:6px solid ${GREY};border-radius:14px;background:#fff;font-size:48px;font-weight:800;display:flex;align-items:center;justify-content:center`, 'Case ' + (k + 1))).join('') +
    D('cal', `left:2700px;top:880px;width:400px;height:320px;box-sizing:border-box;border:6px solid ${RED};border-radius:20px;background:#fff;overflow:hidden`,
      D('', 'left:0;top:0;width:388px;height:70px;background:#c4392f') + D('calA', 'left:0;top:70px;width:388px;height:240px;text-align:center;line-height:240px;font-size:100px;font-weight:800;color:#5d6472', 'Day 1') +
      D('calB', 'left:0;top:70px;width:388px;height:240px;text-align:center;padding-top:10px;font-weight:800;color:#c4392f;opacity:0', '<div style="font-size:116px;line-height:130px">89</div><div style="font-size:56px;line-height:60px;margin-top:14px">days</div>')) + AR2));
  ADD(PL('tgGone', 2220, 880, 'then gone', 'red', 52) + PL('tgKept', 2220, 860, 'results kept<br>89 days', 'amber', 52) + PL('tgAud', 2220, 860, 'for audits and<br>later comparisons', 'green', 50));
  /* mini tower (closing wide shot) */
  ADD(G('gMt', D('mtB', `left:3000px;top:520px;width:650px;height:980px;box-sizing:border-box;border:6px solid #5b8be6;border-radius:24px 24px 0 0;background:linear-gradient(135deg,#efe7fb,#c9b4f0 55%,#efe7fb)`) +
    D('', 'left:3000px;top:760px;width:650px;height:8px;background:#8a5cd6') + D('', 'left:3000px;top:1000px;width:650px;height:8px;background:#8a5cd6') +
    [0, 1, 2].map((k) => D('', `left:${3070 + k * 190}px;top:580px;width:130px;height:150px;border-radius:10px 10px 0 0;background:#efe7fb;border:6px solid #8a5cd6;box-sizing:border-box`)).join('') +
    D('mtDoor', `left:3140px;top:1040px;width:370px;height:460px;box-sizing:border-box;border:8px solid ${PUR};border-radius:20px 20px 0 0;background:#fff;text-align:center;font-size:96px;font-weight:800;color:#4b2a8a;padding-top:60px`, 'Setup') +
    D('mtPlug', `left:2790px;top:1190px;width:200px;height:200px;color:${PUR}`, IC('plug_connected', 'width:200px;height:200px')) +
