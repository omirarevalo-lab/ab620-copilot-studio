<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>L41 · Microsoft IQ · world style</title>
<script src="gsap.min.js"></script>
<!-- TAIL 2.5 -->
<link rel="stylesheet" href="style.css" />
<style>
  .cf { position: absolute; left: 0; top: 0; width: 260px; height: 180px; display: flex; align-items: center; justify-content: center; background: #8a5cd6; color: #fff; font-size: 40px; font-weight: 800; border-radius: 22px; border: 5px solid #fff; box-sizing: border-box; backface-visibility: hidden; }
  .trr { display: flex; align-items: center; gap: 14px; height: 66px; border-bottom: 2px solid var(--line); font-size: 30px; padding: 0 8px; }
  .trr .ic { width: 38px; height: 38px; }
  .tcase { position: absolute; left: 0; top: 0; right: 0; opacity: 0; }
  .hint { margin-top: 24px; display: flex; align-items: center; gap: 14px; background: var(--amber-soft); border: 3px solid var(--amber); border-radius: 18px; padding: 14px 20px; font-size: 30px; font-weight: 800; color: #7a4d00; }
  .hint .ic { width: 40px; height: 40px; color: var(--amber); }
  .brow { position: absolute; left: 30px; width: 1440px; height: 112px; display: flex; align-items: center; gap: 24px; font-size: 52px; font-weight: 700; color: #141821; opacity: 0; }
  .brow .l { width: 690px; } .brow .ar { width: 70px; font-size: 56px; font-weight: 800; color: #8a93a6; }
  .brow .rr { color: #fff; border-radius: 22px; padding: 12px 28px; font-size: 52px; font-weight: 800; white-space: nowrap; }
  .tcard { position: absolute; height: 120px; display: flex; align-items: center; gap: 18px; padding: 0 30px; box-sizing: border-box; background: #fff; border: 7px solid var(--accent); border-radius: 28px; font-size: 48px; font-weight: 800; color: var(--accent); box-shadow: var(--shadow); opacity: 0; white-space: nowrap; }
  .tcard .ic { width: 64px; height: 64px; }
  .bars div { position: absolute; bottom: 0; width: 18%; border-radius: 8px 8px 0 0; }
  .stab { position: absolute; top: 100px; width: 232px; height: 80px; box-sizing: border-box; border: 4px solid #b79ae6; border-radius: 18px; background: #efe8fa; color: #8a5cd6; font-size: 36px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .cdn { position: absolute; background: #fff; border-radius: 24px; border: 6px solid #8a5cd6; box-shadow: var(--shadow); opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="{{DURATION}}">
<section class="clip" data-start="0" data-duration="{{DURATION}}" data-track-index="2">
<div id="stage"></div>
</section>
<audio id="narr" src="narration.mp3" data-start="0" data-duration="{{DURATION}}" data-track-index="1" data-volume="1"></audio>
</div>

<!-- @world -->
<script>
  /* L41 · Microsoft IQ. Layout (world 3840x2160): maker 420,1040 · agent 1720,1010 · toolbox 2200,1230 · Foundry library 300,140 · Fabric tower 2900,120 · Work IQ office 2900,1560 · admin 3380,900 */
  const PX = (id, x, y, t, c, fs) => pill(id, x, y, t, c).replace('style="', 'style="font-size:' + Math.max(fs || 34, 52) + 'px;');
  const BLUE = '#2f5bd3', PUR = '#8a5cd6', GRN = '#1e7f4f';

  /* ───────── world: cables first (behind everything) ───────── */
  const dF = 'M1200 800 C 1600 800, 2000 1000, 2250 1230', dX = 'M3080 900 C 2950 1080, 2600 1050, 2370 1230', dW = 'M2900 1900 C 2750 1900, 2650 1500, 2500 1345';
  ADD(`<svg class="w" id="cabs" style="left:0;top:0" width="3840" height="2160" viewBox="0 0 3840 2160">
    ${cable('gF', dF, '#8a93a6', 10, '18 16')}${cable('gX', dX, '#8a93a6', 10, '18 16')}${cable('gW', dW, '#8a93a6', 10, '18 16')}
    ${cable('cbF', dF, BLUE, 14)}${cable('cbX', dX, BLUE, 14)}${cable('cbW', dW, BLUE, 14)}
    ${cable('cbA', 'M2030 1300 C 2100 1300, 2120 1335, 2200 1335', BLUE, 14)}
    ${cable('cbRef', 'M1830 1040 C 1650 900, 1450 650, 1210 620', BLUE, 12)}
    ${cable('cbCA', 'M930 1650 C 1250 1700, 1550 1600, 1760 1440', BLUE, 12)}
    ${cable('lnAdm', 'M3400 1200 C 3200 1250, 2950 1300, 2780 1310', '#c4392f', 6, '16 14')}
  </svg>`);

  /* Foundry IQ: library with binders, librarian (teal) and compliance team */
  let binders = '';
  for (let r = 0; r < 2; r++) for (let k = 0; k < 6; k++) { const x = 70 + k * 85, y = 230 + r * 220, c = ['#3a6fdc', '#5b8be6', '#2a4fb0'][(k + r) % 3]; binders += `<g id="bd${r * 6 + k}"><rect x="${x}" y="${y}" width="68" height="150" rx="8" fill="${c}" stroke="#fff" stroke-width="3"/><rect x="${x + 12}" y="${y + 20}" width="44" height="30" rx="4" fill="#fff" opacity=".85"/></g>`; }
  ADD(`<div class="w" id="bF" style="left:300px;top:140px;width:900px;height:800px;opacity:0">
    <svg class="w" style="left:0;top:0" width="900" height="780" viewBox="0 0 900 780">
      <rect x="10" y="120" width="880" height="640" rx="30" fill="#e6ecfb" stroke="#7ea1e6" stroke-width="8"/><rect x="0" y="60" width="900" height="90" rx="26" fill="#2f5bd3"/>
      <text x="450" y="125" font-size="54" font-weight="800" fill="#fff" text-anchor="middle">Microsoft Foundry</text>
      <rect x="50" y="380" width="520" height="16" rx="6" fill="#8fa6dc"/><rect x="50" y="600" width="520" height="16" rx="6" fill="#8fa6dc"/>${binders}
      <rect x="600" y="650" width="280" height="110" rx="14" fill="#c9d8f7"/>
      <circle cx="690" cy="470" r="34" fill="#f2c9a6"/><path d="M640 650 Q640 520 690 508 Q740 520 740 650 Z" fill="#0f6f85"/>
      <circle cx="800" cy="570" r="22" fill="#f2c9a6"/><path d="M768 650 Q768 600 800 592 Q832 600 832 650 Z" fill="#1f2a44"/>
      <circle cx="852" cy="570" r="22" fill="#f2c9a6"/><path d="M820 650 Q820 600 852 592 Q884 600 884 650 Z" fill="#7a4d00"/>
    </svg>
    ${PX('dF', 450, -50, 'knows policies', 'blue', 46)}${PX('nF', 450, -50, 'Foundry IQ', 'blue', 54)}${PX('lbLeave', 190, 150, 'Leave policy', 'blue', 40)}${PX('lbKB', 330, 650, 'Knowledge base', 'blue', 40)}${PX('lbTeam', 760, 790, 'Compliance team', 'blue', 56)}
  </div>`);
  /* Fabric IQ: data tower, semantic-model block (3 tabs), analyst (purple) */
  ADD(`<div class="w" id="bX" style="left:2900px;top:220px;width:800px;height:900px;opacity:0">
    <svg class="w" style="left:0;top:0" width="800" height="820" viewBox="0 0 800 820">
      <rect x="150" y="300" width="500" height="500" rx="30" fill="#efe8fa" stroke="#8a5cd6" stroke-width="8"/><rect x="130" y="250" width="540" height="70" rx="20" fill="#8a5cd6"/>
      <path d="M200 740 H600" stroke="#8a93a6" stroke-width="6"/>
      ${[[210, 160], [300, 260], [390, 200], [480, 330], [570, 240]].map(([x, h]) => `<rect x="${x - 25}" y="${740 - h}" width="56" height="${h}" rx="6" fill="${h > 250 ? '#8a5cd6' : '#b79ae6'}"/>`).join('')}
      <circle cx="75" cy="560" r="34" fill="#f2c9a6"/><path d="M25 800 Q25 600 75 590 Q125 600 125 800 Z" fill="#8a5cd6"/>
    </svg>
    <div class="w" id="semB" style="left:20px;top:10px;width:760px;height:210px;background:#fff;border:6px solid #8a5cd6;border-radius:28px;box-shadow:var(--shadow);opacity:0;box-sizing:border-box">
      <div style="position:absolute;left:0;right:0;top:14px;text-align:center;font-size:48px;font-weight:800;color:#8a5cd6">Semantic model</div>
      ${['measures', 'hierarchies', 'dimensions'].map((t, k) => `<div class="stab" id="stab${k}" style="left:${14 + k * 242}px">${t}</div>`).join('')}</div>
    ${PX('dX', 400, -85, 'business numbers', 'purple', 46)}${PX('nX', 400, -85, 'Fabric IQ', 'purple', 54)}${PX('pvX', 400, 835, 'Preview', 'amber', 54)}
  </div>`);
  /* Work IQ: open office with floating icons, assistant (green) */
  ADD(`<div class="w" id="bW" style="left:2900px;top:1500px;width:940px;height:600px;opacity:0">
    <svg class="w" style="left:0;top:0" width="940" height="600" viewBox="0 0 940 600">
      <rect x="0" y="60" width="900" height="500" rx="40" fill="#e3f4ea" stroke="#7fc6a0" stroke-width="8"/>
      ${[60, 330, 600].map((x) => `<rect x="${x}" y="440" width="240" height="24" rx="8" fill="#8a93a6"/><rect x="${x + 20}" y="464" width="14" height="80" fill="#8a93a6"/><rect x="${x + 206}" y="464" width="14" height="80" fill="#8a93a6"/><rect x="${x + 70}" y="370" width="100" height="70" rx="8" fill="#1f2a44"/>`).join('')}
      <circle cx="840" cy="370" r="34" fill="#f2c9a6"/><path d="M790 550 Q790 420 840 408 Q890 420 890 550 Z" fill="#1e7f4f"/>
    </svg>
    ${PX('dW', 330, -50, 'how teams work', 'green', 46)}${PX('nW', 130, -35, 'Work IQ', 'green', 54)}${PX('pvW', 450, -35, 'Preview', 'amber', 54)}
  </div>`);
  const wd = (id, x, y, ic, lb) => disc(id, x, y, ic, lb).replace('class="capi"', 'class="capi wd"');
  ADD(`<style>.wd .disc { border-color: #1e7f4f; color: #1e7f4f; } .capi.wd { width: 300px; } .wd b { font-size: 52px; white-space: nowrap; }</style>${wd('wi0', 3010, 1740, 'document_text', 'Files')}${wd('wi1', 3220, 1740, 'mail', 'Email')}${wd('wi2', 3430, 1740, 'calendar', 'Meetings')}${wd('wi3', 3640, 1740, 'chat', 'Chats')}`);
  /* admin tower (scene 10-11) */
  ADD(admin('adm', 3380, 900) + PX('nAdm', 3610, 760, 'Microsoft 365<br>admin center', 'navy', 40));
  gsap.set('#adm', { opacity: 0 });

  /* maker, agent, toolbox */
  ADD(maker('mk', 420, 1040) + agent('bot', 1720, 1010, { folder: 'HR' }) + PX('tagBot', 1900, 1500, 'HR agent', 'blue', 56));
  ADD(`<div class="w" id="tb" style="left:2200px;top:1230px;width:300px;height:220px;border-radius:36px;background:#1f2a44;box-shadow:0 20px 50px rgba(16,24,40,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-size:60px;font-weight:800">${IC('wrench', 'width:92px;height:92px')}Tools</div>
    <div class="w" id="sF" style="left:2236px;top:1216px;width:28px;height:28px;border-radius:50%;background:#fff;border:6px solid #8a93a6;box-sizing:border-box"></div>
    <div class="w" id="sX" style="left:2356px;top:1216px;width:28px;height:28px;border-radius:50%;background:#fff;border:6px solid #8a93a6;box-sizing:border-box"></div>
    <div class="w" id="sW" style="left:2486px;top:1331px;width:28px;height:28px;border-radius:50%;background:#fff;border:6px solid #8a93a6;box-sizing:border-box"></div>`);
  ADD(PX('lbSock', 2420, 1110, 'Foundry IQ: 1 connection', 'blue', 46));

  /* people with questions (scene 0, 16) */
  const PCOL = ['#8a5cd6', '#1e7f4f', '#7a4d00'], PXS = [1300, 1855, 2435];
  PXS.forEach((x, k) => ADD(crowd('p' + k, x, 1650, PCOL[k])));
  ADD(say('bb0', 1345, 1530, 'Parental leave policy?') + say('bb1', 1900, 1530, 'Revenue by region?') + say('bb2', 2480, 1530, 'Meetings about a renewal?'));
  ADD(say('an0', 1345, 1500, 'Leave policy', 'green') + say('an1', 1880, 1500, 'Revenue by region', 'green') + say('an2', 2510, 1500, 'Renewal meetings', 'green'));
  ADD(`<div class="lab" id="qm0" style="left:1600px;top:880px;font-size:130px;color:#d98a00">?</div><div class="lab" id="qm1" style="left:2060px;top:880px;font-size:130px;color:#d98a00">?</div><div class="lab" id="qm2" style="left:1830px;top:780px;font-size:130px;color:#d98a00">?</div>`);
  ADD(PX('roP', 2800, 1290, `${IC('eye', 'width:56px;height:56px;vertical-align:-8px')} Read-only`, 'green', 56));
  gsap.set('#bot_fold text', { attr: { 'font-size': 52, y: 408 } });
  gsap.set(['.sb'], { opacity: 0 }); gsap.set(['#an0', '#an1', '#an2'], { fontSize: 58 });

  /* scene 1: envelopes */
  [0, 1, 2].forEach((k) => ADD(`<div class="w" id="env${k}" style="left:1850px;top:1060px;width:100px;height:100px;border-radius:50%;background:#fff;border:6px solid #2f5bd3;color:#2f5bd3;display:flex;align-items:center;justify-content:center;opacity:0">${IC('question_circle', 'width:64px;height:64px')}</div>`));

  /* scene 2: reuse, never copy */
  ADD(chip('docMv', 1000, 1230, 'document_text', 'Document', 'sm blue') + PX('lbKS', 1300, 1640, 'Knowledge source: you upload', 'blue', 46) + PX('lbIQ', 1480, 700, 'IQ: points to it', 'blue', 46));
  ADD(`<div class="w" id="cpIc" style="left:1380px;top:780px;width:130px;height:130px;border-radius:30px;background:#fff;border:6px solid #8a93a6;color:#8a93a6;display:flex;align-items:center;justify-content:center;opacity:0">${IC('copy', 'width:80px;height:80px')}<i id="cpX" style="position:absolute;left:-20px;right:-20px;top:58px;height:12px;border-radius:6px;background:#c4392f;transform:rotate(-35deg);opacity:0"></i></div>
    <div class="w" id="filt" style="left:1495px;top:800px;width:130px;height:130px;border-radius:50%;background:#fff;border:7px solid #d98a00;color:#d98a00;display:flex;align-items:center;justify-content:center;opacity:0">${IC('filter', 'width:76px;height:76px')}</div>`);
  ADD(PX('lbAcc', 1560, 945, 'only what you can access', 'amber', 46));

  /* scene 4: keys + door */
  ADD(`<svg class="w" id="ring" style="left:1500px;top:330px;opacity:0" width="320" height="320" viewBox="0 0 320 320"><circle cx="160" cy="160" r="120" fill="none" stroke="#8a93a6" stroke-width="18"/></svg>
    ${[[1615, 325], [1735, 445], [1615, 565], [1495, 445]].map(([x, y]) => `<div class="w ringk" style="left:${x}px;top:${y}px;color:#d98a00;opacity:0">${IC('key', 'width:90px;height:90px')}</div>`).join('')}`);
  const KEYS = ['API key', 'Client certificate', 'Service principal', 'Entra ID integrated'];
  KEYS.forEach((t, k) => ADD(chip('k' + k, 1900, 330 + k * 115, 'key', t, 'blue').replace('class="chip', 'class="chip kc').replace('style="', 'style="width:620px;height:96px;font-size:44px;')));
  ADD(`<svg class="w" id="door" style="left:2700px;top:140px;opacity:0" width="200" height="370" viewBox="0 0 260 480"><rect x="10" y="10" width="240" height="460" rx="14" fill="#1f2a44"/><rect x="34" y="34" width="192" height="436" fill="#e6ecfb"/><circle cx="196" cy="260" r="12" fill="#1f2a44"/></svg>` + PX('lbDoor', 2800, 530, 'Search Service<br>endpoint', 'navy', 52));
  ADD(`<div class="w" id="plg2" style="left:2020px;top:960px;width:100px;height:100px;border-radius:24px;background:#fff;border:6px solid #2f5bd3;color:#2f5bd3;display:flex;align-items:center;justify-content:center;opacity:0">${IC('plug_connected', 'width:64px;height:64px')}</div>`);

  /* scene 6: tool cards, bubble, description card */
  ADD(`<div class="tcard" id="tcA" style="left:1250px;top:260px;width:420px">${IC('wrench')}Policy tool</div><div class="tcard" id="tcB" style="left:2330px;top:260px;width:420px">${IC('wrench')}Other tool</div>
    <svg class="w" id="arrs" style="left:0;top:0" width="3840" height="1200" viewBox="0 0 3840 1200"><path id="arA" d="M1480 390 L1850 500" stroke="#c4392f" stroke-width="12" stroke-linecap="round" fill="none" opacity="0"/><path id="arB" d="M2550 390 L2150 500" stroke="#c4392f" stroke-width="12" stroke-linecap="round" fill="none" opacity="0"/></svg>`);
  ADD('<div class="w" id="qbw" style="left:0;top:0">' + say('qb', 1990, 600, 'Parental leave?', 'blue') + '</div>');
  ADD(`<div class="w" id="dcard" style="left:1250px;top:430px;width:900px;height:430px;background:#fff;border:7px solid #2f5bd3;border-radius:34px;box-shadow:var(--shadow);opacity:0;padding:26px 34px;font-size:46px;font-weight:700;line-height:1.35;color:#141821">
    <div style="color:#2f5bd3;font-weight:800">Policy tool · description</div>
    <div id="dl0" style="opacity:0;margin-top:8px"><span style="color:#2f5bd3;font-weight:800">When to use:</span> HR policy questions</div>
    <div id="dl1" style="opacity:0"><span style="color:#1e7f4f;font-weight:800">Returns:</span> policy text</div>
    <div id="dl2" style="opacity:0"><span style="color:#c4392f;font-weight:800">Not:</span> salaries, personal data</div></div>`);

  /* scene 7: rebuild chart, revenue chart */
  const chart = (id, x, y, w, h, col, title) => `<div class="cdn" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-color:${col}">${title ? `<div style="position:absolute;left:0;right:0;top:14px;text-align:center;font-size:40px;font-weight:800;color:#141821">${title}</div>` : ''}
    <div class="bars" style="position:absolute;left:36px;right:36px;bottom:30px;top:${title ? 80 : 40}px">${[40, 70, 55, 90, 65].map((p, k) => `<div class="cb ${id}b" style="left:${k * 20 + 1}%;height:${p}%;background:${col}"></div>`).join('')}</div></div>`;
  ADD(chart('chRb', 2230, 560, 360, 250, '#8a93a6', '') + `<div class="w" id="rbP" style="left:2110px;top:620px;opacity:0">${person('#2f5bd3')}</div><div class="lab" id="rbX" style="left:2330px;top:520px;font-size:260px;color:#c4392f">✕</div>` + PX('lbNoRb', 2410, 450, "don't rebuild", 'red', 48));
  ADD(chart('chRev', 3070, 760, 460, 330, '#8a5cd6', 'Revenue by region'));

  /* scene 10-11: Work IQ read-only, MCP bay */
  ADD(`<div class="w" id="plugW" style="left:2470px;top:1300px;width:100px;height:100px;border-radius:50%;background:#fff;border:7px solid #1e7f4f;color:#1e7f4f;display:flex;align-items:center;justify-content:center;opacity:0">${IC('plug_connected', 'width:60px;height:60px')}</div>`);
  ADD(PX('lbMcp', 2660, 1560, 'MCP tool', 'green', 46));
  ADD(`<div class="w" id="eyeD" style="left:2620px;top:1090px;width:120px;height:120px;border-radius:50%;background:#fff;border:7px solid #1e7f4f;color:#1e7f4f;display:flex;align-items:center;justify-content:center;opacity:0">${IC('eye', 'width:70px;height:70px')}</div>` + PX('lbRO', 3040, 1120, 'Read-only', 'green', 46));
  ADD(`<div class="w" id="penD" style="left:2620px;top:1250px;width:120px;height:120px;border-radius:50%;background:#fff;border:7px solid #8a93a6;color:#8a93a6;display:flex;align-items:center;justify-content:center;opacity:0"><svg width="70" height="70" viewBox="0 0 70 70"><path d="M10 60 L14 44 L44 14 a6 6 0 0 1 8 0 l4 4 a6 6 0 0 1 0 8 L26 56 Z" fill="currentColor"/></svg>
    <div id="penLk" style="position:absolute;right:-18px;bottom:-14px;width:60px;height:60px;border-radius:50%;background:#c4392f;color:#fff;display:flex;align-items:center;justify-content:center">${IC('lock_closed', 'width:36px;height:36px')}</div></div>` + PX('lbWr', 3060, 1280, 'admin enables writes', 'red', 42) + PX('lbDef', 3060, 1280, 'default: read', 'green', 46));
  ADD(`<div class="w" id="bay" style="left:2130px;top:1520px;width:730px;height:320px;background:#fff;border:7px solid #1f2a44;border-radius:34px;box-shadow:var(--shadow);opacity:0">
    <div style="position:absolute;left:30px;top:16px;font-size:48px;font-weight:800;color:#1f2a44">MCP servers</div>
    ${[0, 1, 2, 3].map((k) => `<div class="w mcp" id="mc${k}" style="left:${24 + k * 176}px;top:150px;width:150px;height:110px;border-radius:24px;background:#e3f4ea;border:6px solid #1e7f4f;color:#1e7f4f;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;gap:6px;box-sizing:border-box;${k === 3 ? 'opacity:0' : ''}">${IC('plug_connected', 'width:40px;height:40px')}MCP</div>`).join('')}</div>`);
  ADD(PX('lbSkip', 2360, 1860, 'skipped this turn', 'amber', 52) + PX('lbFew', 2480, 1955, 'Keep MCP servers few', 'green', 52));

  /* scene 13: decision board + connected agent */
  const BR = [['Another team\'s policies', 'Foundry IQ', BLUE], ['Fabric semantic model', 'Fabric IQ', PUR], ['Email, files, meetings', 'Work IQ', GRN], ['Your own documents', 'Knowledge source', '#1f2a44'], ['Another agent\'s domain', 'Connected agent', '#d98a00']];
  ADD(`<div class="w" id="board" style="left:1330px;top:250px;width:1500px;height:770px;background:#fff;border:8px solid #1f2a44;border-radius:40px;box-shadow:var(--shadow);opacity:0">
    <div style="position:absolute;left:34px;top:18px;font-size:60px;font-weight:800;color:#1f2a44">Who maintains the context?</div>
    ${BR.map(([l, r, c], k) => `<div class="brow" id="br${k}" style="top:${108 + k * 126}px"><span class="l">${l}</span><span class="ar">→</span><span class="rr" style="background:${c}">${r}</span></div>`).join('')}</div>`);
  ADD(`<div class="w" id="bot2" style="left:780px;top:1550px;opacity:0">${miniBot(150)}</div>` + PX('lbBot2', 855, 1470, 'Other agent', 'amber', 44));
